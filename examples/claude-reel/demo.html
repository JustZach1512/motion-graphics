html, body { margin: 0; background: #050507; overflow: hidden; }
#wrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0B0B10; font-family: 'Inter Tight', sans-serif; color: #fff; }
.layer, .panel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
.abs { position: absolute; white-space: nowrap; }
.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
.circ { position: absolute; border-radius: 50%; }
.caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -0.18em; background: #FF4F1A; margin-left: .06em; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; padding: .05em .01em .03em; }
.mask > span { display: inline-block; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; opacity: .55; }
#hud .br { position: absolute; width: 44px; height: 44px; border-color: currentColor; border-style: solid; border-width: 0; }
#hud .t { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: .14em; white-space: nowrap; }
#rec { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #FF2A2A; margin-right: 10px; vertical-align: 0; }
#grain, #vig { position: absolute; inset: 0; pointer-events: none; }
#grain { opacity: .5; }

/* S1 */
#grid { position: absolute; inset: -60px; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 80px 80px; background-position: 20px 20px; }

/* S2 */
#s2col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0B10; }
#s2title { font-size: 340px; line-height: .86; letter-spacing: -.035em; white-space: nowrap; }
#s2dot { display: inline-block; width: .17em; height: .17em; border-radius: 50%; background: #EDEBE4; margin-left: .03em; vertical-align: baseline; }

/* S3 */
.word { font-weight: 900; letter-spacing: -.04em; line-height: 1; left: 960px; top: 540px; }
#pat { position: absolute; inset: 0; overflow: hidden; }
#pat div { font-weight: 900; font-size: 136px; line-height: 1.05; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 2px rgba(255,79,26,.32); white-space: nowrap; }
.sq { display: inline-block; width: 14px; height: 14px; margin-left: 10px; background: #FF4F1A; vertical-align: -1px; }
.vf { position: absolute; width: 70px; height: 70px; border: 0 solid #fff; }

/* S4 */
#cubes { position: absolute; left: 0; top: 0; }

/* S5 */
#s5 { perspective: 2200px; }
#grp { position: absolute; left: 410px; top: 230px; width: 1100px; height: 620px; transform-style: preserve-3d; }
.card { position: absolute; inset: 0; background: #fff; border-radius: 24px; color: #0B0B10; }
#card { box-shadow: 0 40px 90px rgba(11,11,16,.20), 0 2px 0 rgba(11,11,16,.04); }
.thumb { position: absolute; top: 500px; width: 150px; height: 84px; border-radius: 10px; }
#btn { position: absolute; left: 790px; top: 292px; width: 262px; height: 66px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 26px; color: #fff; }
#toast { position: absolute; right: 70px; top: 104px; height: 64px; padding: 0 26px; border-radius: 16px; background: #0B0B10; color: #EDEBE4; display: flex; align-items: center; gap: 14px; font-size: 20px; }

/* S7 */
#endcol { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#endtitle { font-size: 230px; font-weight: 900; line-height: .86; letter-spacing: -.04em; }
#enddot { display: inline-block; width: .17em; height: .17em; margin-left: .03em; }

/* preview controls */
#ctl { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #111; color: #ccc; font: 13px 'JetBrains Mono', monospace; }
#ctl button { background: #FF4F1A; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
#ctl input { flex: 1; accent-color: #FF4F1A; }
</style>
</head>

<script>
/* BEAT SHEET — 128 BPM, B = 0.46875 s, 32 beats = 15 s
   b0     0.00  ink + grid. silence, low pad
   b0.5   0.23  orange dot pops                         blip
   b1.5   0.70  dot stretches into a timeline line       whoosh
   b2     0.94  label "claude / motion graphics — 2026"  typed ticks
   b2.5   1.17  line wobbles, beat ticks drop on it      boing · riser starts
   b3.5   1.64  line floods vertically -> orange
   b4     1.88  BRAND: kicker, CLAUDE letters on 1/16s   impact, kick + clap begin, blips
   b5     2.34  cream full stop pops
   b5.75  2.70  weight morph thin -> black, serif line
   b7     3.28  full stop detaches, hops to centre       whoosh
   b7.35  3.45  ...and grows into cream screen
   b8     3.75  CÓDIGO (ink on cream) + serif + mono     impact (light), blip, hats begin
   b10    4.69  AL BEAT (orange on black, outline rows)  blip, hard swap on the beat
   b12    5.63  A 60 FPS (white on blue, viewfinder)     blip, hard swap on the beat
   b13.3  6.23  iris grows out of the "0"                whoosh
   b14    6.56  GENERATIVE: cube field rises, ripples on every beat, camera orbits   impact, 16th arp
   b15    7.03  FÍSICA, / b16 no plantillas.
   b19.4  9.09  cream bar wipes left -> right            whoosh
   b20    9.38  PRODUCT: floating card + ghosts           impact (light)
   b20.5  9.61  the prompt types itself                  key ticks
   b22.75 10.66 cursor flicks motion blur on             click
   b23.25 10.90 cursor presses Renderizar                click
   b23.5  11.02 progress 0 -> 900 frames, thumbs pop     rising tone
   b25.25 11.84 Hecho ✓ + toast                           chime, whoosh
   b26    12.19 card collapses into an orange dot         drums stop
   b26.3  12.33 ink iris out of the dot                  impact
   b26.75 12.54 ring pulse
   b27.25 12.77 dot glides into the logo dot, CLAUDE letters   boom + bell ring-out
   b28.5  13.36 tagline · b29 rule · b29.5 mono line types    soft blips
   b32    15.00 end
*/
const W = 1920, H = 1080, DUR = 15;
window.VIDEO = { w: W, h: H, duration: DUR };
const B = 60 / 128, b = n => n * B;
const C = { ink: '#0B0B10', acc: '#FF4F1A', cream: '#EDEBE4', blue: '#2F47FF' };
const RENDER = location.search.includes('render');
const $ = id => document.getElementById(id);
const stage = $('stage');

// ---- helpers (from the skill) ----
function spring(t, w = 14, z = 0.82) {

const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };

const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeIn = x => (x = clamp(x), x * x * x);
const easeOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const lerp = (a, c, k) => a + (c - a) * k;
const seg = (t, a, c) => clamp((t - a) / (c - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

const show = (el, on) => { el.style.display = on ? 'block' : 'none'; };
const op = (el, v) => { el.style.opacity = v; };
const tf = (el, s) => { el.style.transform = s; };
const circ = (el, x, y, r) => { el.style.left = (x - r) + 'px'; el.style.top = (y - r) + 'px'; el.style.width = el.style.height = (2 * r) + 'px'; };
function sRect(el) { const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width / W; return { x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k, cx: (r.left + r.width / 2 - s.left) / k, cy: (r.top + r.height / 2 - s.top) / k }; }
const caretOn = (t, t1) => t < t1 || Math.floor(t * 4) % 2 === 0;
function typed(el, full, t, t0, t1, caret = true, hold = 0.8) {
  if (t < t0) { el.innerHTML = ''; return; }
  const n = Math.floor(full.length * seg(t, t0, t1));
  el.innerHTML = full.slice(0, n) + (caret && t < t1 + hold && caretOn(t, t1) ? '<span class="caret"></span>' : '');
}
// a word that enters fast with blur/skew and lands with overshoot
function slam(el, t, t0, { dx = 380, dy = 0, base = 'translate(-50%,-50%)', blur = 14 } = {}) {
  const s = spring(t - t0, 20, .6), k = 1 - s;
  tf(el, `${base} translate(${dx * k}px,${dy * k}px) skewX(${-14 * k}deg)`);
  const bl = blur * (1 - seg(t, t0, t0 + .12));
  el.style.filter = bl > .3 ? `blur(${bl.toFixed(1)}px)` : 'none';
  op(el, t < t0 ? 0 : clamp((t - t0) / .04));
}
function maskLetters(container, text) {
  container.innerHTML = '';
  return [...text].map(ch => { const m = document.createElement('span'); m.className = 'mask'; const i = document.createElement('span'); i.textContent = ch; m.appendChild(i); container.appendChild(m); return i; });
}

// ---- texture: vignette + seeded grain tiles (made once) ----
(() => {
  const g = $('vig').getContext('2d'), rg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.34)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
})();
const grainTiles = [0, 1, 2, 3].map(i => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = rng(101 + i);
  for (let p = 0; p < im.data.length; p += 4) { const v = r() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 16; }
  g.putImageData(im, 0, 0); return `url(${c.toDataURL()})`;
});

// ---- scene table (HUD) ----
const SCENES = [
  [0, b(4), 'SPARK'], [b(4), b(8), 'BRAND'], [b(8), b(14), 'KINETIC TYPE'], [b(14), b(20), 'GENERATIVO'],
  [b(20), b(26), 'PRODUCTO'], [b(26), b(27.25), 'MORPH'], [b(27.25), DUR + 1, 'FIN'],
];
function lightBg(t) { // true when the visible background is light -> ink HUD
  return (t >= b(4) && t < b(10)) || (t >= b(20) && t < b(26.6));
}

// ---- build static bits ----
const tickG = $('ticks');
for (let i = 0; i <= 16; i++) { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); tickG.appendChild(l); }
const s2letters = maskLetters($('s2title'), 'CLAUDE');
const s2dot = document.createElement('span'); s2dot.id = 's2dot'; $('s2title').appendChild(s2dot);
const endLetters = maskLetters($('endtitle'), 'CLAUDE');
const endDot = document.createElement('span'); endDot.id = 'enddot'; $('endtitle').appendChild(endDot);
const pat = $('pat'), patRows = [];
for (let i = 0; i < 8; i++) { const d = document.createElement('div'); d.textContent = 'AL BEAT · '.repeat(8); pat.appendChild(d); patRows.push(d); }
const THUMB = [C.ink, C.acc, C.cream, '#000', C.blue, C.ink];
const thumbs = THUMB.map((c, i) => { const d = document.createElement('div'); d.className = 'thumb'; d.style.left = (48 + i * 172) + 'px'; d.style.background = c; if (c === C.cream) d.style.boxShadow = 'inset 0 0 0 2px rgba(11,11,16,.1)'; $('thumbs').appendChild(d); return d; });
const PROMPT = 'haz un motion graphics de lo bueno que eres haciendo motion graphics';
const CHECK = '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---- cube field ----
const cv = $('cubes'), cx = cv.getContext('2d');
const NQ = 13, HALF = (NQ - 1) / 2, cubes = [];
for (let i = 0; i < NQ; i++) for (let j = 0; j < NQ; j++) cubes.push({ x: i - HALF, z: j - HALF, r: Math.hypot(i - HALF, j - HALF) });
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const STOPS = [hex(C.blue), hex(C.cream), hex(C.acc)];
function heat(k, shade) {
  k = clamp(k); const s = k < .5 ? 0 : 1, f = k < .5 ? k * 2 : k * 2 - 1;
  const c = STOPS[s].map((v, i) => lerp(v, STOPS[s + 1][i], f) * shade);
  return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}
function drawCubes(t) {
  const lt = t - b(14), pr = ease(seg(t, b(14), b(20)));
  cx.clearRect(0, 0, W, H);
  const yaw = lerp(-0.8, 0.25, pr), pitch = lerp(0.78, 0.56, pr), D = lerp(25, 19.5, pr), f = 1300, ox = W * .68, oy = H * .55;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const P = (x, y, z) => { const X = x * cy - z * sy, Z0 = x * sy + z * cy; const Y = y * cp + Z0 * sp, Z = -y * sp + Z0 * cp + D; return [ox + f * X / Z, oy - f * Y / Z, Z]; };
  const beats = lt / B, out = ease(seg(t, b(19.2), b(19.8)));
  for (const c of cubes) {
    const app = spring(lt - c.r * 0.045, 13, .55) * (1 - out);
    let h = 0.25 + 0.85 * (0.5 + 0.5 * Math.sin(c.r * 0.85 - lt * 6.5));
    for (let k = Math.floor(beats); k >= Math.floor(beats) - 1 && k >= 0; k--) { const tb = lt - k * B; h += 1.5 * Math.exp(-Math.pow(c.r - tb * 15, 2) / 1.6) * Math.exp(-tb * 1.4); }
    c.h = Math.max(0.04, h * app);
    c.d = P(c.x, c.h / 2, c.z)[2];
  }
  cubes.sort((p, q) => q.d - p.d);
  const s = 0.39;
  cx.lineWidth = 1; cx.strokeStyle = 'rgba(11,11,16,.35)';
  for (const c of cubes) {
    const x0 = c.x - s, x1 = c.x + s, z0 = c.z - s, z1 = c.z + s, h = c.h, k = h / 2.6;
    const faces = [
      [[x0, h, z0], [x0, h, z1], [x1, h, z1], [x1, h, z0], 1],
      [[x1, 0, z0], [x1, h, z0], [x1, h, z1], [x1, 0, z1], .6],
      [[x0, 0, z1], [x0, h, z1], [x0, h, z0], [x0, 0, z0], .6],
      [[x1, 0, z1], [x1, h, z1], [x0, h, z1], [x0, 0, z1], .78],
      [[x0, 0, z0], [x0, h, z0], [x1, h, z0], [x1, 0, z0], .78],
    ];
    for (const fc of faces) {
      const pts = fc.slice(0, 4).map(v => P(...v));
      let a = 0; for (let i = 0; i < 4; i++) { const p = pts[i], q = pts[(i + 1) % 4]; a += p[0] * q[1] - q[0] * p[1]; }
      if (a <= 0) continue;
      cx.beginPath(); pts.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.closePath();
      cx.fillStyle = heat(k, fc[4]); cx.fill(); cx.stroke();
    }
  }
}

// ---- seek ----
const L = ['L1', 'L2', 'L3', 'L4', 'L5', 'L7'].map($);
const WIN = [[0, b(4)], [b(4), b(8)], [b(8), b(14)], [b(14), b(20)], [b(20), b(26.75)], [b(26), DUR + 1]];
const BG = t => t < b(4) ? C.ink : t < b(8) ? C.acc : t < b(14) ? C.cream : t < b(20) ? C.ink : t < b(26.75) ? C.cream : C.ink;

window.seek = function (T) {
  const t = ((T % DUR) + DUR) % DUR;
  stage.style.background = BG(t);
  L.forEach((el, i) => show(el, t >= WIN[i][0] && t < WIN[i][1]));

  // HUD
  const si = SCENES.findIndex(s => t >= s[0] && t < s[1]);
  $('hud').style.color = lightBg(t) ? C.ink : '#fff';
  $('hscene').textContent = `SCENE 0${si + 1} / 07`;
  $('hcat').textContent = SCENES[si][2];
  const ss = Math.floor(t), ff = Math.floor((t - ss) * 60);
  $('htc').textContent = `00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
  op($('rec'), (t % 1) < .6 ? 1 : .2);
  $('grain').style.backgroundImage = grainTiles[Math.floor(t * 24) % 4];

  if (t < WIN[0][1]) s1(t);
  if (t >= WIN[1][0] && t < WIN[1][1]) s2(t);
  if (t >= WIN[2][0] && t < WIN[2][1]) s3(t);
  if (t >= WIN[3][0] && t < WIN[3][1]) s4(t);
  if (t >= WIN[4][0] && t < WIN[4][1]) s5(t);
  if (t >= WIN[5][0]) s7(t);
};

function s1(t) {
  op($('grid'), .9 * seg(t, 0, b(1.5)));
  tf($('grid'), `scale(${lerp(1.06, 1, ease(seg(t, 0, b(4))))})`);
  // dot: pop, pulse, then becomes the line
  const pop = spring(t - b(.5), 20, .45), pulse = t > b(1) ? .35 * Math.exp(-9 * (t - b(1))) * Math.sin(26 * (t - b(1))) : 0;
  const dotR = 11 * (pop + pulse);
  show($('s1dot'), t < b(1.5)); circ($('s1dot'), 960, 540, Math.max(0, dotR));
  // line
  const st = spring(t - b(1.5), 15, .7), Lh = lerp(11, 760, st), sw = lerp(22, 4, clamp(st));
  const tw = t - b(2.5), bend = tw > 0 ? 140 * Math.exp(-6.5 * tw) * Math.sin(24 * tw) : 0;
  const fl = easeIn(seg(t, b(3.4), b(4)));
  const line = $('s1line');
  line.style.display = t >= b(1.5) && fl === 0 ? 'block' : 'none';
  line.setAttribute('d', `M ${960 - Lh} 540 Q 960 ${540 + bend * 2} ${960 + Lh} 540`);
  line.setAttribute('stroke-width', sw);
  // beat ticks on the timeline
  [...tickG.children].forEach((l, i) => {
    const u = i / 16, x = 960 - 760 + 1520 * u, y = 540 + 2 * u * (1 - u) * bend * 2;
    const a = spring(t - b(2.2) - i * 0.018, 22, .6), len = (i % 4 === 0 ? 26 : 14) * a;
    l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', y + 14); l.setAttribute('y2', y + 14 + len);
    l.style.opacity = fl ? 0 : a > .02 ? 1 : 0;
  });
  // flood
  const fr = $('s1flood');
  const fh = lerp(4, 1100, fl), fw = lerp(1520, 1960, fl);
  fr.setAttribute('x', 960 - fw / 2); fr.setAttribute('y', 540 - fh / 2); fr.setAttribute('width', fw); fr.setAttribute('height', fh);
  fr.style.display = fl > 0 ? 'block' : 'none';
  // labels
  const lab = $('s1lab'); lab.style.left = '200px'; lab.style.top = (540 - 52) + 'px';
  typed(lab, 'claude / motion graphics — 2026', t, b(2), b(2.8), true, 2);
  const lab2 = $('s1lab2'); lab2.style.left = '1720px'; lab2.style.top = (540 + 52) + 'px'; tf(lab2, 'translateX(-100%)');
  typed(lab2, 'seek(t) -> frame', t, b(2.6), b(3.2), false);
  op(lab, 1 - fl * 3); op(lab2, 1 - fl * 3);
}

function s2(t) {
  // kicker
  const k = spring(t - b(4), 18, .7);
  op($('s2kick'), clamp(k)); tf($('s2kick'), `translateY(${(1 - k) * 30}px)`);
  // letters on 1/16s
  s2letters.forEach((el, i) => { const s = spring(t - b(4.25) - i * b(.25), 22, .62); tf(el, `translateY(${(1 - s) * 105}%)`); });
  // weight morph thin -> black
  const wg = track(220, [[b(5.75), 900, 12, .6]])(t);
  $('s2title').style.fontVariationSettings = `'wght' ${clamp(wg, 100, 900).toFixed(0)}`;
  $('s2title').style.fontWeight = 900;
  // camera push
  tf($('s2col'), `scale(${lerp(1, 1.05, ease(seg(t, b(4), b(8))))})`);
  // serif line
  const sv = spring(t - b(5.75), 16, .75);
  op($('s2serif'), clamp(sv)); tf($('s2serif'), `translateY(${(1 - sv) * 40}px)`);
  // full stop pops, then detaches
  const dp = spring(t - b(5), 20, .5);
  tf(s2dot, `scale(${Math.max(0, dp)})`);
  op(s2dot, t < b(7) ? 1 : 0);
  const ball = $('s2ball');
  show(ball, t >= b(7));
  if (t >= b(7)) {
    const r0 = sRect(s2dot), m = ease(seg(t, b(7), b(7.55)));
    const x = lerp(r0.cx, 960, m), y = lerp(r0.cy, 540, m) - 150 * Math.sin(Math.PI * m);
    const g = easeIn(seg(t, b(7.3), b(8)));
    circ(ball, x, y, lerp(r0.w / 2, 1180, g));
  }
}

function s3(t) {
  show($('p1'), t < b(10)); show($('p2'), t >= b(10) && t < b(12)); show($('p3'), t >= b(12));
  if (t < b(10)) {
    slam($('w1'), t, b(8), { dx: -420 });
    const sv = spring(t - b(8.75), 16, .7);
    op($('w1s'), clamp(sv)); tf($('w1s'), `translate(-50%,0) translateY(${(1 - sv) * 40}px)`);
    const m = $('w1m'); tf(m, 'translate(-50%,0)');
    typed(m, '// cada fotograma = f(t)', t, b(9), b(9.6));
    tf($('p1'), `scale(${lerp(1.0, 1.04, seg(t, b(8), b(10)))})`);
  } else if (t < b(12)) {
    const lt = t - b(10), beat = lt / B, pump = Math.exp(-5 * (beat - Math.floor(beat)) * B * 2);
    patRows.forEach((d, i) => { const dir = i % 2 ? 1 : -1; tf(d, `translateX(${-300 + dir * lt * 260 + (i % 2 ? -150 : 0)}px)`); });
    op($('pat'), .55 + .45 * pump);
    slam($('w2'), t, b(10), { dx: 420, base: `translate(-50%,-50%) scale(${1 + .04 * pump * (t > b(10.4) ? 1 : 0)})` });
    const bp = $('bpm'); tf(bp, 'translate(-50%,0)'); op(bp, seg(t, b(10.5), b(10.6)));
    const on = Math.floor(beat) % 4;
    bp.innerHTML = '128 BPM ' + [0, 1, 2, 3].map(i => `<span class="sq" style="opacity:${i <= on ? 1 : .2}"></span>`).join('');
  } else {
    const fb = spring(t - b(12), 18, .7);
    tf($('vfbox'), `scale(${lerp(1.18, 1, fb)})`); op($('vfbox'), clamp(fb * 1.5));
    op($('recl'), (t % .5) < .3 ? 1 : .35);
    const push = easeIn(seg(t, b(13.3), b(14)));
    slam($('w3'), t, b(12), { dx: 0, dy: 260, base: `translate(-50%,-50%) scale(${1 + push * 1.4})` });
    const iris = $('iris1');
    show(iris, t >= b(13.3));
    if (t >= b(13.3)) { const z = sRect($('zero')); circ(iris, z.cx, z.cy, lerp(0, 2300, easeIn(seg(t, b(13.3), b(14))))); }
  }
}

function s4(t) {
  drawCubes(t);
  typed($('s4code'), 'spring(t, w = 14, z = 0.82)', t, b(14.5), b(15.4));
  slam($('s4big'), t, b(15.25), { base: '', dx: -300 });
  const sv = spring(t - b(16.25), 16, .7);
  op($('s4serif'), clamp(sv)); tf($('s4serif'), `translateY(${(1 - sv) * 40}px)`);
  const w = easeIn(seg(t, b(19.3), b(20))) * (W + 30);
  $('wipe').style.width = w + 'px';
  $('wipeEdge').style.left = (w - 26) + 'px';
  show($('wipeEdge'), t >= b(19.3));
}

const cur = { x: kf([[b(21.5), 1150], [b(22.55), 82], [b(22.75), 82], [b(23.12), 920], [b(23.25), 920], [b(24.5), 1060]]), y: kf([[b(21.5), 700], [b(22.55), 326], [b(22.75), 326], [b(23.12), 326], [b(23.25), 326], [b(24.5), 640]]) };
function s5(t) {
  // card group: enter, slow 3D drift, collapse
  const en = spring(t - b(20.1), 11, .72), out = easeIn(seg(t, b(26), b(26.4)));
  const rx = lerp(12, 6, ease(seg(t, b(20), b(26)))), ry = lerp(-18, -7, ease(seg(t, b(20), b(26))));
  tf($('grp'), `translateY(${(1 - en) * 800}px) rotateX(${rx}deg) rotateY(${ry + (1 - en) * 20}deg) scale(${1 - out * .97})`);
  op($('grp'), 1 - seg(t, b(26.25), b(26.4)));
  tf($('ghost1'), `translate3d(46px,-40px,-90px)`); tf($('ghost2'), `translate3d(92px,-80px,-180px)`);
  // prompt
  $('prompt').innerHTML = '';
  if (t >= b(20.6)) { const n = Math.floor(PROMPT.length * seg(t, b(20.6), b(22.3))); $('prompt').innerHTML = '<span style="color:#FF4F1A">›</span> ' + PROMPT.slice(0, n) + (caretOn(t, b(22.3)) && t < b(23.3) ? '<span class="caret"></span>' : ''); }
  // toggle
  const tg = spring(t - b(22.75), 20, .6);
  $('tog').style.background = tg > .5 ? C.acc : 'rgba(11,11,16,.15)';
  $('knob').style.left = lerp(5, 35, tg) + 'px';
  // button
  const btn = $('btn'), press = t > b(23.25) ? 1 - .07 * Math.exp(-9 * (t - b(23.25))) * Math.cos(20 * (t - b(23.25))) : 1;
  const done = t >= b(25.25);
  btn.style.background = done ? C.ink : C.acc;
  btn.innerHTML = done ? CHECK + 'Hecho' : t >= b(23.25) ? 'Renderizando…' : 'Renderizar';
  tf(btn, `scale(${press * (done ? 1 + .06 * Math.exp(-6 * (t - b(25.25))) * Math.sin(18 * (t - b(25.25))) : 1)})`);
  // progress
  const p = seg(t, b(23.5), b(25.1));
  $('bar').style.width = (p * 100) + '%';
  $('frm').textContent = `fotograma ${Math.round(p * 900)} / 900`;
  $('pct').textContent = Math.round(p * 100) + '%';
  thumbs.forEach((d, i) => { const s = spring(t - lerp(b(23.5), b(25.1), (i + .6) / 6), 20, .55); tf(d, `scale(${Math.max(0, s)})`); op(d, s > .01 ? 1 : 0); });
  // cursor + click rings
  const cu = $('cursor');
  show(cu, t >= b(21.5) && t < b(25.5)); cu.style.left = cur.x(t) + 'px'; cu.style.top = cur.y(t) + 'px';
  op(cu, seg(t, b(21.5), b(21.8)) * (1 - seg(t, b(24.7), b(25.3))));
  const ck = [[b(22.75), 82, 326], [b(23.25), 920, 326]].filter(c => t >= c[0] && t < c[0] + .4).pop();
  const cr = $('clickring'); show(cr, !!ck);
  if (ck) { const a = seg(t, ck[0], ck[0] + .4); circ(cr, ck[1], ck[2], lerp(6, 46, easeOut(a))); op(cr, 1 - a); }
  // toast
  const ts = spring(t - b(25.4), 16, .7);
  tf($('toast'), `translateX(${(1 - ts) * 560 + out * 600}px)`);
  op($('toast'), t >= b(25.4) ? 1 : 0);
}

function s7(t) {
  // orange dot out of the collapsing card, ink iris, ring pulse, glide into the logo
  const bd = $('bdot');
  const pop = spring(t - b(26.1), 18, .5), bump = t > b(26.75) ? .4 * Math.exp(-8 * (t - b(26.75))) * Math.sin(22 * (t - b(26.75))) : 0;
  const iris = easeIn(seg(t, b(26.3), b(26.75)));
  circ($('iris2'), 960, 540, iris * 1150);
  show($('iris2'), t >= b(26.3));
  const rg = seg(t, b(26.75), b(27.6));
  show($('ring'), t >= b(26.75) && rg < 1);
  circ($('ring'), 960, 540, lerp(22, 460, easeOut(rg))); op($('ring'), 1 - rg);
  // end card
  op($('endcol'), t >= b(26.75) ? 1 : 0);
  endLetters.forEach((el, i) => { const s = spring(t - b(27.25) - i * b(.25), 22, .62); tf(el, `translateY(${(1 - s) * 105}%)`); });
  const tg = spring(t - b(28.5), 15, .75);
  op($('endtag'), clamp(tg)); tf($('endtag'), `translateY(${(1 - tg) * 40}px)`);
  $('rule').style.width = (720 * ease(seg(t, b(29), b(29.9)))) + 'px';
  typed($('endmono'), 'ESTE VÍDEO: 1 ARCHIVO HTML · 0 PLANTILLAS', t, b(29.5), b(30.9), true, 9);
  tf($('endcol'), `scale(${lerp(1, 1.035, seg(t, b(27), DUR))})`);
  // dot travel
  const target = t >= b(26.75) ? sRect(endDot) : { cx: 960, cy: 540, w: 39 };
  const m = ease(seg(t, b(27.25), b(28.1)));
  const x = lerp(960, target.cx, m), y = lerp(540, target.cy, m) - 120 * Math.sin(Math.PI * m);
  const r = lerp(22, target.w / 2, m) * (t < b(27) ? Math.max(0, pop) + bump : 1);
  circ(bd, x, y, Math.max(0, r));
}

// ---- sound ----
window.buildAudio = async (ctx) => {
  const sr = ctx.sampleRate, R = rng(7);
  const nb = ctx.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .15;
  const master = ctx.createGain(); master.gain.value = .8; master.connect(comp); comp.connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = .5; music.connect(master);
  const fx = ctx.createGain(); fx.gain.value = .85; fx.connect(master);

  const env = (g, t, a, pk, dec) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); };
  const noise = (t, dur, out, { type = 'bandpass', f = 1000, f2, q = 1, gain = 1, a = .002 } = {}) => {
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + dur); fl.Q.value = q;
    const g = ctx.createGain(); env(g, t, a, gain, dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, R() * 1.5); s.stop(t + a + dur + .05);
  };
  const tone = (t, f, dur, out, { type = 'sine', gain = .5, f2, a = .002 } = {}) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + dur);
    const g = ctx.createGain(); env(g, t, a, gain, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + a + dur + .05);
  };
  const swell = (t0, t1, out, { f = 300, f2 = 7000, gain = .3, q = 2 } = {}) => {   // riser / whoosh: rises then cuts
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0); fl.frequency.exponentialRampToValueAtTime(f2, t1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t1 - .01); g.gain.linearRampToValueAtTime(0, t1 + .04);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t0, R()); s.stop(t1 + .1);
  };
  const kick = t => { tone(t, 160, .34, music, { gain: 1, f2: 42 }); noise(t, .015, music, { type: 'highpass', f: 3000, gain: .2 }); };
  const clap = t => { [0, .011, .023].forEach((o, i) => noise(t + o, i === 2 ? .16 : .03, music, { f: 1500, q: .9, gain: .5 })); };
  const hat = t => noise(t, .035, music, { type: 'highpass', f: 8000, gain: .16 });
  const bass = (t, f, dur) => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 4; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(140, t + dur);
    const g = ctx.createGain(); env(g, t, .004, .28, dur); o.connect(lp); lp.connect(g); g.connect(music); o.start(t); o.stop(t + dur + .1);
    tone(t, f, dur, music, { gain: .35, a: .004 });
  };
  const pad = (t0, t1, notes, gain = .05) => notes.forEach((f, i) => {
    [-6, 6].forEach(dt => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + .5); g.gain.setValueAtTime(gain, t1 - .3); g.gain.linearRampToValueAtTime(0, t1);
      o.connect(lp); lp.connect(g); g.connect(music); o.start(t0); o.stop(t1 + .05);
    });
  });
  const impact = (t, k = 1) => { tone(t, 95, .9, fx, { gain: .9 * k, f2: 28 }); noise(t, .45, fx, { type: 'lowpass', f: 3000, f2: 180, gain: .55 * k }); };
  const whoosh = (t, d = .4, k = .32) => swell(t - d, t, fx, { f: 450, f2: 5000, gain: k, q: 1.4 });
  const blip = (t, f = 1600, g = .2) => tone(t, f, .07, fx, { type: 'triangle', gain: g });
  const bell = (t, f, g = .25, d = 2.6) => { tone(t, f, d, fx, { gain: g }); tone(t, f * 2.01, d * .6, fx, { gain: g * .4 }); tone(t, f * 3.02, d * .35, fx, { gain: g * .2 }); };

  // 01 spark
  pad(0, b(4), [110, 164.8, 220], .035);
  blip(b(.5), 2200, .25);
  whoosh(b(1.5), .25, .22);
  for (let i = 0; i < 16; i += 2) blip(b(2) + i * (b(.8) / 30), 3200, .05);
  tone(b(2.5), 260, .35, fx, { type: 'triangle', gain: .2, f2: 400 });
  swell(b(2), b(4), fx, { f: 250, f2: 7000, gain: .35 });
  impact(b(4));
  // drums b4 -> b26
  for (let n = 4; n < 26; n++) { kick(b(n)); if (n % 2) clap(b(n)); if (n >= 8) hat(b(n + .5)); }
  // bass, 8ths, one root per bar
  const roots = { 4: 55, 8: 43.65, 12: 65.41, 16: 49, 20: 55, 24: 43.65 };
  for (let n = 4; n < 26; n += .5) { const root = roots[Math.floor(n / 4) * 4]; bass(b(n), n % 1 ? root * 2 : root, B * .45); }
  pad(b(4), b(26), [220, 261.6, 329.6], .022);
  // 02 brand
  const PENT = [880, 988, 1175, 1319, 1480, 1760];
  PENT.forEach((f, i) => blip(b(4.25) + i * b(.25), f, .14));
  blip(b(5), 2400, .2);
  whoosh(b(7.55), .35); impact(b(8), .6);
  // 03 kinetic type
  [8, 10, 12].forEach((n, i) => { whoosh(b(n), .18, .25); blip(b(n), [1319, 1568, 1760][i], .22); });
  whoosh(b(14), .3, .38); impact(b(14));
  // 04 generative: 16th arp
  const ARP = [523.3, 659.3, 784, 1046.5, 784, 659.3];
  for (let i = 0; i < 24; i++) tone(b(14) + i * b(.25), ARP[i % ARP.length], .1, music, { type: 'triangle', gain: .09 });
  whoosh(b(20), .55, .36); impact(b(20), .55);
  // 05 product
  for (let i = 0; i < 26; i++) noise(b(20.6) + i * (b(1.7) / 26), .012, fx, { type: 'highpass', f: 4000, gain: .1 });
  [b(22.75), b(23.25)].forEach(t => { tone(t, 2400, .03, fx, { gain: .25 }); noise(t, .02, fx, { f: 3000, gain: .3 }); });
  tone(b(23.5), 300, b(1.6), fx, { type: 'sine', gain: .05, f2: 900, a: .2 });
  tone(b(25.25), 1046.5, .3, fx, { gain: .25 }); tone(b(25.5), 1568, .5, fx, { gain: .25 });
  whoosh(b(25.4), .25, .2);
  // 06/07 morph + end
  blip(b(26.1), 2000, .2);
  swell(b(26), b(26.75), fx, { f: 400, f2: 6000, gain: .3 });
  impact(b(26.75), .8);
  tone(b(27.25), 70, 1.6, fx, { gain: .8, f2: 32 });
  bell(b(27.25), 880, .2, 3); bell(b(27.25), 1318.5, .12, 3);
  pad(b(27.25), DUR, [174.6, 220, 261.6, 329.6], .03);
  for (let i = 0; i < 20; i += 2) blip(b(29.5) + i * (b(1.4) / 39), 2600, .04);
};

// ---- preview ----
if (RENDER) { $('ctl').remove(); }
else {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 56) / H); tf($('wrap'), `scale(${k})`); $('wrap').style.left = ((innerWidth - W * k) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; $('pp').textContent = '❚❚ pause';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; $('pp').textContent = '▶ play'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  $('pp').onclick = () => playing ? pause() : play();
  $('scrub').oninput = e => { const was = playing; pause(); offset = +e.target.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); $('scrub').value = t; $('tlab').textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}
seek(0);
</script>
</body>
