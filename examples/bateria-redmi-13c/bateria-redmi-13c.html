<canvas id="c"></canvas>
<div id="ui"><button id="pp">Play</button><input id="sc" type="range" min="0" max="60" step="0.01" value="0"><span id="tm">0.00 s</span></div>
<script>
/* BEAT SHEET (s)                                                   SOUND
   0.0   Hook: Redmi 13C de espaldas, "¿Qué pasa si la batería…?"
   1.8   La tapa empieza a hincharse                                  impact
   5.0   Se abre la tapa: placa + batería 5000 mAh                    whoosh
   7.2   Etiquetas                                                    pop
  10.0   Zoom a la batería                                            whoosh
  11.5   Corte transversal: cátodo / separador / ánodo / electrolito  ticks
  15.0   Iones Li+ viajan (carga)
  17.1   "El electrolito es inflamable"
  19.5   ¿Por qué se infla? 4 causas (tarjetas)                       whoosh, 4× pop
  26.0   El electrolito se descompone → burbujas de gas               whoosh, plops
  29.0   La bolsa se infla como un globo
  33.0   Vista lateral: la tapa se levanta, el móvil baila            whoosh, impact
  38.5   ¿Cómo llega a explotar?                                      whoosh
  40.1   Perforación → chispa / cortocircuito                         spark + impact
  40.2   Riser hasta la ignición                                      riser
  42.1   80 °C capa protectora · 43.3 130 °C separador
  44.5   200 °C oxígeno · 45.6 +400 °C                                ticks
  45.7   Ignición: la tapa sale volando, chorro de fuego              boom + hit + jet
  47.1   "No es una bomba: es gas inflamable…"
  49.5   Qué hacer (5 puntos)                                         whoosh, clicks
  56.5   Cierre: "no se arregla: se cambia."                          whoosh, ding
*/
const W = 1080, H = 1920, D = 60;
window.VIDEO = { w: W, h: H, duration: D };
const RENDER = location.search.includes('render');
if (RENDER) document.documentElement.classList.add('render');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const easeIn2 = x => (x = clamp(x), x * x);
const lin = x => clamp(x);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

// ---------- vista lateral (móvil boca abajo sobre la mesa; grosor exagerado) ----------

window.buildAudio = async function (ac) {
  const dec = {};
  for (const [k, b64] of Object.entries(SFX)) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); dec[k] = await ac.decodeAudioData(u8.buffer); }
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
  const play = (k, t, g) => { const s = ac.createBufferSource(); s.buffer = dec[k]; const gn = ac.createGain(); gn.gain.value = g; s.connect(gn).connect(out); s.start(Math.max(0, t)); };
  for (let t = 0; t < D; t += dec.room.duration) play('room', t, 0.5);
  CUES.forEach(([k, t, g]) => play(k, t, g));
};

// ---------- vista previa ----------
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() {
  ac ??= new AudioContext();
  if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * D), 48000); await buildAudio(off); buf = await off.startRendering(); }
  src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  src.start(0, offset % D); startAt = ac.currentTime; playing = true; pp.textContent = 'Pause';
}
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
function now() { return playing ? (offset + ac.currentTime - startAt) % D : offset; }
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tm = document.getElementById('tm');
if (!RENDER) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 56) / H); cv.style.transform = `scale(${s})`; cv.style.left = `${(innerWidth - W * s) / 2}px`; };
  addEventListener('resize', fit); fit();
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { const was = playing; pause(); offset = +sc.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t; tm.textContent = t.toFixed(2) + ' s'; requestAnimationFrame(loop); })();
}
document.fonts.load('700 40px Geist').then(() => seek(now()));
seek(0);
