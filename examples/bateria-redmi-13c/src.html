<script>

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

const C = { bg: '#0A0A0D', text: '#F2F2F7', sub: '#8E8E93', heat: '#FF8A1F', red: '#FF453A', ion: '#3AA0FF', ok: '#32D74B', card: '#16161B', line: '#2A2A31' };

// ---------- text ----------
// "[palabra|heat]" = palabra resaltada con una caja de color

function label(s, x, y, size, a, o = {}) { A(a, () => { ctx.font = `${o.weight || 600} ${size}px Geist`; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = o.color || C.text; ctx.fillText(s, x, y); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; }); }

// ---------- pre-rendered layers ----------
const glow = col => mk(256, 256, (g, w) => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });
const G = {
  heat: glow('rgba(255,120,30,1)'), red: glow('rgba(255,60,40,1)'), ion: glow('rgba(58,160,255,1)'),
  fy: glow('rgba(255,195,105,1)'), fo: glow('rgba(255,105,20,1)'), fr: glow('rgba(220,50,20,1)'), smoke: glow('rgba(70,70,78,1)'), white: glow('rgba(255,255,255,1)'),

const BG = mk(W + 48, H + 48, (g, w, h) => {

function bowRect(x, y, w, h, r, b) {

function phoneShadow(cx, cy, w, h) { A(0.8, () => ctx.drawImage(G.smoke, cx - w * 0.85, cy - h * 0.62 + 40, w * 1.7, h * 1.24)); }

function backCover(x0, y0, w, h, r, sw) {

// ---------- vista lateral (móvil boca abajo sobre la mesa; grosor exagerado) ----------
function sideGeom(oy, s) {

];
window.buildAudio = async function (ac) {
  const dec = {};
  for (const [k, b64] of Object.entries(SFX)) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); dec[k] = await ac.decodeAudioData(u8.buffer); }
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
  const play = (k, t, g) => { const s = ac.createBufferSource(); s.buffer = dec[k]; const gn = ac.createGain(); gn.gain.value = g; s.connect(gn).connect(out); s.start(Math.max(0, t)); };
  for (let t = 0; t < D; t += dec.room.duration) play('room', t, 0.5);
  CUES.forEach(([k, t, g]) => play(k, t, g));
};

// ---------- vista previa ----------
let buf, ac, src, startAt = 0, offset = 0, playing = false;
async function play() {
  ac ??= new AudioContext();
  if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * D), 48000); await buildAudio(off); buf = await off.startRendering(); }
  src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  src.start(0, offset % D); startAt = ac.currentTime; playing = true; pp.textContent = 'Pause';
}
function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
function now() { return playing ? (offset + ac.currentTime - startAt) % D : offset; }
const pp = document.getElementById('pp'), sc = document.getElementById('sc'), tm = document.getElementById('tm');
if (!RENDER) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 56) / H); cv.style.transform = `scale(${s})`; cv.style.left = `${(innerWidth - W * s) / 2}px`; };
  addEventListener('resize', fit); fit();
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { const was = playing; pause(); offset = +sc.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); sc.value = t; tm.textContent = t.toFixed(2) + ' s'; requestAnimationFrame(loop); })();
}
document.fonts.load('700 40px Geist').then(() => seek(now()));
seek(0);
