<style>
:root{--bg:#141413;--ivory:#F0EEE6;--dim:#8E8B82;--dim2:#5F5C55;--line:#2E2C29;--acc:#D97757;--accSoft:rgba(217,119,87,.34);--green:#7BC47F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0A0A09;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);transform-origin:0 0;font-family:'Geist',sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:0;top:0}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute}
.mono{font-family:'Geist Mono',monospace}
/* title lines */
.title{position:absolute;left:960px;top:540px;transform:translate(-50%,-50%);font-size:46px;font-weight:430;letter-spacing:-.02em;white-space:nowrap}
.title .w{display:inline-block}
.hl{position:relative;display:inline-block}
.hlbg{position:absolute;left:-.12em;right:-.07em;top:.06em;bottom:-.02em;background:var(--accSoft);border-radius:.12em;transform-origin:left center;transform:scaleX(0);z-index:-1}
/* glyph helpers */
.dot{display:inline-block;width:.46em;height:.46em;border-radius:50%;background:var(--ivory);vertical-align:.14em;margin-right:.62em}
.dot.tool{background:var(--dim2)}
.dot.ok{background:var(--green)}
.elb{display:inline-block;width:.5em;height:.62em;border-left:2px solid var(--dim2);border-bottom:2px solid var(--dim2);vertical-align:.3em;margin:0 .7em 0 .55em}
/* terminal */
.term{position:absolute;background:#1A1917;border:1px solid #34322E;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.tbar{height:52px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #2A2926;background:#201F1C}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#3A3834;margin-right:9px}
.tbar .ttl{flex:1;text-align:center;color:#8E8B82;font-size:20px;margin-right:70px;white-space:nowrap}
.tbody{position:relative;padding:34px 46px;font-family:'Geist Mono',monospace;font-size:26px;line-height:1.5;color:var(--ivory)}
.hdr{display:flex;align-items:center;gap:30px;margin-bottom:30px}
.mslot{position:relative;width:108px;height:60px;flex:none}
.mslot .mascot{position:absolute;left:0;top:0}
.hn{font-weight:700;font-size:28px}
.hs{color:var(--dim)}
.msg{position:relative;overflow:hidden;height:0}
.msg .in{padding-bottom:14px}
.umsg{background:#262521;border-radius:8px;padding:8px 16px;color:#C9C6BC;white-space:nowrap}
.gt{color:var(--dim)}
.spinl{color:var(--acc);white-space:nowrap}
.spinl .dim2{color:var(--dim2)}
.cl{white-space:nowrap}
.cl b{font-weight:700}
.qp{border:2px solid #3A3834;border-radius:12px;padding:18px 24px;position:relative}
.qchip{display:inline-block;border:1px solid #4A4743;border-radius:6px;padding:0 12px;font-size:20px;color:var(--dim);margin-bottom:8px}
.qq{font-weight:700;margin-bottom:8px}
.opt{color:var(--ivory);white-space:nowrap;padding:2px 0}
.opt .ptr{display:inline-block;width:1.2em;color:var(--acc);opacity:0}
.opt.sel{color:var(--acc)}
.opt.sel .ptr{opacity:1}
.opt .cb{margin-right:.5em}
.opt .ck{display:inline-block;width:.9em;text-align:center}
.opt .ck svg{transform-origin:center}
.od{color:var(--dim);font-size:21px;padding-left:4.2em}
.qf{color:var(--dim2);font-size:20px;margin-top:8px}
.ans{color:var(--dim);white-space:nowrap}
.prompt{border:2px solid #3A3834;border-radius:10px;padding:10px 18px;white-space:nowrap;position:relative}
.prompt .ph{color:var(--dim2)}
.caret{display:inline-block;width:.6em;height:1.12em;background:var(--ivory);vertical-align:-.2em;margin-left:1px}
.hint{color:var(--dim2);font-size:20px;padding:8px 20px}
/* mascot scene */
.ed{position:absolute;background:#1A1917;border:1px solid #34322E;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.edtabs{height:56px;display:flex;align-items:flex-end;background:#201F1C;border-bottom:1px solid #2A2926;padding-left:12px;gap:4px}
.edtab{font-family:'Geist Mono';font-size:19px;color:var(--dim);padding:12px 22px;border-radius:10px 10px 0 0;white-space:nowrap}
.edtab.on{background:#1A1917;color:var(--ivory);box-shadow:inset 0 2px 0 var(--acc)}
.edbody{padding:22px 0;font-family:'Geist Mono';font-size:21px;line-height:34px}
.ln{display:flex;white-space:pre;height:34px}
.ln .num{width:66px;text-align:right;padding-right:22px;color:#4A4743;flex:none}
.kw{color:#E08A6A}.st{color:#A9C98A}.nu{color:#E9C46A}.cm{color:#6E6A60;font-style:italic}.fn{color:#8FB8E8}.gl{color:#C3A6E8}.id{color:#E8E4DA}.pu{color:#A8A398}
.ccaret{display:inline-block;width:3px;height:26px;background:var(--acc);vertical-align:-5px}
.kb{position:absolute}
.toast{position:absolute;background:#22302A;border:1px solid #3B5A47;color:#CFE8D2;border-radius:12px;padding:12px 20px;font-family:'Geist Mono';font-size:21px;white-space:nowrap}
.status{position:absolute;font-family:'Geist Mono';font-size:24px;color:var(--acc);white-space:nowrap;transform:translateX(-50%)}
.pt{position:absolute;left:0;top:0;font-family:'Geist Mono';font-size:30px;white-space:nowrap}
/* studio */
.studio{position:absolute;background:#2B2B2B;border-radius:14px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5);border:1px solid #3A3A3A;font-family:'Geist';color:#E6E6E6}
.st-title{position:absolute;left:0;top:0;right:0;height:40px;background:#1F1F1F;display:flex;align-items:center;justify-content:center;font-size:17px;color:#B9B9B9;white-space:nowrap}
.st-win{position:absolute;right:16px;top:13px}
.st-win i{display:inline-block;width:13px;height:13px;border-radius:3px;background:#3C3C3C;margin-left:10px}
.st-tabs{position:absolute;left:0;top:40px;right:0;height:38px;background:#262626;display:flex;align-items:center;padding-left:18px;gap:30px;font-size:17px;color:#A8A8A8;white-space:nowrap;border-bottom:1px solid #353535}
.st-tabs .on{color:#fff;box-shadow:0 9px 0 -6px #3D9BFF}
.st-rib{position:absolute;left:0;top:78px;right:0;height:82px;background:#2E2E2E;border-bottom:1px solid #1E1E1E;display:flex;align-items:center;padding-left:16px;gap:6px}
.rb{width:96px;height:68px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:#CFCFCF;gap:6px;position:relative;white-space:nowrap}
.rb svg{display:block}
.rb.play{width:110px}
.rb.play.on{background:#3A3F47}
.sep{width:1px;height:52px;background:#444;margin:0 8px}
.ripple{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid #6FB6FF;opacity:0}
.cc-chip{margin-left:auto;margin-right:22px;border:1px solid #5A4136;background:#33261F;color:#F3B79F;border-radius:20px;padding:8px 18px;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.st-vp{position:absolute;left:0;top:160px;width:1300px;height:600px;overflow:hidden;background:#87C3EE}
.st-vp canvas{position:absolute;left:0;top:0;width:1300px;height:600px}
.lb{position:absolute;right:16px;top:16px;width:270px;background:rgba(20,20,20,.62);border-radius:10px;font-size:17px;padding:8px 14px;color:#fff}
.lb div{display:flex;justify-content:space-between;white-space:nowrap}
.lbh{color:#BDBDBD;font-size:14px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:4px;margin-bottom:4px}
.lbn{font-weight:700;display:inline-block}
.ph{height:36px;background:#262626;border-bottom:1px solid #1E1E1E;font-size:16px;color:#D0D0D0;display:flex;align-items:center;padding-left:14px;font-weight:600}
.st-out{position:absolute;left:0;top:760px;width:1300px;height:200px;background:#252525;border-top:1px solid #1C1C1C}
.outl{position:absolute;left:0;right:0;top:36px;bottom:0;padding:6px 16px;font-family:'Geist Mono';font-size:17px;line-height:30px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.outl div{white-space:nowrap;color:#D8D8D8}
.outl .ts{color:#7D7D7D;margin-right:14px}
.outl .acc{color:#F3B79F}.outl .ok{color:#8FD694}
.st-exp{position:absolute;left:1300px;top:160px;width:460px;height:800px;background:#2A2A2A;border-left:1px solid #1C1C1C}
.tree{padding:6px 0;font-size:18px}
.row{height:31px;overflow:hidden;display:flex;align-items:center;white-space:nowrap;color:#E0E0E0;position:relative}
.row .tw{width:18px;display:inline-flex;justify-content:center;color:#9A9A9A}
.row .ico{width:16px;height:16px;border-radius:4px;margin:0 9px 0 4px;flex:none}
.row .cnt{color:#8A8A8A;margin-left:8px}
.row .flash{position:absolute;inset:0;background:#2F6FB3;opacity:0}
.row>*{position:relative}
/* code-only */
.tline{white-space:nowrap;overflow:hidden;height:0;position:relative}
.tline .in{padding-bottom:6px}
.jsbox{border-left:2px solid #3A3834;margin:2px 0 8px 1.2em;padding-left:18px;font-size:18px;line-height:28px}
.jsbox .ln{height:28px}
.br{position:absolute;background:#ECEAE4;border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.brbar{height:52px;background:#DAD7CF;display:flex;align-items:center;padding:0 18px;gap:16px}
.brbar .dots i{background:#B9B5AC}
.brtab{background:#ECEAE4;border-radius:10px 10px 0 0;align-self:flex-end;padding:10px 22px;font-size:17px;color:#3B3935;white-space:nowrap}
.brurl{flex:1;background:#F6F5F1;border-radius:18px;padding:7px 18px;font-size:17px;color:#57544E;font-family:'Geist Mono';white-space:nowrap}
.br canvas{display:block;width:960px;height:600px;image-rendering:pixelated}
/* end card */
.endname{position:absolute;left:960px;top:640px;transform:translate(-50%,-50%);font-size:120px;font-weight:620;letter-spacing:-.035em;white-space:nowrap}
.endsub{position:absolute;left:960px;top:745px;transform:translate(-50%,-50%);font-size:34px;color:var(--dim);white-space:nowrap}
/* preview controls */
#ui{position:fixed;left:0;right:0;bottom:0;height:54px;background:rgba(20,20,19,.92);display:flex;align-items:center;gap:14px;padding:0 16px;font:14px 'Geist',sans-serif;color:#ddd}
#ui button{background:#D97757;color:#141413;border:0;border-radius:8px;padding:8px 16px;font:600 14px 'Geist',sans-serif;cursor:pointer}
#ui input{flex:1;accent-color:#D97757}
#ui span{font-variant-numeric:tabular-nums;width:110px}
</style>
</head>
<body>
<div id="stage"><canvas id="bg" width="1920" height="1080"></canvas></div>

<script>
/* =====================================================================
   BEAT SHEET  (1920x1080, 60 s)                                  sound
   0.0  S1  "Todo empieza con una idea." types, camera pushes      pad fades in
   1.9      highlight sweeps behind "una idea"                    tick
   3.9  S2  over-the-shoulder: a person at a laptop               quick whoosh
   4.6      thought bubble pops up with a tiny obby inside         pops, plop, pip
   7.2      the bubble flies into the laptop screen                whoosh
   8.2      typing starts on the laptop (Claude Code prompt)       keyboard typing
   8.7      camera dives into the screen (match cut to S3)         whoosh
   9.6  S3  Claude Code terminal, camera rides the caret
   11.5     Enter: prompt goes into the history                    click
   11.7     "Pensando…" spinner                                    (drums enter 9.6)
   13.0     reply + question "¿Dónde quieres construir el juego?"  tick, pop
   14.4     [x] Roblox Studio  14.8 move  15.2 [x] Solo código       toggle, tick, toggle
   15.7     Enter -> answer, reply streams, Write(Monedas.server)  click, tick
   17.9     camera dives into the pixel mascot in the header       whoosh
   19.0 S4  the mascot comes alive, blinks, hops                   plop
   20.6     mascot types; Luau code fills the editor               typing
   26.6     toast "Monedas.server.lua guardado", happy hop         confirm, plop
   28.0 S5  "Primero, en Roblox Studio."                           quick whoosh
   29.9     Studio: 12 platforms pop in one by one                 rising pops
   32.75    8 coins, 2 checkpoints; scripts in Explorer            pips, ticks
   35.0     cursor clicks Jugar; avatar drops in                   click, impact
   35.5     avatar hops the obby collecting coins                  ticks, pips
   39.45    obby complete, confetti                                bell
   40.0 S6  "…o solo con código."                                  quick whoosh
   42.2     terminal writes index.html, juego.js, jugador.js       ticks, digital typing
   45.0     browser slides in; mini platformer starring the mascot max, pips
   49.6     "¡NIVEL COMPLETADO!"                                    confirm
   50.1 S7  "Tú pones la idea."  (drums drop out)                  quick whoosh
   52.6     "Claude Code escribe el código."                       riser 53.2-55.2
   55.2     end card: mascot lands, waves; "Claude Code"           impact, bell
   59.3     fade out
   ===================================================================== */
'use strict';
const W = 1920, H = 1080, DUR = 60;
window.VIDEO = { w: W, h: H, duration: DUR };
const RENDER = /[?&]render/.test(location.search);

// ---------- helpers (from the skill) ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const pulse = (t, at, half = .08) => clamp(1 - Math.abs(t - at) / half);
const blinkAt = (t, list) => Math.max(0, ...list.map(b => pulse(t, b)));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const logLerp = (a, b, k) => Math.exp(lerp(Math.log(a), Math.log(b), k));

// ---------- timeline ----------
const T = {
  s1: [0, 4.3],
  s2: [3.9, 10.0], dots: [4.6, 4.75], bubble: 4.9, bubbleFly: [7.2, 7.8], typeStart: 8.2, cps: 24, dive: [8.7, 9.6],
  s3: [9.6, 19.5], enter: 11.5, think: [11.7, 13.0], reply1: 13.0, q: 13.3, chk1: 14.4, mv: 14.8, chk2: 15.2, submit: 15.7, reply2: 16.2, write: 17.3, mdive: [17.9, 19.4],
  s4: [19.0, 28.35], type: [20.6, 26.4], done4: 26.6,
  s5t: [28.0, 30.25], s5: [29.9, 40.25], plat0: 30.55, platStep: .17, coins: 32.75, scripts: [33.25, 33.4], play: 35.0, hop0: 35.5, hopDt: .36, hopDur: .30, finish: 39.45,
  s6t: [40.0, 42.25], s6: [41.9, 50.45], browserIn: 45.0, game0: 45.55,
  s7a: [50.1, 52.95], s7b: [52.6, 55.6], end: [55.2, 60.0]
};

// ---------- DOM helpers ----------
const stage = document.getElementById('stage');
function mk(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function setPos(e, x, y, w, h) { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; }
function newLayer() { const layer = mk('div', 'layer', stage); const cam = mk('div', 'cam', layer); return { layer, cam }; }
function setCam(c, x, y, s) { c.style.transform = `translate(${W / 2}px,${H / 2}px) scale(${s}) translate(${-x}px,${-y}px)`; }
function vis(layer, t, a, b, fi = .4, fo = .4, blur = true) {
  if (t < a || t >= b) { layer.style.display = 'none'; return 0; }
  const o = Math.min(fi > 0 ? seg(t, a, a + fi) : 1, fo > 0 ? 1 - seg(t, b - fo, b) : 1);
  if (o <= 0) { layer.style.display = 'none'; return 0; }
  layer.style.display = 'block'; layer.style.opacity = o.toFixed(4);
  const bl = blur ? (1 - o) * 9 : 0; layer.style.filter = bl > .05 ? `blur(${bl.toFixed(2)}px)` : 'none';
  return o;
}
function worldPos(e, root) { let x = 0, y = 0; while (e && e !== root) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return [x, y]; }
const setT = (e, v) => { if (e._t !== v) { e.style.transform = v; e._t = v; } };
const setH = (e, v) => { if (e._h !== v) { e.innerHTML = v; e._h = v; } };

// glyphs that Geist lacks, drawn as SVG
const SPIN = (sz, col) => `<svg class="spin" width="${sz}" height="${sz}" viewBox="-10 -10 20 20" style="display:inline-block;vertical-align:-0.14em;overflow:visible"><g>${[0, 1, 2, 3, 4, 5].map(k => `<line x1="0" y1="-2.2" x2="0" y2="-8.6" transform="rotate(${k * 60})" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`).join('')}</g></svg>`;
const CHK = (col = '#7BC47F') => `<svg width="0.9em" height="0.9em" viewBox="0 0 16 16" style="display:inline-block;vertical-align:-0.1em"><path d="M3 8.6 L6.6 12 L13 4.6" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV = `<svg width="0.62em" height="0.9em" viewBox="0 0 10 14" style="display:inline-block;vertical-align:-0.08em"><path d="M2.5 2 L7.5 7 L2.5 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function poseSpins(list, t) { for (const s of list) s.firstChild.setAttribute('transform', `rotate(${((t * 140) % 360).toFixed(1)}) scale(${(.82 + .18 * Math.sin(t * 7)).toFixed(3)})`); }

// ---------- the Claude Code mascot (pixel art, 18 x 5 cells, each row 2 units tall) ----------
const MC = '#D77757';
function makeMascot(parent, u, eye = '#141413') {
  const w = mk('div', 'mascot', parent);
  w.style.position = 'absolute';
  w.innerHTML = `<svg width="${18 * u}" height="${10 * u}" viewBox="0 0 18 10" shape-rendering="crispEdges" style="overflow:visible;display:block"><g class="all">` +
    `<rect class="aL" x="1" y="4" width="2.06" height="2" fill="${MC}"/><rect class="aR" x="14.94" y="4" width="2.06" height="2" fill="${MC}"/>` +
    [4, 6, 11, 13].map(x => `<rect class="lg" x="${x}" y="7.94" width="1" height="2.06" fill="${MC}"/>`).join('') +
    `<rect x="3" y="0" width="12" height="8" fill="${MC}"/>` +
    `<rect class="eL" x="5" y="2" width="1" height="2" fill="${eye}"/><rect class="eR" x="12" y="2" width="1" height="2" fill="${eye}"/></g></svg>`;
  const q = s => w.querySelector(s);
  return { el: w, all: q('.all'), aL: q('.aL'), aR: q('.aR'), eL: q('.eL'), eR: q('.eR'), legs: [...w.querySelectorAll('.lg')], u };
}
function poseMascot(m, { aL = 0, aR = 0, aLx = 0, aRx = 0, blink = 0, sq = 0, look = 0, legs = null } = {}) {
  m.aL.setAttribute('transform', `translate(${aLx.toFixed(3)} ${aL.toFixed(3)})`);
  m.aR.setAttribute('transform', `translate(${aRx.toFixed(3)} ${aR.toFixed(3)})`);
  const eh = 2 * (1 - .88 * clamp(blink)), ey = 2 + (2 - eh) / 2;
  m.eL.setAttribute('y', ey); m.eL.setAttribute('height', eh); m.eL.setAttribute('x', 5 + look);
  m.eR.setAttribute('y', ey); m.eR.setAttribute('height', eh); m.eR.setAttribute('x', 12 + look);
  m.all.setAttribute('transform', `translate(9 10) scale(${(1 + sq).toFixed(4)} ${(1 - sq).toFixed(4)}) translate(-9 -10)`);
  m.legs.forEach((l, i) => l.setAttribute('transform', `translate(0 ${legs ? legs[i] : 0})`));
}

// ---------- background ----------
(function drawBg() {
  const c = document.getElementById('bg').getContext('2d');
  c.fillStyle = '#141413'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(240,238,230,0.055)';
  for (let y = 18; y < H; y += 36) for (let x = 18; x < W; x += 36) { c.beginPath(); c.arc(x, y, 1.3, 0, 7); c.fill(); }
  const g = c.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1150);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
})();
function glowCanvas(parent, x, y, r, col, a) {
  const cv = mk('canvas', 'abs', parent); cv.width = r * 2; cv.height = r * 2; setPos(cv, x - r, y - r);
  const c = cv.getContext('2d'), g = c.createRadialGradient(r, r, 0, r, r, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(.5, `rgba(${col},${a * .35})`); g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g; c.fillRect(0, 0, r * 2, r * 2); return cv;
}

// ---------- title lines ----------
function makeTitle(src) {
  const { layer, cam } = newLayer(); const line = mk('div', 'title', cam);
  const words = []; let hlbg = null, idx = 0;
  for (const tok of src.match(/\[[^\]]+\]|[^\s\[\]]+/g)) {
    const pos = src.indexOf(tok, idx); idx = pos + tok.length;
    if (pos > 0 && /\s/.test(src[pos - 1])) line.appendChild(document.createTextNode(' '));
    if (tok[0] === '[') {
      const hl = mk('span', 'hl', line); hlbg = mk('span', 'hlbg', hl);
      tok.slice(1, -1).split(' ').forEach((w, i) => { if (i) hl.appendChild(document.createTextNode(' ')); words.push(mk('span', 'w', hl, w)); });
    } else words.push(mk('span', 'w', line, tok));
  }
  return { layer, cam, line, words, hlbg };
}
function updTitle(TL, t, [a, b]) {
  if (!vis(TL.layer, t, a, b, .3, .42)) return;
  const n = TL.words.length;
  TL.words.forEach((w, i) => { const k = easeOut(seg(t, a + .18 + i * .1, a + .55 + i * .1)); w.style.opacity = k.toFixed(3); setT(w, `translateY(${((1 - k) * 18).toFixed(2)}px)`); });
  const landed = a + .55 + (n - 1) * .1;
  if (TL.hlbg) setT(TL.hlbg, `scaleX(${ease(seg(t, landed + .1, landed + .55)).toFixed(4)})`);
  const sT = Math.min(2.6, .7 * W / TL.line.offsetWidth);
  const s = lerp(1, sT, ease(seg(t, a + .45, a + 1.9))) * (1 + .05 * seg(t, a + 1.9, b));
  setCam(TL.cam, 960, 540, s);
}

}
const msgK = (t, a, b = 1e9, d = .3) => Math.min(easeOut(seg(t, a, a + d)), 1 - ease(seg(t, b, b + d)));
function updTerm(I, t) {
  const typedF = clamp((t - T.typeStart) * T.cps, 0, PROMPT.length);
  const typing = t < T.enter;
  I.ptext.textContent = typing ? PROMPT.slice(0, Math.floor(typedF)) : '';
  I.ph.style.display = t < T.typeStart ? 'inline' : 'none';
  const activeTyping = t >= T.typeStart && typedF < PROMPT.length;
  I.caret.style.opacity = activeTyping ? 1 : (Math.floor(t * 2.2) % 2 === 0 ? 1 : 0);
  I.caret.style.background = typing ? '#F0EEE6' : '#5F5C55';
  const ks = [msgK(t, T.enter), msgK(t, T.think[0], T.think[1]), msgK(t, T.reply1), msgK(t, T.q, T.submit), msgK(t, T.submit + .05), msgK(t, T.reply2), msgK(t, T.write)];
  I.msgs.forEach((m, i) => {
    const k = ks[i];
    if (k <= 0) { if (m._k !== 0) { m.style.height = '0px'; m.style.display = 'none'; m._k = 0; } return; }
    m.style.display = 'block';
    m.style.height = (m.firstElementChild.offsetHeight * k).toFixed(2) + 'px'; m.style.opacity = k.toFixed(3); m._k = k;
  });

  const sel = t < T.mv ? 0 : 1;
  I.opts.forEach((o, i) => o.classList.toggle('sel', sel === i));
  [T.chk1, T.chk2].forEach((tc, i) => { const k = t < tc ? 0 : spring(t - tc, 22, .55); I.cks[i].style.opacity = t < tc ? 0 : 1; I.cks[i].style.transform = `scale(${k.toFixed(3)})`; });
  I.qf.style.color = pulse(t, T.submit, .18) > 0 ? '#D97757' : '';
  poseSpins(I.spins, t);
  I.tdot.style.opacity = (.35 + .65 * Math.abs(Math.sin(t * 4))).toFixed(3);
  poseMascot(I.mascot, { blink: blinkAt(t, [10.4, 13.6, 16.9]), aR: t > 18.6 ? -2 * easeOut(seg(t, 18.6, 18.9)) : 0 });
}

function isoPolys(x, y, z, w, d, h, col, s) { // tiny iso box as SVG polygons, local units

  const rt = [P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)];
  const lf = [P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)];
  return `<polygon points="${rt.join(' ')}" fill="${shade(col, .72)}"/><polygon points="${lf.join(' ')}" fill="${shade(col, .86)}"/><polygon points="${top.join(' ')}" fill="${shade(col, 1.12)}"/>`;
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(clamp(k > 1 ? v + (255 - v) * (k - 1) : v * k, 0, 255)); return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`; }
S2.cam.innerHTML = `

    <rect x="1562" y="240" width="34" height="120" rx="3" fill="#8A6A4A"/><rect x="1600" y="282" width="22" height="78" rx="3" fill="#3E5A78"/>

  ['#2B2A55', '#3A3468', '#54407A', '#7A4E86', '#A65E7E', '#D9786F'].forEach((col, i) => { c.fillStyle = col; c.fillRect(0, i * 18, 240, 18); });
  c.fillStyle = '#E99A72'; c.fillRect(0, 108, 240, 42);
  STARS.forEach(([x, y, p]) => { const sx = ((x - camX * .1) % 240 + 240) % 240; if (Math.sin(t * 3 + p * 20) > -.4) { c.fillStyle = '#F0EEE6'; c.fillRect(sx, y, 1, 1); } });
  c.fillStyle = '#F6E7C8'; c.fillRect(196 - Math.round(camX * .05), 16, 10, 10); c.fillRect(195 - Math.round(camX * .05), 18, 12, 6);
  // hills (parallax)
  for (let x = 0; x < 240; x++) { const wx = x + camX * .3; const hh = 92 + Math.round(Math.sin(wx * .045) * 9 + Math.sin(wx * .11) * 4); c.fillStyle = '#4A3F78'; c.fillRect(x, hh, 1, 150 - hh); }
  for (let x = 0; x < 240; x++) { const wx = x + camX * .6; const hh = 112 + Math.round(Math.sin(wx * .06 + 1) * 7 + Math.sin(wx * .15) * 3); c.fillStyle = '#2F3D63'; c.fillRect(x, hh, 1, 150 - hh); }
  // platforms
  GP.forEach(([a, b, y]) => { const x0 = a - camX, w = b - a; if (x0 > 240 || x0 + w < 0) return; c.fillStyle = '#7A4B2E'; c.fillRect(x0, y, w, 150 - y); c.fillStyle = '#5E3822'; for (let i = 0; i < w; i += 6) for (let j = y + 6; j < 150; j += 7) if (((a + i) * 7 + j * 3) % 5 === 0) c.fillRect(x0 + i, j, 2, 2); c.fillStyle = '#5DBB4A'; c.fillRect(x0, y, w, 3); c.fillStyle = '#8EE06A'; c.fillRect(x0, y, w, 1); });
  // flag
  const fx = FLAGX - camX, fy = 104; c.fillStyle = '#E8E4DA'; c.fillRect(fx, fy - 30, 1, 30); c.fillStyle = MC; const wave = Math.floor(t * 8) % 2; c.fillRect(fx + 1, fy - 30 + wave, 9, 6);
  // coins
  GCOINS.forEach((q, i) => { if (gt >= q.tc) return; const fr = [5, 3, 1, 3][Math.floor(t * 10 + i) % 4]; const x = Math.round(q.x - camX - fr / 2), y = Math.round(q.y - 2); c.fillStyle = '#F7C948'; c.fillRect(x, y, fr, 5); if (fr > 2) { c.fillStyle = '#FFF2B0'; c.fillRect(x + 1, y + 1, 1, 2); } });
  // sparkles
  GCOINS.forEach(q => { const u = (gt - q.tc) / .35; if (u <= 0 || u >= 1) return; c.fillStyle = '#FFF2B0'; const r = 2 + u * 6; [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => c.fillRect(Math.round(q.x - camX + dx * r), Math.round(q.y + dy * r), 1, 1)); });
  drawHero(c, h.x - camX, h.y, h, gt);
  // blit, then crisp HUD on top
  GX.imageSmoothingEnabled = false; GX.setTransform(1, 0, 0, 1, 0, 0); GX.drawImage(GB, 0, 0, 1920, 1200);
  const nC = GCOINS.filter(q => gt >= q.tc).length;
  GX.fillStyle = 'rgba(20,20,30,.55)'; GX.fillRect(36, 34, 300, 84);
  GX.fillStyle = '#F7C948'; GX.fillRect(64, 56, 40, 40); GX.fillStyle = '#FFF2B0'; GX.fillRect(72, 64, 8, 16);
  GX.font = '700 44px "Geist Mono"'; GX.fillStyle = '#fff'; GX.textBaseline = 'middle'; GX.textAlign = 'left'; GX.fillText(`× ${nC}`, 124, 78);
  GX.textAlign = 'right'; GX.font = '600 32px "Geist Mono"'; GX.fillStyle = 'rgba(255,255,255,.7)'; GX.fillText('MINI OBBY', 1880, 76);
  const kd = gt > GPATH.end ? spring(gt - GPATH.end - .05, 14, .7) : 0;
  if (kd > 0) {
    GX.save(); GX.translate(960, 560); GX.scale(kd, kd); GX.textAlign = 'center';
    GX.font = '800 104px Geist'; GX.fillStyle = 'rgba(20,18,40,.6)'; GX.fillText('¡NIVEL COMPLETADO!', 6, 8); GX.fillStyle = '#FFF'; GX.fillText('¡NIVEL COMPLETADO!', 0, 0); GX.restore();
  }
}
function updS6(t) {
  if (!vis(S6.layer, t, T.s6[0], T.s6[1], .4, .45)) return;
  let cx = 470, cy = 480, s = 1.42;
  const k1 = ease(seg(t, 44.7, 45.7)); cx = lerp(cx, 960, k1); cy = lerp(cy, 540, k1); s = lerp(s, 1.0, k1);
  const k2 = ease(seg(t, 46.2, 47.2)); cx = lerp(cx, 1360, k2); s = lerp(s, 1.27, k2);
  s *= 1 + .03 * seg(t, 47.2, 50.4);
  setCam(S6.cam, cx, cy, s);
  S6L.forEach(L => {
    const k = easeOut(seg(t, L.t, L.t + .25));
    if (k <= 0) { L.e.style.display = 'none'; return; }
    L.e.style.display = 'block'; L.e.style.height = (L.e.firstChild.offsetHeight * k).toFixed(2) + 'px'; L.e.style.opacity = k.toFixed(3);
    if (L.dot) { const ok = t >= L.done; L.dot.className = 'dot tool' + (ok ? ' ok' : ''); L.dot.style.opacity = ok ? 1 : (.35 + .65 * Math.abs(Math.sin(t * 5))).toFixed(3); }
    if (L.codes) { const n = Math.floor(clamp((t - 43.3) / .8) * JS.length); const html = codeLines(JS_HL, n, t < 44.2); L.codes.forEach((e, i) => setH(e, html[i] ?? '')); }
  });
  // browser slides in from the right
  const kb = t < T.browserIn ? 0 : spring(t - T.browserIn, 11, .98);
  BR.style.opacity = clamp(kb * 1.6).toFixed(3); setT(BR, `translateX(${((1 - kb) * 520).toFixed(1)}px)`);
  if (kb > 0) drawGame(t);
}

// ---------- S7: closer + end card ----------
const S7a = makeTitle('Tú pones [la idea].');
const S7b = makeTitle('Claude Code [escribe el código].');
const END = newLayer();
glowCanvas(END.cam, 960, 470, 700, '217,119,87', .22);
const ENDm = makeMascot(END.cam, 16); setPos(ENDm.el, 960 - 144, 330);
const ENDn = mk('div', 'endname', END.cam, 'Claude Code');
const ENDs = mk('div', 'endsub', END.cam, 'De una idea a un juego · Roblox Studio o solo código');
function updEnd(t) {
  if (!vis(END.layer, t, T.end[0], T.end[1], .35, .7)) return;
  setCam(END.cam, 960, 540, 1 + .05 * seg(t, T.end[0], T.end[1]));
  const a = T.end[0] + .1, fall = seg(t, a, a + .38);
  const y = -380 * (1 - fall * fall), land = a + .38;
  const sq = .22 * clamp(1 - Math.abs(t - land - .04) / .1);
  const wave = t > 56.2 && t < 58.6 ? Math.sin((t - 56.2) * Math.PI * 4) : 0;
  poseMascot(ENDm, { aR: -2.2 * Math.max(0, wave) - (t > 56.2 && t < 58.6 ? .6 : 0), aL: t > 58.9 ? -1.5 * easeOut(seg(t, 58.9, 59.2)) : 0, sq, blink: blinkAt(t, [57.4, 59.0]) });
  setT(ENDm.el, `translateY(${y.toFixed(1)}px)`);

  ENDs.style.opacity = ks.toFixed(3); setT(ENDs, `translate(-50%,-50%) translateY(${((1 - ks) * 18).toFixed(2)}px)`);
}

/* =====================================================================

window.seek = function (t) {
  t = clamp(t, 0, DUR - 1e-4);

  updS2(t);

  updS4(t);

/* =====================================================================
   SOUND: synthesised music bed + bundled CC0 sound effects (window.SFX)
   ===================================================================== */
window.buildAudio = async function (ctx) {
  const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  const music = ctx.createGain(); music.connect(master);
  music.gain.setValueAtTime(0, 0); music.gain.linearRampToValueAtTime(.5, 1.5); music.gain.setValueAtTime(.5, 58.6); music.gain.linearRampToValueAtTime(0, 60);
  const sfx = ctx.createGain(); sfx.gain.value = 1; sfx.connect(master);
  // ---- sound effects ----
  const bufs = {};
  for (const [k, b64] of Object.entries(window.SFX || {})) {
    const bin = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    try { bufs[k] = await ctx.decodeAudioData(bin.buffer); } catch (e) { console.warn('sfx decode failed', k); }
  }
  function play(name, t, { gain = 1, rate = 1, offset = 0, dur = 0, pan = 0 } = {}) {
    const b = bufs[name]; if (!b || t < 0) return;
    const src = ctx.createBufferSource(); src.buffer = b; src.playbackRate.value = rate;
    const g = ctx.createGain(); const p = ctx.createStereoPanner(); p.pan.value = pan;
    src.connect(g); g.connect(p); p.connect(sfx);
    g.gain.setValueAtTime(gain, t);
    if (dur) { g.gain.setValueAtTime(gain, t + Math.max(0, dur - .12)); g.gain.linearRampToValueAtTime(0, t + dur); src.start(t, offset, dur * rate + .02); }
    else src.start(t, offset);
  }
  // S1
  play('tick', 1.95, { gain: 0.262 });
  // S2
  play('qwoosh', 3.85, { gain: 0.45 });
  play('pop', T.dots[0], { gain: 0.35, rate: 1.2 }); play('pop', T.dots[1], { gain: 0.35, rate: 1.35 });
  play('plop', T.bubble, { gain: 0.413 });
  [5.1, 5.25, 5.4].forEach((tt, i) => play('pop', tt, { gain: 0.28, rate: 1.4 + i * .15 }));
  play('pip', 5.6, { gain: 0.36 });
  play('whoosh', 7.15, { gain: 0.45, rate: 1.15 });
  play('keys', T.typeStart, { gain: 0.45, offset: .15, dur: PROMPT.length / T.cps });
  play('whoosh', 8.65, { gain: 0.5, rate: .85 });
  // S3
  play('click', T.enter, { gain: 0.42 });
  play('tick', T.reply1, { gain: 0.3 }); play('pop', T.q, { gain: 0.45 });
  play('toggle', T.chk1, { gain: 0.385 }); play('tick', T.mv, { gain: 0.375 }); play('toggle', T.chk2, { gain: 0.385 }); play('click', T.submit, { gain: 0.42 });
  play('tick', T.write, { gain: 0.3 });
  play('max', 18.2, { gain: 0.45 }); play('whoosh', 18.7, { gain: 0.45, rate: .8 });
  // S4
  play('plop', 19.95, { gain: 0.338, rate: 1.35 });
  play('type2', T.type[0], { gain: 0.3, dur: 3.9 });
  play('keys2', T.type[0] + 3.9, { gain: 0.3, offset: .3, dur: T.type[1] - T.type[0] - 3.9 });
  play('confirm', T.done4, { gain: 0.39 }); play('plop', T.done4 + .2, { gain: 0.262, rate: 1.6 });
  // S5
  play('qwoosh', 27.95, { gain: 0.45 }); play('whoosh', 29.85, { gain: 0.4 });
  PL.forEach((p, i) => play('pop', p.at, { gain: 0.38, rate: .9 + i * .06, pan: -.3 + i * .05 }));
  COINS.forEach((q, j) => play('pip', q.at, { gain: 0.16, rate: 1 + j * .05 }));
  T.scripts.forEach(tt => play('tick', tt, { gain: 0.3 }));
  play('whoosh', 33.3, { gain: 0.3, rate: 1.2 });
  play('click', T.play, { gain: 0.45 });
  play('impact', T.play + .45, { gain: 0.285 });
  for (let i = 0; i < NH; i++) play('select', T.hop0 + i * T.hopDt + T.hopDur, { gain: 0.195, rate: .9 + i * .03 });
  COINS.forEach((q, j) => play('pip', q.tc, { gain: 0.4, rate: 1.15 + j * .04 }));
  play('bell', T.finish, { gain: 0.48 }); play('confirm', T.finish + .05, { gain: 0.227 });
  // S6
  play('qwoosh', 39.95, { gain: 0.45 }); play('whoosh', 41.85, { gain: 0.35 });
  S6L.forEach(L => { if (!L.code) play('tick', L.t, { gain: 0.225 }); if (L.done) play('select', L.done, { gain: 0.227 }); });
  play('keys', 43.3, { gain: 0.3, offset: 1.2, dur: .8 });
  play('max', T.browserIn, { gain: 0.5 });
  GPATH.segs.filter(s => s.air).forEach(s => play('select', T.game0 + s.t0, { gain: 0.143, rate: 1.4 }));
  GCOINS.forEach((q, j) => play('pip', T.game0 + q.tc, { gain: 0.4, rate: 1.3 + j * .03 }));
  play('confirm', T.game0 + GPATH.end + .05, { gain: 0.39 });
  // S7
  play('qwoosh', 50.05, { gain: 0.4 }); play('whoosh', 52.55, { gain: 0.3 });
  play('riser', T.end[0] - 2.0, { gain: 0.5 });
  play('impact', T.end[0] + .48, { gain: 0.45 }); play('bell', T.end[0] + .52, { gain: 0.4 });

  // ---- music: 100 BPM, I–vi–IV–V in C, soft pad, pluck arps, light drums ----
  const B = .6, BAR = 2.4, mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const prog = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 59]];
  const roots = [36, 33, 29, 31];
  const padF = ctx.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 1500; padF.Q.value = .3; padF.connect(music);
  const plF = ctx.createBiquadFilter(); plF.type = 'lowpass'; plF.frequency.value = 3200; plF.connect(music);
  const dl = ctx.createDelay(1); dl.delayTime.value = B * .75; const fb = ctx.createGain(); fb.gain.value = .28; const wet = ctx.createGain(); wet.gain.value = .22;
  plF.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(music);
  const r = rng(11), noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const osc = (type, f, t0, t1, dest, det = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; o.connect(dest); o.start(t0); o.stop(t1); return o; };
  const env = (t0, a, peak, d, dest) => { const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d); g.connect(dest); return g; };
  const nBars = Math.ceil(DUR / BAR);
  for (let b = 0; b < nBars; b++) {
    const t0 = b * BAR, ch = prog[b % 4];
    if (t0 >= 55.2) break;
    const vol = b < 4 ? .016 : (t0 >= 50.4 ? .024 : .02);
    for (const n of ch) for (const det of [-7, 7]) {
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .6); g.gain.setValueAtTime(vol, t0 + BAR - .2); g.gain.linearRampToValueAtTime(0, t0 + BAR + .9); g.connect(padF);
      osc('triangle', mtof(n + 12), t0, t0 + BAR + 1, g, det);
    }
    if (t0 >= 50.4) for (const n of ch) { const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.008, t0 + 1); g.gain.linearRampToValueAtTime(0, t0 + BAR + .8); g.connect(padF); osc('sine', mtof(n + 24), t0, t0 + BAR + 1, g); }
    // arps
    const pat = [0, 1, 2, 3, 2, 1, 2, 3];
    if (b >= 4 && t0 < 50.4) pat.forEach((pi, k) => { const tt = t0 + k * B / 2, n = ch[pi] + 12; const g = env(tt, .005, .045, .42, plF); osc('triangle', mtof(n), tt, tt + .5, g); osc('sine', mtof(n + 12), tt, tt + .5, env(tt, .005, .015, .3, plF)); });
    if (b >= 1 && b < 4) [0, 2].forEach(k => { const tt = t0 + k * B, n = ch[(b + k) % 4] + 12; osc('triangle', mtof(n), tt, tt + .7, env(tt, .005, .03, .6, plF)); });
    // bass + drums
    if (b >= 4 && t0 < 50.4) {
      [0, 2, 2.5].forEach(bt => { const tt = t0 + bt * B; osc('sine', mtof(roots[b % 4]), tt, tt + .6, env(tt, .01, bt === 2.5 ? .055 : .1, .5, music)); });
      [0, 2].forEach(bt => { const tt = t0 + bt * B; const g = env(tt, .002, .17, .3, music); const o = osc('sine', 110, tt, tt + .35, g); o.frequency.setValueAtTime(120, tt); o.frequency.exponentialRampToValueAtTime(45, tt + .12); });
      [1, 3].forEach(bt => { const tt = t0 + bt * B; const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8; s.connect(f); f.connect(env(tt, .002, .07, .16, music)); s.start(tt, r() * .5, .25); });
      for (let k = 0; k < 8; k++) { const tt = t0 + k * B / 2; const s = ctx.createBufferSource(); s.buffer = noise; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500; s.connect(f); f.connect(env(tt, .001, k % 2 ? .03 : .015, .05, music)); s.start(tt, r() * .5, .08); }
    }
  }
  // final chord on the end card
  const fin = 55.2;
  [48, 55, 59, 62, 64].forEach(n => { const g = ctx.createGain(); g.gain.setValueAtTime(0, fin); g.gain.linearRampToValueAtTime(.022, fin + .08); g.gain.setValueAtTime(.022, 58.2); g.gain.linearRampToValueAtTime(0, 60); g.connect(padF); osc('triangle', mtof(n + 12), fin, 60, g, -5); osc('triangle', mtof(n + 12), fin, 60, g, 5); });
  { const g = env(fin, .002, .22, .4, music); const o = osc('sine', 110, fin, fin + .45, g); o.frequency.setValueAtTime(120, fin); o.frequency.exponentialRampToValueAtTime(40, fin + .15); }
  [0, 1, 2, 3, 4].forEach(k => { const tt = fin + .9 + k * .3, n = [72, 76, 79, 83, 84][k]; osc('triangle', mtof(n), tt, tt + .9, env(tt, .005, .03, .8, plF)); });
};

/* =====================================================================
   PREVIEW (no ?render): fit to window, play / scrub with sound
   ===================================================================== */
const ui = document.getElementById('ui');
if (RENDER) { ui.remove(); }
else {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 54) / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - 54 - H * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tl = document.getElementById('tl');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = '…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pp.textContent = '❚❚ Pausa';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = '▶ Play'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  pp.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  scrub.oninput = () => { const was = playing; pause(); offset = +scrub.value; if (was) play(); };
  (function loop() { const t = now(); seek(t); if (playing) scrub.value = t; tl.textContent = t.toFixed(2) + ' s'; requestAnimationFrame(loop); })();
}
document.fonts.ready.then(() => seek(RENDER ? 0 : 0));
