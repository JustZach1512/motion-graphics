<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROK Logo Reveal</title>
<script src="assets.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #gl { display: block; }
  #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        padding: 10px 16px; border-radius: 999px; background: rgba(20, 20, 32, .72); backdrop-filter: blur(10px);
        border: 1px solid rgba(140, 120, 255, .25); color: #cfd2ff; font: 500 13px/1 ui-monospace, Menlo, monospace; }
  #ui button { all: unset; cursor: pointer; width: 28px; text-align: center; font-size: 16px; color: #fff; }
  #ui input { width: min(52vw, 640px); accent-color: #7a5cff; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="ui"><button id="play" title="Play / pause (space)">&#9654;</button><input id="scrub" type="range" min="0" max="12" step="0.001" value="0"><span id="tc">00.00</span></div>
<script>
/*
  GROK — logo reveal, 12 s, 1920x1080, 80 BPM (beat = 0.75 s)

  BEAT SHEET (time · picture · sound)
  0.00  black; room fades up, spotlight shaft, dust in the light ......... sub drone + air, dark dyad pad
  0.90  logo small and still, dark chrome; core ember pulses (0.9 1.5 1.85 2.05) .. soft heartbeat thumps
  0.29–2.22  energy starts crawling along the rings ......................... riser (CC0) + noise swell
  2.12  everything holds its breath ........................................ duck to near silence
  2.25  IGNITION: flash, shockwave, particle burst, rings light up ......... impact + sub boom + bells, Dm(add9) pad
  2.25–3.6 logo expands (spring) and starts to turn ......................... whoosh
  3.00–8.25 gyroscope spin; sparks thrown off the rings; shapes fill the room
            and pulse/step on every beat; ripple on strong beats .......... taiko on 3.0 4.5 6.0 7.5, soft kick between,
                                                                            8th-note bell arpeggio, shaker build from 6.0
  5.25 Bbmaj7 · 7.50 C(add9) ............................................... chord changes
  8.25–8.81 rings land one after another ..................................... tom roll + glass ticks, reverse swell
  9.00  LOCK: rings coplanar, logo dead centre, soft pulse .................. D(add9) brass swell, boom, triangle
  9.20–10.4 logo glides up; "GROK" tracks in letter by letter (9.55+) ...... whoosh + rising sparkle per letter
  10.35–11.2 light sweep across logo and wordmark ........................... high shimmer
  11.30–12.0 fade to black ................................................... reverb tail, master fade
*/
'use strict';
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const PXS = +(Q.get('scale') || 1);                 // 0.5 = draft resolution
const W = Math.round(1920 * PXS), H = Math.round(1080 * PXS);
const DUR = 12, FPS = 60;
const SUB = Math.max(1, +(Q.get('sub') || (RENDER ? 6 : 1)));   // motion-blur / AA subframes per frame
const SHUTTER = 0.5 / FPS;                          // 180-degree shutter
if (RENDER) document.body.classList.add('render');

// ---------------------------------------------------------------- helpers
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;

const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => (x = clamp(x), x * x * (3 - 2 * x));
const smoother = x => (x = clamp(x), x * x * x * (x * (x * 6 - 15) + 10));
const easeOut3 = x => 1 - Math.pow(1 - clamp(x), 3);
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
// smooth keyframes: cubic Hermite through [t, v, slope?]; slope defaults to Catmull-Rom, 0 at the ends
function spline(keys) {

    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[n - 1][0]) return keys[n - 1][1];
    let i = 0; while (t > keys[i + 1][0]) i++;
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1], h = t1 - t0, s = (t - t0) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * v0 + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * v1 + (s3 - s2) * h * m[i + 1];

}
// cumulative of a beta-shaped velocity profile: 0 -> 1 with zero speed at both ends
function profile(a, b) {

  for (let i = 1; i <= N; i++) { const u = (i - 0.5) / N; acc += Math.pow(u, a - 1) * Math.pow(1 - u, b - 1); c[i] = acc; }
  for (let i = 0; i <= N; i++) c[i] /= acc;
  return u => { u = clamp(u); const x = u * N, i = Math.floor(x); return i >= N ? 1 : c[i] + (c[i + 1] - c[i]) * (x - i); };
}
// soft pulse: quick attack, smooth decay (dt in seconds after the hit)
const pulse = (dt, att = 0.03, dec = 0.32) => dt <= 0 ? 0 : (1 - Math.exp(-dt / att)) * Math.exp(-dt / dec);
const bump = (dt, k) => dt <= 0 ? 0 : (dt / k) * Math.exp(1 - dt / k);

// vec3 / mat3 (row-major)
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => mul(a, 1 / Math.hypot(a[0], a[1], a[2]));
const mm = (A, B) => { const C = new Array(9); for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) C[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c]; return C; };
const mv = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
const tr = M => [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]];
const gl3 = M => [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]];   // row-major -> GLSL column-major
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rotZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
function rotAxis(u, a) {
  const [x, y, z] = u, c = Math.cos(a), s = Math.sin(a), k = 1 - c;
  return [c + x * x * k, x * y * k - z * s, x * z * k + y * s, y * x * k + z * s, c + y * y * k, y * z * k - x * s, z * x * k - y * s, z * y * k + x * s, c + z * z * k];
}

// ---------------------------------------------------------------- timeline
const BEAT = 0.75;
const T_IGN = 2.25, T_LOCK = 9.0, T_RISE = 9.2, T_TEXT = 9.55, T_FADE = 11.3;
const EMBERS = [0.9, 1.5, 1.85, 2.05];
const BEATS = [[3.0, 1], [3.75, .5], [4.5, .85], [5.25, .55], [6.0, 1], [6.75, .6], [7.5, .9], [8.25, .7], [8.4375, .45], [8.625, .6], [8.8125, .75], [9.0, 1.25]];
const STRONG = [3.0, 4.5, 6.0, 7.5];
const beatEnv = t => { let e = 0; for (const [tb, s] of BEATS) e += s * pulse(t - tb, 0.025, 0.26); return e; };
const beatSteps = t => { let e = 0; for (const tb of STRONG) e += spring(t - tb, 7, 0.8); return e + 0.6 * spring(t - T_LOCK, 6, 0.85); };

// ---------------------------------------------------------------- camera
const FOV = 30 * Math.PI / 180;
const FOCAL = (H / 2) / Math.tan(FOV / 2);
const FLOOR_Y = -2.3;
const camD = spline([[0, 15.9], [T_IGN, 14.3], [5.6, 12.85], [9.3, 11.95, -0.12], [12, 11.62]]);
const camAz = spline([[0, 0], [T_IGN, 0.02], [5.0, -0.2], [7.6, 0.13], [9.45, 0, 0], [12, 0, 0]]);
const camH = spline([[0, 1.35], [T_IGN, 1.08], [5.4, 1.78], [9.45, 0.62, 0], [12, 0.62, 0]]);
const camRoll = spline([[0, 0], [T_IGN, 0], [5.3, 0.022], [7.9, -0.016], [9.5, 0, 0], [12, 0, 0]]);
function camState(t) {
  const dI = t - T_IGN;
  let d = camD(t) + 0.38 * bump(dI, 0.22);                          // the blast nudges the camera back
  const az = camAz(t), h = camH(t);
  const shake = 0.018 * Math.exp(-Math.max(dI, 0) * 7) * (dI > 0 ? 1 : 0);
  const target = [shake * Math.sin(dI * 83), shake * Math.sin(dI * 67 + 1), 0];
  const pos = [target[0] + d * Math.sin(az), h, d * Math.cos(az)];
  const f = norm(sub(target, pos));
  let r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
  const rl = camRoll(t), cr = Math.cos(rl), sr = Math.sin(rl);
  [r, u] = [add(mul(r, cr), mul(u, sr)), add(mul(u, cr), mul(r, -sr))];
  return { pos, r, u, f, focal: FOCAL };
}
// where the logo ends up: centre at 41.5% of the frame height, measured from the top
const camEnd = camState(DUR);
const projectY = (cam, y) => { const v = sub([0, y, 0], cam.pos); return cam.focal * dot(v, cam.u) / dot(v, cam.f); };
const Y_UP = (() => { let a = -2, b = 3; const want = H * (0.5 - 0.415); for (let i = 0; i < 60; i++) { const m = (a + b) / 2; if (projectY(camEnd, m) < want) a = m; else b = m; } return (a + b) / 2; })();

// ---------------------------------------------------------------- logo
const RING_R = [1.0, 0.755, 0.51];
const SPAN = 255 * Math.PI / 180;
const GAP_C = [38, 158, 278].map(a => a * Math.PI / 180);     // gap centres (degrees, counter-clockwise from +x)
const RING_ARC = GAP_C.map(g => { const a0 = g + (2 * Math.PI - SPAN) / 2; return [a0, a0 + SPAN]; });
const RINGS = [
  { axis: norm([0.0, 1.0, 0.1]), turns: 1, spin: 1, w0: T_IGN + 0.04, w1: T_LOCK - 0.38 },
  { axis: norm([1.0, 0.1, 0.0]), turns: -1, spin: -1, w0: T_IGN + 0.12, w1: T_LOCK - 0.19 },
  { axis: norm([0.68, 0.72, 0.12]), turns: 1, spin: 1, w0: T_IGN + 0.2, w1: T_LOCK },
];
const S_TURN = profile(1.55, 2.35), S_SPIN = profile(1.8, 2.2);
const yawSpin = track(0, [[T_IGN + 0.15, 0.34, 1.7, 0.92], [5.2, -0.27, 1.25, 0.9], [7.5, 0, 3.0, 0.68]]);
const pitchSpin = track(0, [[T_IGN + 0.15, -0.2, 1.9, 0.92], [5.9, 0.15, 1.35, 0.9], [7.7, 0, 3.1, 0.66]]);
const rollSpin = track(0, [[T_IGN + 0.1, 0.5, 1.4, 0.95], [6.4, -0.3, 1.2, 0.9], [7.6, 0, 2.8, 0.75]]);

function logoState(t, cam) {
  const dI = t - T_IGN, s = {};
  s.ign = dI < 0 ? 0 : 1 - Math.exp(-dI * 18);
  s.flash = dI < 0 ? 0 : Math.exp(-dI * 4.2) * (1 - Math.exp(-dI * 90));
  const up = spring(dI, 5.0, 0.74), down = smoother(seg(t, 7.1, T_LOCK + 0.05));
  s.E = up * (1 - down);
  const inhale = smoother(seg(t, 1.9, 2.24));
  s.scale = lerp(0.47 - 0.03 * inhale, 1.0, spring(dI, 6.2, 0.7)) + 0.2 * s.E + 0.025 * pulse(t - T_LOCK, 0.04, 0.35);
  s.R = RING_R.map((r, i) => r * (1 + (0.12 + 0.08 * i) * s.E));
  s.coreR = 0.13 * (1 + 0.3 * s.E) * (1 + 0.06 * beatEnv(t));
  s.pos = [0, Y_UP * spring(t - T_RISE, 4.0, 1.0), 0];
  // face the camera, then add the spin on top
  const to = sub(cam.pos, s.pos);
  const yawF = Math.atan2(to[0], to[2]), pitchF = Math.atan2(to[1], Math.hypot(to[0], to[2]));
  s.G = mm(mm(rotY(yawF), rotX(-pitchF)), mm(rotY(yawSpin(t)), mm(rotX(pitchSpin(t)), rotZ(rollSpin(t)))));
  s.M = RINGS.map(rg => { const u = seg(t, rg.w0, rg.w1); return mm(rotAxis(rg.axis, 2 * Math.PI * rg.turns * S_TURN(u)), rotZ(2 * Math.PI * rg.spin * S_SPIN(u))); });
  // light levels
  const ember = 0.05 + 0.05 * smooth(seg(t, 0.4, 1.4)) + EMBERS.reduce((a, te, i) => a + (0.12 + 0.07 * i) * pulse(t - te, 0.04, 0.22), 0);
  const settle = 0.82 + 0.18 * Math.exp(-Math.max(t - T_LOCK, 0) * 1.2);
  const breath = t > T_LOCK ? 1 + 0.045 * Math.sin((t - T_LOCK) * 2.6) * smooth(seg(t, T_LOCK, T_LOCK + 1)) : 1;
  s.coreI = dI < 0 ? ember : (2.6 + 30 * s.flash + 1.2 * beatEnv(t)) * settle * breath;
  s.coreLight = dI < 0 ? ember * 3 : (7 + 70 * s.flash + 3 * beatEnv(t)) * settle * breath;
  s.glow = s.ign * (1 + 0.18 * beatEnv(t) + 0.35 * pulse(t - T_LOCK, 0.03, 0.5)) * (t > T_LOCK ? lerp(1, 0.9, smooth(seg(t, T_LOCK, 10.5))) * breath : 1);
  s.ringGlow = [0, 1, 2].map(i => 1 + 0.6 * pulse(t - (RINGS[i].w1), 0.02, 0.3));
  s.flowPh = t * 0.55 + 0.6 * S_TURN(seg(t, T_IGN, T_LOCK));
  s.flowAmt = (t < T_IGN ? 0.9 * smooth(seg(t, 0.9, 2.2)) : 0.55 * (1 - smooth(seg(t, 8.4, 9.4)))) + 0.25 * pulse(t - T_LOCK, 0.05, 0.6);
  s.glint = lerp(-1.9, 1.9, smooth(seg(t, 10.3, 10.95)));
  s.bound = Math.max(...s.R) + 0.1;

}
const ringPointWorld = (L, i, ang, dr = 0, dz = 0) => {
  const R = L.R[i] + dr, pl = mv(L.M[i], [R * Math.cos(ang), R * Math.sin(ang), dz]);
  return add(L.pos, mv(L.G, mul(pl, L.scale)));
};
const PAL = [[0.04, 0.13, 1.0], [0.2, 0.1, 1.0], [0.5, 0.11, 1.0], [0.8, 0.16, 0.95]];
const pal = x => { x = clamp(x) * 3; const i = Math.min(2, Math.floor(x)), k = x - i; return [0, 1, 2].map(c => lerp(PAL[i][c], PAL[i + 1][c], k)); };

// ---------------------------------------------------------------- room
const SPOT_POS = [0.0, 8.6, 0.9];
const SPOT_DIR = norm(sub([0, -0.1, 0], SPOT_POS));
function roomState(t) {
  const on = smooth(seg(t, 0.15, 1.5));
  const spotI = on * (t < T_IGN ? 1 : lerp(1, 0.28, smooth(seg(t, T_IGN, T_IGN + 1.2)))) * (t > T_LOCK ? lerp(1, 0.6, smooth(seg(t, T_LOCK, 10.5))) : 1);
  const rim = 0.25 * on + 0.9 * (t < T_IGN ? 0 : 1 - Math.exp(-(t - T_IGN) * 3));
  return { spotI, rim, room: on };
}
// ripples: ignition shockwave, strong beats, lock
function ripples(t) {
  const list = [];
  const add1 = (t0, speed, I, w, chroma, far) => { const a = t - t0; if (a <= 0 || a > 4) return; list.push([0.25 + far * (1 - Math.exp(-a * speed)), I * Math.exp(-a * 1.5) * smooth(a / 0.05), w * (1 + a * 1.4), chroma]); };
  add1(T_IGN, 1.5, 0.6, 0.03, 1, 15);
  for (const tb of STRONG) add1(tb, 1.3, 0.16, 0.03, 0, 5.5);
  add1(T_LOCK, 1.4, 0.3, 0.03, 1, 7);
  list.sort((a, b) => b[1] - a[1]);
  while (list.length < 4) list.push([0, 0, 1, 0]);
  return list.slice(0, 4);
}
// background shapes: [x, y, z, size, type(0 circle, 1 polygon, 2 soft orb), sides, stroke, fill, blur, halo, colour 0..1, intensity, appear, rotSpeed, tiltX, tiltY, stepDir]
const SHAPES = [
  [0, 0, -2.6, 2.45, 0, 0, .009, 0, .03, .45, .7, .34, 2.32, 0, 0, 0, 0],
  [0, 0.1, -6.5, 3.6, 1, 6, .014, .0, .09, .35, .15, .2, 2.6, .05, 0, 0, 1],
  [0, 1.4, -12, 5.6, 1, 3, .02, .0, .22, .3, .85, .11, 2.95, -.035, 0, 0, -1],
  [-8.2, 3.4, -9, 1.5, 0, 0, .018, .05, .28, .2, .1, .22, 3.3, 0, .3, .4, 0],
  [9.0, 1.4, -11, 1.8, 1, 4, .02, .035, .34, .2, .75, .22, 3.6, .08, -.2, -.35, 1],
  [-10.2, 0.2, -13, 2.2, 1, 3, .024, .03, .42, .2, .35, .2, 3.9, -.06, .25, .3, -1],
  [10.5, 4.9, -15, 2.6, 1, 6, .026, .03, .55, .2, .9, .17, 4.2, .04, -.15, -.3, 1],
  [4.4, 5.6, -12, 1.0, 0, 0, .02, .06, .32, .2, .5, .22, 4.5, 0, 0, 0, 0],
  [-5.6, -1.0, -6.5, 0.85, 1, 4, .012, .02, .14, .25, .2, .26, 4.7, .1, .2, .5, -1],
  [-6.5, 1.8, -19, 6.5, 2, 0, 0, .035, 1.5, 0, .05, 1, 3.0, 0, 0, 0, 0],
  [7.5, 0.2, -21, 7.5, 2, 0, 0, .032, 1.8, 0, .9, 1, 3.4, 0, 0, 0, 0],
  [-6.6, 2.6, 6.2, 0.62, 0, 0, .02, .02, .24, .2, .6, .28, 5.0, 0, 0, 0, 0],
  [6.2, -1.1, 5.4, 0.7, 1, 3, .022, .02, .28, .2, .25, .26, 5.3, .15, .1, -.2, 1],
  [5.9, 3.1, -5, 0.6, 1, 4, .01, .0, .07, .3, .3, .34, 5.6, .2, .3, -.4, 1],
  [-4.2, 3.5, -4, 0.46, 1, 3, .009, .0, .07, .3, .8, .34, 5.9, -.25, -.2, .3, -1],
  [0, 0.6, -15, 9.4, 0, 0, .02, 0, .4, .2, .45, .1, 3.15, 0, 0, 0, 0],

function shapeUniforms(t, L) {
  const A = [], E1 = [], E2 = [], C = [], D = [];
  const env = beatEnv(t), steps = beatSteps(t), calm = t > T_LOCK ? lerp(1, 0.72, smooth(seg(t, T_LOCK, 10.6))) : 1;
  for (const [si, s] of SHAPES.entries()) {
    const [x, y0, z, R, type, sides, stroke, fill, blur, halo, col, I, ta, rs, tx, ty, sd] = s;
    const y = y0 + (si < 2 ? L.pos[1] : 0);          // the halo and the hexagon stay centred on the logo
    const a = t - ta, vis = smooth(seg(t, ta, ta + 1.1));
    const grow = 0.72 + 0.28 * spring(a, 3.6, 0.9);
    const drift = si < 2 ? [0, 0, 0] : [0.12 * Math.sin(t * 0.21 + x), 0.1 * Math.sin(t * 0.17 + z) + 0.04 * t, 0];
    const rot = (type === 1 ? Math.PI / 2 : 0) + rs * t + sd * steps * Math.PI / 12 * (sides === 4 ? 1 : 0.67);
    // plane basis: tilt (slowly rocking), then in-plane rotation
    const T = mm(rotY(ty + 0.12 * Math.sin(t * 0.3 + x)), rotX(tx + 0.1 * Math.sin(t * 0.27 + y)));
    const ex = mv(T, [1, 0, 0]), ey = mv(T, [0, 1, 0]), cr = Math.cos(rot), sr = Math.sin(rot);
    const e1 = add(mul(ex, cr), mul(ey, sr)), e2 = add(mul(ey, cr), mul(ex, -sr));
    const size = R * grow * (1 + 0.035 * env);
    A.push(x + drift[0], y + drift[1], z, size);
    E1.push(...e1, type); E2.push(...e2, sides);
    const c = pal(col), k = I * vis * (1 + 0.9 * env) * calm * (t < T_IGN ? 0 : 1);
    C.push(c[0] * k, c[1] * k, c[2] * k, k);
    D.push(stroke, fill, blur, halo);
  }
  return { A, E1, E2, C, D };
}

// ---------------------------------------------------------------- particles (pure functions of time)

  };
  pad([50, 57, 62], 0.5, 2.12, { gain: 0.02, att: 1.4, rel: 0.12 });                 // dark dyad, cut for the inhale
  pad([50, 53, 57, 64, 69], T_IGN, 5.25, { gain: 0.03, att: 0.12, rel: 0.7 });    // Dm(add9)
  pad([46, 50, 53, 57, 60, 65], 5.25, 7.5, { gain: 0.028, att: 0.5, rel: 0.7 });   // Bbmaj7(9)
  pad([48, 55, 62, 64, 67], 7.5, 9.0, { gain: 0.031, att: 0.45, rel: 0.4 });       // C(add9)
  pad([50, 57, 62, 64, 66, 69], T_LOCK, 12.4, { gain: 0.032, att: 0.18, rel: 1.2 }); // D(add9)

  // --- brass swell on the lock (saws through an opening low-pass)
  for (const n of [50, 57, 62, 66]) {
    const lp = filt('lowpass', 350, 1.2), g = ctx.createGain(); lp.connect(g); g.connect(bus(0.6, 0.7));
    lp.frequency.setValueAtTime(350, T_LOCK); lp.frequency.exponentialRampToValueAtTime(3000, T_LOCK + 0.16); lp.frequency.exponentialRampToValueAtTime(900, T_LOCK + 2.4);
    g.gain.setValueAtTime(0, T_LOCK - 0.01); g.gain.linearRampToValueAtTime(0.03, T_LOCK + 0.05); g.gain.setTargetAtTime(0.014, T_LOCK + 0.2, 0.6); g.gain.setTargetAtTime(0, 11.0, 0.3);
    [-7, 7].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(n); o.detune.value = dt; o.connect(lp); o.start(T_LOCK - 0.01); o.stop(12.2); });
  }
  // --- bass
  const bass = (n, t0, t1, gain = 0.13) => {
    const g = ctx.createGain(), lp = filt('lowpass', 260, 0.8); g.connect(lp); lp.connect(bus(0.9, 0.08));
    g.gain.setValueAtTime(0, t0); g.gain.setTargetAtTime(gain, t0, 0.05); g.gain.setValueAtTime(gain, t1); g.gain.setTargetAtTime(0, t1, 0.12);
    const o1 = ctx.createOscillator(); o1.frequency.value = midi(n); const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = midi(n); o2.detune.value = 6;
    const g2 = ctx.createGain(); g2.gain.value = 0.35; o1.connect(g); o2.connect(g2); g2.connect(g); o1.start(t0); o2.start(t0); o1.stop(t1 + 1); o2.stop(t1 + 1);
  };
  bass(38, T_IGN, 5.25, 0.07); bass(34, 5.25, 7.5, 0.07); bass(36, 7.5, 9.0, 0.075); bass(38, T_LOCK, 12.3, 0.085);

  // --- "choir" (formant-filtered saws) for the top line
  const choir = (notes, t0, t1, gain = 0.02) => {
    for (const n of notes) {
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.setTargetAtTime(gain, t0, 0.35); g.gain.setValueAtTime(gain, t1); g.gain.setTargetAtTime(0, t1, 0.3);
      const sum = ctx.createGain(); sum.connect(g); g.connect(bus(0.35, 1.0));
      for (const [ff, q, a] of [[730, 9, 1], [1150, 10, 0.5], [2650, 12, 0.25]]) { const b = filt('bandpass', ff, q), ga = ctx.createGain(); ga.gain.value = a * 4; b.connect(ga); ga.connect(sum); [-6, 6].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(n); o.detune.value = dt; const v = ctx.createOscillator(), vg = ctx.createGain(); v.frequency.value = 5.1; vg.gain.value = 7; v.connect(vg); vg.connect(o.detune); o.connect(b); o.start(t0); v.start(t0); o.stop(t1 + 1.5); v.stop(t1 + 1.5); }); }
    }
  };
  choir([69, 74], T_IGN + 0.3, 5.25); choir([69, 77], 5.25, 7.5); choir([72, 76], 7.5, 9.0); choir([74, 78, 81], T_LOCK, 12.3, 0.022);

  // --- bells (FM)
  const bell = (t, n, { gain = 0.03, ratio = 3.5, index = 2.5, dec = 1.0, pan = 0, dest = bellBus } = {}) => {
    const fq = midi(n), car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain(), p = ctx.createStereoPanner();
    car.frequency.value = fq; mod.frequency.value = fq * ratio; mg.gain.setValueAtTime(index * fq, t); mg.gain.setTargetAtTime(index * fq * 0.08, t, dec * 0.25);
    mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(p); p.pan.value = pan; p.connect(dest);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.004); g.gain.setTargetAtTime(0, t + 0.004, dec / 3);
    car.start(t); mod.start(t); car.stop(t + dec * 3); mod.stop(t + dec * 3);
  };
  // arpeggio on eighths through the spin
  const chordAt = t => t < 5.25 ? [62, 65, 69, 76, 81, 77] : t < 7.5 ? [62, 65, 69, 72, 77, 74] : [64, 67, 72, 74, 79, 76];
  for (let i = 0, t = 2.625; t < 8.95; i++, t += 0.375) {
    const ch = chordAt(t), n = ch[i % ch.length];
    bell(t, n, { gain: (0.028 + 0.03 * seg(t, 2.6, 8.6)) * (0.8 + 0.4 * R()), ratio: 2, index: 1.6, dec: 0.55, pan: (i % 2 ? 0.45 : -0.45) });
  }
  bell(T_IGN, 86, { gain: 0.03, dec: 2.2, pan: -0.3 }); bell(T_IGN, 93, { gain: 0.022, dec: 2.4, pan: 0.3 }); bell(T_IGN + 0.01, 100, { gain: 0.012, dec: 2.0 });
  bell(8.62, 93, { gain: 0.03, dec: 0.8, pan: -0.4 }); bell(8.81, 98, { gain: 0.03, dec: 0.8, pan: 0.4 });
  bell(T_LOCK, 86, { gain: 0.032, dec: 2.6 }); bell(T_LOCK, 90, { gain: 0.022, dec: 2.6, pan: 0.25 }); bell(T_LOCK, 93, { gain: 0.02, dec: 2.6, pan: -0.25 });
  [86, 90, 93, 98].forEach((n, i) => bell(T_TEXT + 0.04 + i * 0.075, n, { gain: 0.02, dec: 1.0, pan: -0.3 + 0.2 * i }));
  bell(10.5, 105, { gain: 0.009, dec: 1.8, ratio: 3.5 }); bell(10.56, 102, { gain: 0.008, dec: 1.8 });

  // --- drums
  const drum = (t, { f0 = 120, f1 = 46, dec = 0.55, gain = 0.5, nz = 0.16, nf = 900 } = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.16);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.003); g.gain.setTargetAtTime(0, t + 0.01, dec / 4);
    o.connect(g); g.connect(drumBus); o.start(t); o.stop(t + dec * 2);
    const ng = ctx.createGain(), nl = filt('lowpass', nf); ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(nz, t + 0.002); ng.gain.setTargetAtTime(0, t + 0.004, 0.03);
    nl.connect(ng); ng.connect(drumBus); noise(t, t + 0.3, nl, t * 3.7);
  };
  EMBERS.forEach((te, i) => drum(te, { f0: 75, f1: 40, dec: 0.5, gain: 0.12 + 0.05 * i, nz: 0.01 }));
  for (const [tb, s] of BEATS) { if (tb >= T_LOCK) continue; const strong = STRONG.includes(tb); drum(tb, strong ? { gain: 0.55, f0: 130, f1: 44, dec: 0.8, nz: 0.2 } : { gain: 0.32 * s / 0.6, f0: 95 + (tb > 8.3 ? 25 * (tb - 8.3) : 0), f1: 48, dec: 0.45, nz: 0.1 }); }
  for (let t = 6.0; t < 8.95; t += 0.1875) {          // shaker build
    const g = ctx.createGain(), hp = filt('highpass', 7000), p = ctx.createStereoPanner(); p.pan.value = Math.round((t - 6) / 0.1875) % 2 ? 0.35 : -0.35;
    const acc = Math.round((t - 6) / 0.1875) % 2 ? 1.4 : 1, a = (0.006 + 0.02 * seg(t, 6, 8.9)) * acc;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.004); g.gain.setTargetAtTime(0, t + 0.006, 0.018);
    hp.connect(g); g.connect(p); p.connect(drumBus); noise(t, t + 0.12, hp, t * 5.1);
  }

  // --- risers, impacts, whooshes
  sample(SFX.riser, T_IGN - 1.96, { gain: 0.55, dest: fxBus });
  const swell = (t0, t1, f0, f1, peak, dest = fxBus) => {
    const bp = filt('bandpass', f0, 1.2), g = ctx.createGain(); bp.connect(g); g.connect(dest); noise(t0, t1 + 0.05, bp, t0 * 2.3);
    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t1);
    g.gain.setValueAtTime(0.0003, t0); g.gain.exponentialRampToValueAtTime(peak, t1 - 0.02); g.gain.linearRampToValueAtTime(0, t1);
  };
  swell(1.0, T_IGN - 0.03, 350, 6000, 0.07);
  swell(7.9, T_LOCK - 0.01, 600, 7500, 0.055);
  const boom = (t, { f0 = 62, f1 = 28, gain = 0.9, dec = 1.9 } = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), ws = ctx.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(x * 2.2) / Math.tanh(2.2); }
    ws.curve = curve; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 1.1);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.006); g.gain.setTargetAtTime(0, t + 0.02, dec / 4);
    o.connect(ws); ws.connect(g); g.connect(subBus); o.start(t); o.stop(t + dec * 2.5);
  };
  const burst = (t, { gain = 0.3, f0 = 7000, f1 = 380, dec = 0.9 } = {}) => {
    const lp = filt('lowpass', f0, 0.5), g = ctx.createGain(); lp.connect(g); g.connect(bus(0.45, 1.1)); noise(t, t + dec * 2.5, lp, t * 1.9);
    lp.frequency.setValueAtTime(f0, t); lp.frequency.exponentialRampToValueAtTime(f1, t + dec);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.004); g.gain.setTargetAtTime(0, t + 0.01, dec / 3.5);
  };
  boom(T_IGN); burst(T_IGN); sample(SFX.impact, T_IGN, { gain: 0.9, rate: 0.82, dest: fxBus }); sample(SFX.impact, T_IGN + 0.004, { gain: 0.5, rate: 0.55, lp: 2500, dest: fxBus });
  boom(T_LOCK, { f0: 56, f1: 32, gain: 0.8, dec: 1.6 }); burst(T_LOCK, { gain: 0.18, f0: 5000, dec: 0.8 }); sample(SFX.impact, T_LOCK, { gain: 0.45, rate: 0.9, dest: fxBus });
  sample(SFX.triangle, T_LOCK, { gain: 0.42, dest: bellBus }); sample(SFX.triangle, 10.48, { gain: 0.14, rate: 1.5, hp: 2000, dest: bellBus });
  const whoosh = (t, { rate = 0.6, gain = 0.3, pan = 0, lp = 3500, hp = 0 } = {}) => sample(SFX.whoosh, t, { gain, rate, pan, lp, hp, dest: fxBus });
  const air2 = (t0, dur, peak, p0, p1) => {
    const bp = filt('bandpass', 400, 1.4), g = ctx.createGain(), p = ctx.createStereoPanner(); bp.connect(g); g.connect(p); p.connect(fxBus); noise(t0, t0 + dur + 0.1, bp, t0 * 4.1);
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(2600, t0 + dur * 0.55); bp.frequency.exponentialRampToValueAtTime(500, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + dur * 0.55); g.gain.linearRampToValueAtTime(0, t0 + dur);
    p.pan.setValueAtTime(p0, t0); p.pan.linearRampToValueAtTime(p1, t0 + dur);
  };
  whoosh(2.36, { rate: 0.5, gain: 0.35 }); air2(2.5, 1.3, 0.05, -0.6, 0.6);
  air2(4.0, 1.2, 0.04, 0.6, -0.6); air2(5.5, 1.2, 0.045, -0.6, 0.6); air2(7.0, 1.2, 0.05, 0.6, -0.6);
  whoosh(8.5, { rate: 0.7, gain: 0.25, pan: 0 });
  whoosh(T_TEXT - 0.06, { rate: 1.05, gain: 0.2, hp: 900, lp: 9000 }); air2(T_TEXT - 0.1, 0.9, 0.03, -0.3, 0.3);
};

// ---------------------------------------------------------------- boot
async function boot() {
  const face = new FontFace('Geist', b64buf(ASSETS.geist), { weight: '100 900' });
  await face.load(); document.fonts.add(face); await document.fonts.ready;
  bakeParticles();
  window.VIDEO = { w: W, h: H, duration: DUR, fps: FPS, sub: SUB };
  window.seek = t => { render(t); gl.finish(); };
  if (!RENDER) preview(); else render(0);
}
function preview() {
  const stage = document.getElementById('stage');
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; btn.innerHTML = '&#10074;&#10074;';
  }
  function pause() { if (!playing) return; offset = now(); src.stop(); playing = false; btn.innerHTML = '&#9654;'; }
  function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
  btn.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
  scrub.oninput = () => { const was = playing; pause(); offset = +scrub.value; if (was) play(); };
  let last = -1;
  (function loop() { const t = now(); if (t !== last) { render(t); last = t; } scrub.value = t; tc.textContent = t.toFixed(2).padStart(5, '0'); requestAnimationFrame(loop); })();
}
boot();
</script>
</body>
