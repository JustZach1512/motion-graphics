<!doctype html>

<style>
/*@@FONTS@@*/
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #111014; color: #EDEBE4; font-family: Inter, system-ui, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
#wrap { position: relative; flex: none; overflow: hidden; border-radius: 10px; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4EFE6; transform-origin: 0 0; }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.layer > svg { position: absolute; left: 0; top: 0; overflow: visible; }
#L3card { perspective: 1600px; }
#L3tilt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 560px; }
#FLASH { background: #fff; opacity: 0; pointer-events: none; }
#controls { display: flex; align-items: center; gap: 12px; width: min(92vw, 1100px); padding: 0 16px; box-sizing: border-box; }
#controls button { background: #FFD23F; color: #17120F; border: 0; border-radius: 999px; font: 800 15px Inter, sans-serif; padding: 9px 18px; cursor: pointer; }
#controls input { flex: 1; accent-color: #FFD23F; }
#controls span { font: 600 13px 'Press Start 2P', monospace; min-width: 120px; text-align: right; }
body.render { display: block; background: transparent; }
body.render #wrap { border-radius: 0; width: 1920px; height: 1080px; }
body.render #controls { display: none; }
</style>
</head>

  <div id="cam" class="layer">

    <div id="L4" class="layer"></div>
  </div>
  <div id="LT" class="layer"></div>

  <div id="FLASH" class="layer"></div>
</div></div>

  </defs>
