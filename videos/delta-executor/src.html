<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta Executor explicado</title>
<style>
@font-face{font-family:'Geist';src:url(data:font/woff2;base64,{{GEIST}}) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'GeistMono';src:url(data:font/woff2;base64,{{GEISTMONO}}) format('woff2');font-weight:100 900;font-style:normal}
:root{--bg:#07090E;--fg:#EEF1F7;--mut:#8A93A6;--dim:#5A6276;--line:#1D2330;--card:#0D1119;--acc:#5B8CFF;--accA:rgba(91,140,255,.34);--red:#FF4D5E;--redA:rgba(255,77,94,.32)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Geist',sans-serif;transform-origin:0 0}
#bg{position:absolute;left:0;top:0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
.cam,.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute;white-space:nowrap}
.line{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);letter-spacing:-.025em;isolation:isolate;line-height:1.2}
.w{display:inline-block}
.hl{position:relative;display:inline-block}
.hlbox{position:absolute;left:-.12em;right:-.12em;top:.06em;bottom:0;background:var(--accA);border-radius:.14em;transform-origin:0 50%;transform:scaleX(0);z-index:-1}
.hl.red .hlbox{background:var(--redA)}
.mono{font-family:'GeistMono',monospace;font-weight:500;letter-spacing:.08em}
.para{position:absolute;white-space:normal;line-height:1.34;letter-spacing:-.01em}
.cap{text-shadow:0 2px 16px rgba(0,0,0,.8)}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:24px}
svg text{font-family:'Geist',sans-serif}
svg .m{font-family:'GeistMono',monospace;font-weight:500}
#ui{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0b0d12;color:#cfd5e0;font:14px system-ui,sans-serif}
#ui button{background:#1c2232;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
#ui input{flex:1}
</style>
</head>
<body>
<div id="stage"><canvas id="bg" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.0 s</span></div>
<script>
'use strict';
/* =====================================================================
   DELTA EXECUTOR · EXPLICADO  (16:9, 126 s, español)
   Beat sheet (tiempos absolutos)                                  sonido
   0.0   A  Intro: "Delta Executor", qué hace / cómo / por qué     tick, whoosh, pop
   6.6   B  "Un executor mete tus propios scripts…" push + resaltado whoosh, tick
   11.2  C  Móvil: botón flotante, panel, se teclea WalkSpeed=100  click, tecleo, click, pop, whoosh
   21.0  D1 PARTE 1 · ¿Qué hace en los juegos?                     tick, impacto suave
   23.6  D2 4 tarjetas: auto-farm, ESP, velocidad/vuelo, teleport  pop por tarjeta
   35.0  E1 PARTE 2 · ¿Cómo funciona?                              tick, impacto (entra batería)
   37.6  E2 4 pasos: app modificada → VM Luau → tu script → extras tick por paso, pops
   58.0  E3 Cliente vs servidor: 2 paquetes aceptados, 1 rechazado whoosh, pop, impacto
   70.4  F1 PARTE 3 · ¿Por qué el anticheat no lo detecta?         riser → impacto
   73.2  F2 Hyperion (Byfron): 2022 compra, 2023 Windows           whoosh, ticks
   79.6  F3 Razón 1: se diseñó para PC; executors → móvil          clicks (rebotes), pops
   86.0  F4 Razón 2: no entra desde fuera (cheat.exe vs Delta)     impacto, pop, ticks
   93.6  F5 Razón 3: para el servidor eres un jugador más          —
   99.4  F6 Razón 4: el gato y el ratón (bucle de versiones)       ticks
   105.6 F7 Pero no es invisible: baneo diferido                   ticks, riser, impacto fuerte
   113.0 G  Riesgos reales                                         pops
   120.0 H  "Indetectable hoy no significa seguro mañana."         whoosh
   ===================================================================== */
const W = 1920, H = 1080;
const T = { A: 0, B: 6.6, C: 11.2, D1: 21.0, D2: 23.6, E1: 35.0, E2: 37.6, E3: 58.0, F1: 70.4, F2: 73.2, F3: 79.6, F4: 86.0, F5: 93.6, F6: 99.4, F7: 105.6, G: 113.0, H: 120.0, END: 126.0 };
const DUR = T.END;
window.VIDEO = { w: W, h: H, duration: DUR };
const RENDER = /[?&]render\b/.test(location.search);
const C = { fg: '#EEF1F7', mut: '#8A93A6', dim: '#5A6276', line: '#1D2330', card: '#0D1119', acc: '#5B8CFF', accL: '#A9C1FF', red: '#FF4D5E', grn: '#34D399', amb: '#FFB547' };
const NS = 'http://www.w3.org/2000/svg';

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eBack = x => { x = clamp(x); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pulse = (t, a, d) => { const k = (t - a) / d; return k <= 0 || k >= 1 ? 0 : Math.sin(Math.PI * k); };
const bez = (a, c, b, k) => [(1 - k) * (1 - k) * a[0] + 2 * (1 - k) * k * c[0] + k * k * b[0], (1 - k) * (1 - k) * a[1] + 2 * (1 - k) * k * c[1] + k * k * b[1]];
const f1 = v => (+v).toFixed(1), f2 = v => (+v).toFixed(3);
const px = v => v + 'px';

const stage = document.getElementById('stage');
function $(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function css(e, o) { for (const k in o) e.style[k] = o[k]; return e; }
function Svg(parent, w, h, cx, cy) {
  const e = document.createElementNS(NS, 'svg');
  e.setAttribute('width', w); e.setAttribute('height', h); e.setAttribute('viewBox', `0 0 ${w} ${h}`);
  e.style.cssText = `position:absolute;left:${cx - w / 2}px;top:${cy - h / 2}px;overflow:visible`;
  parent.appendChild(e); return e;
}
function Glow(parent, x, y, r, col) {
  const c = $('canvas', '', parent); c.width = r * 2; c.height = r * 2;
  css(c, { position: 'absolute', left: px(x - r), top: px(y - r) });
  const g = c.getContext('2d'), rg = g.createRadialGradient(r, r, 0, r, r, r);
  rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, r * 2, r * 2);
  return c;
}
// absolutely positioned single-line text; anchor c (centre), l (left), r (right)
function Txt(parent, html, o = {}) {
  const e = $('div', 'abs' + (o.mono ? ' mono' : ''), parent, html);
  css(e, { left: px(o.x ?? 960), top: px(o.y ?? 540), fontSize: px(o.size ?? 30), fontWeight: o.weight ?? 500, color: o.color ?? C.fg });
  if (o.ls != null) e.style.letterSpacing = o.ls;
  e._pre = o.anchor === 'l' ? 'translate(0,-50%) ' : o.anchor === 'r' ? 'translate(-100%,-50%) ' : 'translate(-50%,-50%) ';
  e.style.transform = e._pre; e.style.opacity = 0;
  return e;
}
// wrapping paragraph, anchored at its top
function Para(parent, html, o = {}) {
  const e = $('div', 'para' + (o.cls ? ' ' + o.cls : ''), parent, html), al = o.align ?? 'center';
  css(e, { left: px(o.x ?? 960), top: px(o.y ?? 880), width: px(o.w ?? 1400), fontSize: px(o.size ?? 30), color: o.color ?? '#C9D0DC', fontWeight: o.weight ?? 400, textAlign: al });
  e._pre = al === 'center' ? 'translateX(-50%) ' : '';
  e.style.opacity = 0; return e;
}
function show(el, lt, a, dur = 0.5, rise = 16, b = 1e9) {
  const k = Math.min(eOut(seg(lt, a, a + dur)), 1 - ease(seg(lt, b - 0.35, b)));
  el.style.opacity = f2(k); el.style.transform = `${el._pre || ''}translateY(${f1((1 - k) * rise)}px)`;
  return k;
}
// a line of words; *text* = highlighted phrase
function Line(parent, text, o = {}) {
  const el = $('div', 'line', parent);
  css(el, { left: px(o.x ?? 960), top: px(o.y ?? 540), fontSize: px(o.size ?? 40), fontWeight: o.weight ?? 500, color: o.color ?? C.fg });
  const words = [], boxes = [];
  text.split('*').forEach((part, i) => {
    if (!part) return;
    let host = el;
    if (i % 2) { host = $('span', 'hl' + (o.red ? ' red' : ''), el); boxes.push($('span', 'hlbox', host)); }
    part.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { host.appendChild(document.createTextNode(' ')); return; }
      const w = $('span', 'w', host); w.textContent = tok; w.style.opacity = 0; words.push(w);
    });
  });
  return {
    el,
    reveal(lt, start, per = 0.07, dur = 0.45, rise = 18) {
      words.forEach((w, i) => { const k = eOut(seg(lt, start + i * per, start + i * per + dur)); w.style.opacity = f2(k); w.style.transform = `translateY(${f1((1 - k) * rise)}px)`; });
    },
    hl(lt, start, dur = 0.5) { boxes.forEach((b, i) => { b.style.transform = `scaleX(${f2(ease(seg(lt, start + i * 0.15, start + i * 0.15 + dur)))})`; }); },
  };
}

// blocky avatar, front view. (x, y) = feet centre
function avatar(x, y, s = 1, o = {}) {
  const a = (o.sw || 0) * Math.sin(o.ph || 0), sy = o.sy ?? 1;
  const hc = '#F5CD30', tc = '#2F6FDB', lc = '#4CAF50', g = o.ghost;
  const st = g ? ` stroke="${g}" stroke-width="${f2(1.8 / s)}" stroke-dasharray="${f2(4 / s)} ${f2(3 / s)}"` : '';
  const F = c => g ? 'rgba(91,140,255,.10)' : c;
  const face = g ? '' : `<rect x="-6" y="-84" width="3" height="5" rx="1" fill="#1b1b1b"/><rect x="3" y="-84" width="3" height="5" rx="1" fill="#1b1b1b"/><path d="M-5 -75 Q0 -70.5 5 -75" stroke="#1b1b1b" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(o.lean || 0)}) scale(${f2(s)} ${f2(s * sy)})" opacity="${f2(o.op ?? 1)}">` +
    `<rect x="-15" y="-32" width="14.5" height="32" rx="2" fill="${F(lc)}"${st} transform="rotate(${f1(a)} -7.5 -32)"/>` +
    `<rect x="0.5" y="-32" width="14.5" height="32" rx="2" fill="${F(lc)}"${st} transform="rotate(${f1(-a)} 7.5 -32)"/>` +
    `<rect x="-30" y="-64" width="13.5" height="31" rx="2" fill="${F(hc)}"${st} transform="rotate(${f1(-a * .8)} -23 -62)"/>` +
    `<rect x="16.5" y="-64" width="13.5" height="31" rx="2" fill="${F(hc)}"${st} transform="rotate(${f1(a * .8)} 23 -62)"/>` +
    `<rect x="-16" y="-65" width="32" height="33" rx="2" fill="${F(tc)}"${st}/>` +
    `<rect x="-12" y="-91" width="24" height="24" rx="5" fill="${F(hc)}"${st}/>` + face + `</g>`;
}
// blocky avatar, side view (running right)
function avatarSide(x, y, s = 1, o = {}) {
  const a = (o.sw || 0) * Math.sin(o.ph || 0);
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(o.lean || 0)}) scale(${f2(s)})">` +
    `<rect x="-6" y="-63" width="12" height="31" rx="2" fill="#C9A21E" transform="rotate(${f1(a * .9)} 0 -61)"/>` +
    `<rect x="-7" y="-32" width="14" height="32" rx="2" fill="#3A8A3E" transform="rotate(${f1(-a)} 0 -32)"/>` +
    `<rect x="-9" y="-65" width="18" height="34" rx="2" fill="#2F6FDB"/>` +
    `<rect x="-7" y="-32" width="14" height="32" rx="2" fill="#4CAF50" transform="rotate(${f1(a)} 0 -32)"/>` +
    `<rect x="-6" y="-63" width="12" height="31" rx="2" fill="#F5CD30" transform="rotate(${f1(-a * .9)} 0 -61)"/>` +
    `<rect x="-12" y="-91" width="24" height="24" rx="5" fill="#F5CD30"/>` +
    `<rect x="5" y="-84" width="3" height="5" rx="1" fill="#1b1b1b"/><path d="M3 -75 Q7 -72 10 -75.5" stroke="#1b1b1b" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
}
const SHIELD = 'M0 -150 L125 -104 L125 4 C125 92 64 138 0 160 C-64 138 -125 92 -125 4 L-125 -104 Z';
const LOCK = (c, bg) => `<path d="M-26 -10 V-32 A26 26 0 0 1 26 -32 V-10" fill="none" stroke="${c}" stroke-width="9"/><rect x="-42" y="-12" width="84" height="66" rx="12" fill="${c}"/><circle cx="0" cy="14" r="8" fill="${bg}"/><rect x="-3" y="16" width="6" height="18" rx="3" fill="${bg}"/>`;
function rack(cx, cy, t) {
  let h = '';
  for (let k = 0; k < 3; k++) {
    const y = cy - 95 + k * 66;
    h += `<rect x="${cx - 110}" y="${y}" width="220" height="52" rx="10" fill="#141B2A" stroke="#2A3448" stroke-width="1.5"/>`;
    for (let j = 0; j < 2; j++) { const on = (Math.floor(t * 3.3 + k * 1.7 + j * 2.3) % 3) !== 0; h += `<circle cx="${cx - 82 + j * 20}" cy="${y + 26}" r="5" fill="${on ? C.grn : '#1E2B26'}"/>`; }
    h += `<rect x="${cx - 30}" y="${y + 19}" width="110" height="5" rx="2.5" fill="#222C40"/><rect x="${cx - 30}" y="${y + 29}" width="76" height="5" rx="2.5" fill="#222C40"/>`;
  }
  return h;
}
const CHECK = `<path d="M-9 0 l6 6 l12 -13" fill="none" stroke="${C.grn}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
const CROSS = `<path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="${C.red}" stroke-width="3.2" stroke-linecap="round"/>`;

// ---------- background (drawn once) ----------
(function () {
  const g = document.getElementById('bg').getContext('2d');
  g.fillStyle = '#07090E'; g.fillRect(0, 0, W, H);
  let rg = g.createRadialGradient(960, 360, 0, 960, 360, 1100);
  rg.addColorStop(0, 'rgba(46,70,140,0.20)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.045)';
  for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) { g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill(); }
  rg = g.createRadialGradient(960, 540, 320, 960, 540, 1150);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
})();

// ---------- scenes ----------
const ORDER = ['A', 'B', 'C', 'D1', 'D2', 'E1', 'E2', 'E3', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'G', 'H'];
const FADE = 0.4, scenes = [];
function Scene(key) {
  const i = ORDER.indexOf(key), a = T[key], b = i < ORDER.length - 1 ? T[ORDER[i + 1]] + FADE : DUR;
  const root = $('div', 'scene', stage), cam = $('div', 'cam', root), ov = $('div', 'ov', root);
  const s = { key, a, b, len: b - a, root, cam, ov, caps: [], sfx: [], upd: () => {} };
  s.cap = (text, t0, t1 = s.len, o = {}) => { const e = Para(ov, text, { y: o.y ?? 874, w: o.w ?? 1480, size: o.size ?? 31, color: '#D7DDE7', cls: 'cap' }); s.caps.push([e, t0, t1]); return e; };
  s.reason = (n, title) => {
    s.rh = { k: Txt(ov, `RAZÓN ${n}`, { mono: true, y: 132, size: 20, color: C.acc, ls: '.32em' }), L: Line(ov, title, { size: 54, weight: 640, y: 196 }) };
  };
  scenes.push(s); return s;
}
function setCam(s, x, y, k) { s.cam.style.transform = `translate(${f2(W / 2 - k * x)}px,${f2(H / 2 - k * y)}px) scale(${k.toFixed(4)})`; }
const camKF = keys => { const fx = kf(keys.map(k => [k[0], k[1]])), fy = kf(keys.map(k => [k[0], k[2]])), fk = kf(keys.map(k => [k[0], k[3]])); return t => [fx(t), fy(t), fk(t)]; };

// ===== A · intro =====
{
  const s = Scene('A');
  const glow = Glow(s.cam, 960, 520, 700, 'rgba(91,140,255,0.16)');
  const kick = Txt(s.cam, 'ROBLOX · EXPLICADO', { mono: true, y: 392, size: 22, color: C.mut, ls: '.34em' });
  const title = $('div', 'line', s.cam);
  css(title, { left: '960px', top: '512px', fontSize: '156px', fontWeight: 700, letterSpacing: '-.045em' });
  const chars = [...'Delta Executor'].map(c => { const sp = $('span', 'w', title); sp.textContent = c === ' ' ? ' ' : c; sp.style.opacity = 0; return sp; });
  const rule = $('div', 'abs', s.cam); css(rule, { left: '760px', top: '618px', width: '400px', height: '3px', background: C.acc, borderRadius: '2px', transform: 'scaleX(0)' });
  const sub = Line(s.cam, 'Qué hace · Cómo funciona · Por qué el anticheat no lo detecta', { size: 34, weight: 450, y: 690, color: '#C2C9D6' });
  const foot = Txt(s.cam, 'VÍDEO EDUCATIVO · NO ES UNA GUÍA DE USO', { mono: true, y: 965, size: 16, color: C.dim, ls: '.26em' });
  s.sfx = [[0.3, 'tick', .35], [0.75, 'whoosh', .45], [1.85, 'pop', .3], [4.3, 'tick', .25]];
  s.upd = lt => {
    setCam(s, 960, 540, lerp(1, 1.06, ease(seg(lt, 0, s.len))));
    glow.style.opacity = f2(ease(seg(lt, 0.6, 2.6)));
    show(kick, lt, 0.3, 0.6, 12);
    chars.forEach((c, i) => { const k = eOut(seg(lt, 0.8 + i * 0.045, 1.4 + i * 0.045)); c.style.opacity = f2(k); c.style.transform = `translateY(${f1((1 - k) * 60)}px)`; c.style.filter = k < 1 ? `blur(${f1((1 - k) * 12)}px)` : 'none'; });
    rule.style.transform = `scaleX(${f2(ease(seg(lt, 1.8, 2.6)))})`;
    sub.reveal(lt, 2.4, 0.08);
    show(foot, lt, 4.3, 0.6, 0);
  };
}

// ===== B · what an executor is =====
{
  const s = Scene('B');
  const L = Line(s.cam, 'Un executor mete *tus propios scripts* dentro de un juego de Roblox.', { size: 30, weight: 500 });
  s.sfx = [[1.4, 'whoosh', .3], [2.6, 'tick', .3]];
  s.upd = lt => {
    const k1 = clamp(0.8 * W / L.el.offsetWidth, 1, 3);
    setCam(s, 960, 540, kf([[0, 1], [1.4, 1], [2.6, k1], [s.len, k1 * 1.05]])(lt));
    L.reveal(lt, 0.25, 0.075);
    L.hl(lt, 2.6, 0.5);
  };
}

// ===== C · the phone demo =====
{
  const s = Scene('C');
  const PX = 320, PY = 220, PW = 1280, PH = 640, SX = PX + 16, SY = PY + 16, SW = 1248, SH = 608;
  const phone = $('div', '', s.cam); css(phone, { position: 'absolute', left: px(PX), top: px(PY), width: px(PW), height: px(PH), borderRadius: '64px', background: '#0A0D14', border: '2px solid #2A3244' });
  const screen = $('div', '', s.cam); css(screen, { position: 'absolute', left: px(SX), top: px(SY), width: px(SW), height: px(SH), borderRadius: '48px', overflow: 'hidden', background: '#000' });
  const game = Svg(screen, SW, SH, SW / 2, SH / 2);
  const fab = $('div', 'mono', screen, '&lt;/&gt;');
  css(fab, { position: 'absolute', left: '36px', top: '36px', width: '76px', height: '76px', borderRadius: '50%', background: 'rgba(10,13,20,.88)', border: '2px solid ' + C.acc, color: C.acc, fontSize: '22px', letterSpacing: '0', display: 'flex', alignItems: 'center', justifyContent: 'center' });
  const panel = $('div', '', screen);
  css(panel, { position: 'absolute', left: 0, top: 0, width: '620px', height: px(SH), background: 'rgba(10,13,20,.97)', borderRight: '1px solid #263045' });
  panel.innerHTML = `

    if (!sfx[n] || t < 0 || t >= DUR) continue;
    const src = ctx.createBufferSource(); src.buffer = sfx[n]; src.playbackRate.value = r;
    const gn = ctx.createGain(); gn.gain.value = g; src.connect(gn); gn.connect(fx); src.start(t);
  }
};

// ---------- preview ----------
if (RENDER) { document.getElementById('ui').remove(); }
else {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 56) / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - 56 - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = 'Cargando audio…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pp.textContent = 'Pausa';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
  function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
  pp.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  scrub.oninput = () => { const was = playing; pause(); offset = scrub.value / 1000 * DUR; if (was) play(); };
  (function loop() { const t = now(); seek(t); if (document.activeElement !== scrub) scrub.value = Math.round(t / DUR * 1000); tc.textContent = t.toFixed(1) + ' s'; requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
