*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}

  s.sfx = [[0.1, 'tick', .35], [0.55, 'impact', .32]];
  s.upd = lt => {

// ---------- seek ----------
window.seek = function (t) {
  t = clamp(t, 0, DUR - 1e-6);
  for (const s of scenes) {
    if (t < s.a || t > s.b) { s.root.style.display = 'none'; continue; }
    s.root.style.display = 'block';
    let k = Math.min(s.a <= 0 ? 1 : seg(t, s.a, s.a + FADE), s.b >= DUR ? 1 - seg(t, DUR - 1.0, DUR - 0.05) : 1 - seg(t, s.b - FADE, s.b));
    s.root.style.opacity = f2(k);
    s.root.style.filter = k < 0.999 && s.b < DUR ? `blur(${f1((1 - k) * 10)}px)` : 'none';
    const lt = t - s.a;
    s.upd(lt);
    for (const [e, a, b] of s.caps) show(e, lt, a, 0.5, 14, b);
    if (s.rh) { show(s.rh.k, lt, 0.05, 0.45, 10); s.rh.L.reveal(lt, 0.15, 0.06); }
  }
  hudUpd(t);
};

  const padLP = ctx.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 1300; padLP.Q.value = 0.4; padLP.connect(music);
  const pad = ctx.createGain(); pad.connect(padLP);
  pad.gain.setValueAtTime(0, 0); pad.gain.linearRampToValueAtTime(1, 2); pad.gain.setValueAtTime(1, DUR - 2.5); pad.gain.linearRampToValueAtTime(0, DUR - 0.05);
  for (let i = 0; i * CH < T.H + 0.5; i++) {
    const st = i * CH, last = st >= T.H - 0.01, len = last ? DUR - st : CH;
    for (const m of PROG[chordAt(i)]) for (const det of [-8, 8]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      const g = ctx.createGain(); o.connect(g); g.connect(pad);
      const a = Math.max(0, st - 0.35);
      g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(0.016, a + 0.9); g.gain.setValueAtTime(0.016, st + len - 0.1); g.gain.linearRampToValueAtTime(0, st + len + 0.9);
      o.start(a); o.stop(st + len + 1);
    }
  }
  // bass
  const bLP = ctx.createBiquadFilter(); bLP.type = 'lowpass'; bLP.frequency.value = 420; bLP.connect(music);
  for (let b = Math.ceil(T.B / 1.2); b * 1.2 < T.H + 0.01; b++) {
    const t = b * 1.2, i = Math.floor(t / CH + 1e-6), end = t >= T.H - 0.01;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(ROOT[chordAt(i)]);
    const g = ctx.createGain(); o.connect(g); g.connect(bLP);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + (end ? 4 : 1.1));
    o.start(t); o.stop(t + (end ? 4.1 : 1.15));
  }
  // arp with a little echo
  const aLP = ctx.createBiquadFilter(); aLP.type = 'lowpass'; aLP.frequency.value = 2800; aLP.connect(music);
  const dly = ctx.createDelay(1); dly.delayTime.value = 0.45; const fb = ctx.createGain(); fb.gain.value = 0.3; const wet = ctx.createGain(); wet.gain.value = 0.3;
  aLP.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(music);
  const PAT = [0, 1, 2, 1, 0, 2, 1, 2];
  const inArp = t => (t >= T.D1 && t < T.F7) || (t >= T.G && t < T.H);
  for (let b = Math.ceil(T.D1 / 0.3); b * 0.3 < T.H; b++) {
    const t = b * 0.3; if (!inArp(t)) continue;
    const m = PROG[chordAt(Math.floor(t / CH + 1e-6))][PAT[b % 8]] + 12;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
    const g = ctx.createGain(); o.connect(g); g.connect(aLP);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.start(t); o.stop(t + 0.3);
  }
  // light drums from part 2
  const inDrums = t => (t >= T.E1 && t < T.F7) || (t >= T.G && t < T.H);
  for (let b = Math.ceil(T.E1 / 0.6); b * 0.6 < T.H; b++) {
    const t = b * 0.6; if (!inDrums(t)) continue;
    if (b % 2 === 0) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      const g = ctx.createGain(); o.connect(g); g.connect(music);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.34, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o.start(t); o.stop(t + 0.35);
    }
    const th = t + 0.3; if (th < T.E2 || !inDrums(th)) continue;
    const n = ctx.createBufferSource(); n.buffer = noise;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = ctx.createGain(); n.connect(hp); hp.connect(g); g.connect(music);
    g.gain.setValueAtTime(0.0001, th); g.gain.linearRampToValueAtTime(0.05, th + 0.003); g.gain.exponentialRampToValueAtTime(0.001, th + 0.05);
    n.start(th, R() * 0.8, 0.07);
  }
  // sound effects
  for (const [t, n, g, r] of allCues()) {
    if (!sfx[n] || t < 0 || t >= DUR) continue;
    const src = ctx.createBufferSource(); src.buffer = sfx[n]; src.playbackRate.value = r;
    const gn = ctx.createGain(); gn.gain.value = g; src.connect(gn); gn.connect(fx); src.start(t);
  }
};

// ---------- preview ----------
if (RENDER) { document.getElementById('ui').remove(); }
else {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 56) / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - 56 - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = 'Cargando audio…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pp.textContent = 'Pausa';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
  function now() { return playing ? (offset + ac.currentTime - startAt) % DUR : offset; }
  pp.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  scrub.oninput = () => { const was = playing; pause(); offset = scrub.value / 1000 * DUR; if (was) play(); };
  (function loop() { const t = now(); seek(t); if (document.activeElement !== scrub) scrub.value = Math.round(t / DUR * 1000); tc.textContent = t.toFixed(1) + ' s'; requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
