<script>
/* Beat sheet: the whole timeline comes from the voiceover (build.py -> TL).
   Each chapter: colour iris + numbered title card (whoosh, pop) -> scene whose elements
   pop in on the words that name them (pop), with dings on "success" moments, ticks on
   counting, a click on the key turning, a soft impact on the factory breaking.
   intro   hello cell, title, three questions
   1 energia   kid -> zoom into cells; cell needs energy; food -> glucose; glucose rides the blood road
   2 llave     closed door; insulin = key; made in the pancreas factory; key opens door, cell fills up
   3 diabetes  factory stops; confused defenders break it; sugar jam; thirst/pee/tired; not your fault
   4 insulina  pen & pump; slow vs fast; 5 steps (wash, dial, site, pinch+press, count to 10)
   5 medir     drop of blood; finger prick vs sensor; low / green zone / high
   6 hipohiper hipo = low, hiper = high; causes, signs, what to do, rescue kit
   7 comida    carbs vs not; counting; the plate; water vs sweets; sport
   8 final     still you; you can do everything; not alone; key superhero; end card */
const TL = /*TIMELINE*/null, EMO = /*EMOJI*/null;
const RENDER = location.search.includes('render');
if (RENDER) document.documentElement.classList.add('render');
window.VIDEO = { w: 1920, h: 1080, duration: TL.duration };
const INK = '#1F2A44', SKIN = '#F4C29E', SKIN_D = '#D99A74', HAIR = '#5B3A29';

// ---------------------------------------------------------------- helpers
function spring(t, w = 14, z = 0.82) {

const lerp = (a, b, k) => a + (b - a) * k;

// ---------------------------------------------------------------- timeline
const L = id => { const l = TL.lines[id]; if (!l) throw new Error('no line ' + id); return l; };
function Wc(id, c) {

  return l.e;
}
// time at which the narration reaches `sub` inside line `id`
function W(id, sub, off = 0) {
  let c = L(id).text.indexOf(sub);
  if (c < 0) { console.warn(`W: "${sub}" not in ${id}`); c = 0; }
  return Wc(id, c) + off;
}
const CUES = []; window.CUES = CUES;
const cue = (t, cat, gain = 1) => { if (t >= 0 && t < TL.duration) CUES.push({ t: +t.toFixed(3), cat, gain }); };

// ---------------------------------------------------------------- DOM
const stage = document.getElementById('stage');
function A(parent, html, ax = -50) { const d = document.createElement('div'); d.className = 'a'; d.innerHTML = html; d._ax = ax; parent.appendChild(d); return d; }
function set(el, x, y, s = 1, r = 0, o = 1, sx = 1, sy = 1) {
  if (!(o > 0.002 && Math.abs(s) > 0.002)) { if (el._v !== 0) { el.style.visibility = 'hidden'; el._v = 0; } return; }
  if (el._v !== 1) { el.style.visibility = 'visible'; el._v = 1; }
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${el._ax}%,-50%) scale(${(s * sx).toFixed(4)},${(s * sy).toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
  el.style.opacity = o >= 0.999 ? '' : o.toFixed(3);

const EM = (n, size = 120) => `<svg width="${size}" height="${size}" viewBox="0 0 32 32">${EMO[n]}</svg>`;
const T = (txt, size = 64, color = INK, weight = 700, extra = '') => `<div class="tx" style="font-size:${size}px;color:${color};font-weight:${weight};${extra}">${txt}</div>`;
const PILL = (txt, bg, fg = '#fff', size = 46) => `<div class="pill" style="background:${bg};color:${fg};font-size:${size}px">${txt}</div>`;
const CARD = (inner, w, h, bg = '#fff') => `<div class="card" style="width:${w}px;height:${h}px;background:${bg}">${inner}</div>`;
const BUB = (txt, size = 56) => `<div class="bub" style="font-size:${size}px">${txt}</div>`;
const ICOL = (icon, label, size = 40, color = INK) => `<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${icon}<div class="lab" style="font-size:${size}px;color:${color}">${label}</div></div>`;
const STEP = (n, txt, col) => `<div class="step"><div class="num" style="background:${col}">${n}</div>${txt}</div>`;
const QM = '<div class="qm">?</div>';

// pop-in with a bouncy spring at tin, shrink away at tout
function life(t, tin, tout = 1e9, o = {}) {
  if (t < tin) return 0;
  const od = o.outDur ?? 0.3;
  if (t > tout + od) return 0;
  let k = o.fade ? easeOut(seg(t, tin, tin + 0.45)) : spring(t - tin, o.w ?? 15, o.z ?? 0.55);
  if (t > tout) k *= 1 - easeIn(seg(t, tout, tout + od));
  return Math.max(0, k);
}
// a list of simple elements that pop in and out; returns add(), upd(t)
function popper(parent) {
  const list = [];
  const add = (html, x, y, tin, tout = 1e9, s = 1, opt = {}) => {
    const el = A(parent, html, opt.ax ?? -50);
    const it = { el, x, y, tin, tout, s, opt };
    list.push(it);
    if (opt.sfx !== false) cue(tin, opt.sfx || 'pop', opt.gain ?? 0.55);
    return it;
  };
  const upd = t => {
    for (const it of list) {
      const o = it.opt, k = life(t, it.tin, it.tout, o);
      if (k <= 0.002) { set(it.el, 0, 0, 0); continue; }
      let x = it.x, y = it.y, r = o.r || 0, s = it.s;
      if (o.move) [x, y] = o.move(t);
      if (o.bob) y += wave(t, 0.45, it.x * 0.0013) * o.bob;
      if (o.wig) r += wave(t, 0.6, it.y * 0.002) * o.wig;
      if (o.pulse) s *= 1 + Math.max(0, wave(t, 1.1)) * o.pulse;
      if (o.shake) x += Math.sin(t * 55) * o.shake;
      set(it.el, x, y, s * k, r, o.fade ? k : 1);
    }
  };
  return { add, upd, list };
}
// re-uses n elements to emit one every `period` seconds between t0 and t1
function emitter(parent, html, n, period, t0, t1, lifeT, path) {
  const els = Array.from({ length: n }, () => A(parent, html));
  return (t, ox = 0, oy = 0, sc = 1) => {
    for (let k = 0; k < n; k++) {
      const el = els[k];
      if (t < t0) { set(el, 0, 0, 0); continue; }
      let j = Math.floor((t - t0) / period);
      j -= ((j - k) % n + n) % n;
      const te = t0 + j * period, age = t - te;
      if (j < 0 || te > t1 || age > lifeT) { set(el, 0, 0, 0); continue; }
      const p = path(age, j);
      set(el, ox + p.x * sc, oy + p.y * sc, (p.s ?? 1) * sc, p.r || 0, p.o ?? 1);
    }
  };
}

// ---------------------------------------------------------------- effects canvas
const fx = document.getElementById('fx').getContext('2d');
const BURSTS = [], PALETTE = ['#FF6B6B', '#FFD43B', '#51CF66', '#339AF0', '#CC5DE8', '#FF922B', '#20C997'];
function burst(t, x, y, kind = 'sparkle', n = 12, spread = 1) { BURSTS.push({ t, x, y, kind, n, spread, seed: 9973 * (BURSTS.length + 1) }); }
function star(x, y, r, col) {
  if (r <= 0.5) return;
  fx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * 0.38 : r; fx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  fx.closePath(); fx.fillStyle = col; fx.fill();
}
function drawFx(t) {
  fx.clearRect(0, 0, 1920, 1080);
  for (const b of BURSTS) {
    const age = t - b.t, lifeT = b.kind === 'confetti' ? 3 : 1;
    if (age < 0 || age > lifeT) continue;
    const R = rng(b.seed);
    for (let i = 0; i < b.n; i++) {
      const a = R() * Math.PI * 2, v = R(), col = PALETTE[Math.floor(R() * PALETTE.length)], sp = (R() - .5) * 14, sz = R();
      if (b.kind === 'confetti') {
        const vx = Math.cos(a) * (300 + v * 700) * b.spread, vy = -500 - v * 900 + Math.sin(a) * 200;
        const k = (1 - Math.exp(-2.2 * age)) / 2.2;
        const x = b.x + vx * k, y = b.y + vy * k + 330 * age * age, s = 12 + sz * 12;
        fx.save(); fx.translate(x, y); fx.rotate(sp * age); fx.scale(1, Math.cos(age * (5 + i % 4)));
        fx.globalAlpha = 1 - seg(age, 2.3, 3); fx.fillStyle = col; fx.fillRect(-s / 2, -s / 4, s, s / 2); fx.restore();
      } else {
        const d = (90 + v * 170) * b.spread * easeOut(age / 0.7);
        star(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, Math.sin(Math.PI * clamp(age / lifeT)) * (12 + sz * 16), col);
      }
    }
  }
}

// ---------------------------------------------------------------- characters
function blobPath(R, wob, seed) {
  const N = 8, r = rng(seed), p = [];
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2, rr = R + (r() - .5) * wob; p.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < N; i++) {
    const p0 = p[(i - 1 + N) % N], p1 = p[i], p2 = p[(i + 1) % N], p3 = p[(i + 2) % N];
    d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + 'Z';
}
const MOUTH = {
  happy: '<path d="M-12 26 Q22 62 56 26" fill="none" stroke="#7A1F3D" stroke-width="9" stroke-linecap="round"/>',
  big: '<path d="M-18 20 Q22 94 62 20 Z" fill="#7A1F3D" stroke="#7A1F3D" stroke-width="6" stroke-linejoin="round"/><path d="M4 54 Q22 72 40 54 Q22 46 4 54Z" fill="#FF6B8A"/>',
  sad: '<path d="M-6 56 Q22 28 50 56" fill="none" stroke="#7A1F3D" stroke-width="9" stroke-linecap="round"/>',
  worried: '<path d="M-8 46 Q7 34 22 46 Q37 58 52 46" fill="none" stroke="#7A1F3D" stroke-width="8" stroke-linecap="round"/>',
  o: '<ellipse cx="22" cy="42" rx="14" ry="17" fill="#7A1F3D"/>',
  tired: '<path d="M2 46 L42 46" fill="none" stroke="#7A1F3D" stroke-width="9" stroke-linecap="round"/>',
};
const BROW_SAD = '<path d="M-40 -70 L2 -82" stroke="#7A1F3D" stroke-width="8" stroke-linecap="round"/><path d="M42 -82 L84 -70" stroke="#7A1F3D" stroke-width="8" stroke-linecap="round"/>';
function cellSVG(seed) {
  return `<svg width="360" height="360" viewBox="-180 -180 360 360">
  <circle class="glow" r="182" fill="url(#gGlow)" opacity="0"/>
  <path class="body" d="${blobPath(150, 16, seed)}" fill="#FF9EB5" stroke="#E0567A" stroke-width="8"/>
  <ellipse cx="44" cy="-96" rx="46" ry="19" fill="#fff" opacity=".35" transform="rotate(18 44 -96)"/>
  <g transform="translate(-136,36)">
    <rect x="-34" y="-56" width="68" height="112" rx="32" fill="#5A2D12"/>
    <g class="panel"><rect x="-34" y="-56" width="68" height="112" rx="32" fill="#E08E45" stroke="#8A4B1F" stroke-width="6"/><circle cx="17" cy="6" r="6" fill="#FFD43B"/><circle cx="-6" cy="-8" r="8" fill="#3B2412"/><path d="M-11 -4 L-1 -4 L-3 15 L-9 15Z" fill="#3B2412"/></g>
  </g>
  <g class="eye" transform="translate(-12,-28)"><ellipse rx="24" ry="28" fill="#fff"/><circle cx="3" cy="4" r="13" fill="${INK}"/><circle cx="8" cy="-2" r="5" fill="#fff"/></g>
  <g class="eye" transform="translate(56,-28)"><ellipse rx="24" ry="28" fill="#fff"/><circle cx="3" cy="4" r="13" fill="${INK}"/><circle cx="8" cy="-2" r="5" fill="#fff"/></g>
  <g class="brows"></g>
  <ellipse cx="-46" cy="18" rx="20" ry="12" fill="#FF5C8A" opacity=".45"/><ellipse cx="92" cy="18" rx="20" ry="12" fill="#FF5C8A" opacity=".45"/>
  <g class="mouth"></g>
  </svg>`;
}
// keyhole of a cell drawn at (x, y) with scale s
const keyholeOf = (x, y, s) => [x - 142 * s, y + 30 * s];
function makeCell(parent, seed = 3) {
  const el = A(parent, cellSVG(seed)), q = c => el.querySelector(c);
  const body = q('.body'), glow = q('.glow'), panel = q('.panel'), eyes = el.querySelectorAll('.eye'), mouth = q('.mouth'), brows = q('.brows');
  let lm = '', lb = '';
  return { el, upd(t, p) {
    const { x, y, s = 1, mood = 'happy', energy = 1, door = 0, r = 0, o = 1, squash = 0 } = p;
    if (s <= 0.002 || o <= 0.002) { set(el, 0, 0, 0); return; }
    if (mood !== lm) { mouth.innerHTML = MOUTH[mood]; lm = mood; }
    const b = ['sad', 'worried', 'tired'].includes(mood) ? BROW_SAD : '';
    if (b !== lb) { brows.innerHTML = b; lb = b; }
    body.setAttribute('fill', mixColor('#E2C7CF', '#FF9EB5', energy));
    glow.setAttribute('opacity', (clamp((energy - .8) * 5) * (0.75 + 0.25 * wave(t, 1.2))).toFixed(3));
    panel.setAttribute('transform', `translate(-34 0) scale(${(1 - 1.3 * door).toFixed(3)} 1) translate(34 0)`);

}
const SUGAR = `<svg width="64" height="64" viewBox="-32 -32 64 64"><g class="wh"><circle cx="-13" cy="26" r="8" fill="#343A40"/><circle cx="13" cy="26" r="8" fill="#343A40"/><circle cx="-13" cy="26" r="3" fill="#ADB5BD"/><circle cx="13" cy="26" r="3" fill="#ADB5BD"/></g><circle r="26" fill="url(#gSugar)" stroke="#E8A200" stroke-width="3"/><ellipse cx="-9" cy="-12" rx="8" ry="5" fill="#fff" opacity=".75"/><circle cx="-8" cy="-1" r="3.4" fill="#6B4500"/><circle cx="8" cy="-1" r="3.4" fill="#6B4500"/><path class="sm" d="M-7 8 Q0 14 7 8" stroke="#6B4500" stroke-width="2.8" fill="none" stroke-linecap="round"/><path class="sd" d="M-7 12 Q0 6 7 12" stroke="#6B4500" stroke-width="2.8" fill="none" stroke-linecap="round" style="display:none"/></svg>`;
function makeSugar(parent) {
  const el = A(parent, SUGAR), wh = el.querySelector('.wh'), sm = el.querySelector('.sm'), sd = el.querySelector('.sd');
  let lw = -1, ls = -1;
  return { el, upd(x, y, s = 1, { wheels = 0, sad = 0, r = 0, o = 1 } = {}) {
    const w = +wheels.toFixed(2);
    if (w !== lw) { wh.setAttribute('transform', `translate(0 18) scale(${w}) translate(0 -18)`); wh.style.display = w > 0.01 ? '' : 'none'; lw = w; }
    if (sad !== ls) { sm.style.display = sad ? 'none' : ''; sd.style.display = sad ? '' : 'none'; ls = sad; }
    set(el, x, y, s, r, o);

}

  const hearts = emitter(root, EM('red-heart', 70), 14, 0.16, tLove, h4.s - 0.6, 2.2, (a, j) => { const r = rng(j * 13 + 1); return { x: 160 + r() * 1600, y: 980 - a * 420 - r() * 80, s: (0.7 + r() * 0.7) * Math.min(1, a * 5), r: wave(a, 0.6, r()) * 15, o: 1 - seg(a, 1.6, 2.2) }; });
  const tHero = W('h4', 'superhéroe') - 0.4, tEnd = h4.e + 1.6;
  P.add(T('¡SUPERHÉROE DE LAS LLAVES!', 92, C, 700, '-webkit-text-stroke:5px #fff;paint-order:stroke'), 960, 140, tHero + 0.2, tEnd, 1, { sfx: 'ding', gain: 0.9 });
  burst(tHero + 0.3, 520, 620, 'confetti', 80, 1); burst(tHero + 0.3, 1400, 620, 'confetti', 80, 1); burst(tHero + 0.45, 960, 400, 'sparkle', 24, 2.4);
  cue(tHero, 'whoosh', 0.6);
  const orbit = Array.from({ length: 6 }, () => A(root, KEY(110)));
  // end card
  P.add(T('¡Tú puedes!', 170, C), 960, 420, tEnd + 0.3, 1e9, 1, { sfx: 'ding', gain: 0.7 });
  P.add(EM('red-heart', 120), 1490, 360, tEnd + 0.6, 1e9, 1, { pulse: 0.08 });
  P.add(`<div class="tx" style="font-size:40px;font-weight:500;line-height:1.35">Este vídeo explica lo básico.<br>Tu equipo médico te dirá lo que necesitas tú.</div>`, 960, 650, tEnd + 1.0, 1e9, 1, { fade: true, sfx: false });
  P.add(`<div class="tx" style="font-size:22px;font-weight:400;color:#8A8F9E">Iconos: Fluent Emoji (Microsoft, MIT) · Voz: Kokoro TTS</div>`, 960, 1035, tEnd + 1.4, 1e9, 1, { fade: true, sfx: false });
  return t => {
    P.upd(t);
    const kk = life(t, h1.s - 0.25, tEnd), jump = t > tHero ? Math.abs(Math.sin((t - tHero) * 3.2)) * 40 * Math.exp(-(t - tHero) * 0.6) : 0;
    kid.upd(t, { x: 960, y: 560 - jump, s: 0.95 * kk, mood: t > W('h2', 'cole') ? 'big' : 'happy', badge: clamp(spring(t - tBadge, 13, .55)) * (t > tBadge ? 1 : 0), cape: clamp(spring(t - tHero, 9, .7)) * (t > tHero ? 1 : 0), wave: t > tHero + 0.4 ? clamp((t - tHero - 0.4) * 3) : 0 });
    if (t > tLove && t < h4.s) hearts(t); else hearts(-1);
    orbit.forEach((o, i) => { const a = t * 1.3 + i / 6 * Math.PI * 2, k = life(t, tHero + 0.3 + i * 0.05, tEnd); set(o, 960 + Math.cos(a) * 360, 520 + Math.sin(a) * 300, 0.8 * k, Math.cos(a) * 20); });
  };
});

// ---------------------------------------------------------------- title cards, subtitles, background
const over = document.getElementById('over');
const disc = A(over, '<div class="disc"></div>'), discIn = disc.firstChild;
const cardNum = A(over, '<div style="width:190px;height:190px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:700"></div>'), cardNumIn = cardNum.firstChild;
const cardTitle = A(over, '<div class="tx" style="font-size:112px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.12)"></div>'), cardTitleIn = cardTitle.firstChild;
const cardSub = A(over, '<div class="tx" style="font-size:60px;font-weight:500;color:#fff;opacity:.92"></div>'), cardSubIn = cardSub.firstChild;
const tag = A(over, '<div class="pill" style="font-size:30px;padding:10px 26px 12px;background:#fff"></div>', -100), tagIn = tag.firstChild;
SCENES.forEach(sc => {
  if (!sc.meta.n) return;
  const s = sc.info.s;
  cue(s - 0.95, 'whoosh', 0.7); cue(s - 0.2, 'pop', 0.6);
});
let curCard = null;
function updCard(t) {
  let sc = null;
  for (const s of SCENES) if (s.meta.n && t > s.info.s - 0.95 && t < L(s.info.first).e + 0.8) sc = s;
  if (!sc) { [disc, cardNum, cardTitle, cardSub].forEach(e => set(e, 0, 0, 0)); return; }
  if (curCard !== sc) { discIn.style.background = sc.meta.col; cardNumIn.textContent = sc.meta.n; cardNumIn.style.color = sc.meta.col; cardTitleIn.textContent = sc.info.title; cardSubIn.textContent = sc.meta.sub || ''; curCard = sc; }
  const s = sc.info.s, tE = L(sc.info.first).e + 0.15;
  const k = t < tE ? easeOut(seg(t, s - 0.95, s - 0.3)) : 1 - easeIn(seg(t, tE, tE + 0.55));
  set(disc, 960, 540, k, 0);
  set(cardNum, 960, 380, life(t, s - 0.25, tE - 0.1, { outDur: 0.25 }), 0);
  set(cardTitle, 960, 590, life(t, s + 0.02, tE - 0.05, { outDur: 0.25 }), 0);
  set(cardSub, 960, 700, life(t, s + 0.5, tE - 0.05, { outDur: 0.25 }), 0);
}
function updTag(t) {
  const sc = SCENES.find(s => s.meta.n && t > L(s.info.first).e + 0.5 && t < s.ve - 0.6);
  if (!sc) { set(tag, 0, 0, 0); return; }
  const txt = (sc.meta.n === '★' ? '' : 'Parte ' + sc.meta.n + ' · ') + sc.info.title;
  if (tagIn.textContent !== txt) { tagIn.textContent = txt; tagIn.style.color = sc.meta.col; }
  set(tag, 1880, 56, life(t, L(sc.info.first).e + 0.5, sc.ve - 0.9, { fade: true }), 0, 1);
}
// subtitles: split each line into sentence-sized chunks timed by the voice
const SUBS = [];
for (const [id, l] of Object.entries(TL.lines)) {
  if (/^t\d/.test(id)) continue;
  const chunks = [];
  for (const m of l.text.matchAll(/[^.!?…]+[.!?…]*\s*/g)) {
    let s = m[0], c = m.index;
    while (s.trim().length > 72) {
      const cut = [...s.matchAll(/[,:]\s/g)].map(x => x.index + 1).filter(i => i > 18 && i < s.length - 12).sort((a, b) => Math.abs(a - s.length / 2) - Math.abs(b - s.length / 2))[0];
      if (!cut) break;
      chunks.push([c, s.slice(0, cut)]); c += cut; s = s.slice(cut);
    }
    if (s.trim()) chunks.push([c, s]);
  }
  chunks.forEach(([c, s], i) => SUBS.push({ t0: Wc(id, c) - 0.08, t1: i + 1 < chunks.length ? Wc(id, chunks[i + 1][0]) - 0.08 : l.e + 0.35, text: s.trim() }));
}
const subEl = document.getElementById('sub');
let subCur = null;
function updSub(t) {
  const s = SUBS.find(x => t >= x.t0 && t < x.t1);
  if (!s) { subEl.style.visibility = 'hidden'; return; }
  if (s !== subCur) { subEl.textContent = s.text; subCur = s; }
  subEl.style.visibility = 'visible';
  subEl.style.opacity = Math.min(seg(t, s.t0, s.t0 + 0.12), 1 - seg(t, s.t1 - 0.12, s.t1)).toFixed(3);
}
const bgEl = document.getElementById('bg');
const deco = Array.from({ length: 11 }, (_, i) => { const r = rng(i * 101 + 7); return { el: A(bgEl, `<div style="width:${180 + r() * 260}px;height:${180 + r() * 260}px;border-radius:50%;background:#fff;opacity:.38"></div>`), x: r() * 1920, y: r() * 1080, sp: 8 + r() * 14, ph: r() }; });

// ---------------------------------------------------------------- seek
let bgCur = '';
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-3);
  let active = SCENES[0];
  for (const sc of SCENES) {
    const on = t >= sc.vs && t < sc.ve;
    if (on !== sc.on) { sc.root.style.display = on ? 'block' : 'none'; sc.on = on; }
    if (on) { sc.upd(t); active = sc; }
  }
  if (active.meta.bg !== bgCur) { stage.style.background = active.meta.bg; bgCur = active.meta.bg; }
  deco.forEach(d => set(d.el, (d.x + t * d.sp) % 2200 - 140, d.y + wave(t, 0.05, d.ph) * 40, 1, 0));
  drawFx(t); updCard(t); updTag(t); updSub(t);
}
window.seek = seek;

// ---------------------------------------------------------------- preview
if (!RENDER) {
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 56 - 1080 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  const au = document.getElementById('au'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tm = document.getElementById('tm');
  let hasAudio = false, playing = false, offset = 0, start = 0;
  au.addEventListener('canplay', () => hasAudio = true);
  const now = () => hasAudio ? au.currentTime : playing ? offset + (performance.now() - start) / 1000 : offset;
  pp.onclick = () => {
    playing = !playing; pp.textContent = playing ? '❚❚' : '▶';
    if (hasAudio) playing ? au.play() : au.pause(); else if (playing) start = performance.now(); else offset = now();
  };
  scrub.oninput = () => { const t = scrub.value / 10000 * VIDEO.duration; if (hasAudio) au.currentTime = t; offset = t; start = performance.now(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.onclick(); } });
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  (function loop() { let t = now(); if (t >= VIDEO.duration) { t = VIDEO.duration; if (playing) pp.onclick(); } seek(t); scrub.value = t / VIDEO.duration * 10000; tm.textContent = `${fmt(t)} / ${fmt(VIDEO.duration)}`; requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
