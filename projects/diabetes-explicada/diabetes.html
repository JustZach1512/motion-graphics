:root { --ink: #1F2A44; }
html, body { margin: 0; height: 100%; background: #0E1320; overflow: hidden; font-family: 'Fredoka', system-ui, sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink); transform-origin: 0 0; background: #DCF1FF; }
.layer, .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.scene { display: none; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 50% 50%; visibility: hidden; }
.a svg { display: block; overflow: visible; }
.tx { font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; text-align: center; }
.pill { display: inline-block; padding: 14px 38px 17px; border-radius: 999px; font-weight: 600; line-height: 1; box-shadow: 0 6px 0 rgba(31,42,68,.13); }
.card { background: #fff; border-radius: 46px; box-shadow: 0 10px 0 rgba(31,42,68,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-sizing: border-box; }
.ct { font-size: 44px; font-weight: 600; text-align: center; white-space: normal; line-height: 1.1; padding: 0 24px; }
.bub { background: #fff; border-radius: 48px; padding: 22px 46px 26px; font-weight: 700; position: relative; box-shadow: 0 8px 0 rgba(31,42,68,.1); }
.bub::after { content: ''; position: absolute; left: 50px; bottom: -30px; border-style: solid; border-width: 32px 30px 0 0; border-color: #fff transparent transparent transparent; }
.lab { font-size: 40px; font-weight: 600; }
.qm { width: 76px; height: 76px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700; color: #7B61FF; box-shadow: 0 5px 0 rgba(31,42,68,.12); }
.num { width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 700; color: #fff; }
.step { display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 999px; padding: 10px 40px 10px 10px; font-size: 50px; font-weight: 600; box-shadow: 0 6px 0 rgba(31,42,68,.1); }
.disc { width: 2300px; height: 2300px; border-radius: 50%; }

/* Beat sheet: the whole timeline comes from the voiceover (build.py -> TL).
   Each chapter: colour iris + numbered title card (whoosh, pop) -> scene whose elements
   pop in on the words that name them (pop), with dings on "success" moments, ticks on

   intro   hello cell, title, three questions

   2 llave     closed door; insulin = key; made in the pancreas factory; key opens door, cell fills up
   3 diabetes  factory stops; confused defenders break it; sugar jam; thirst/pee/tired; not your fault
   4 insulina  pen & pump; slow vs fast; 5 steps (wash, dial, site, pinch+press, count to 10)
   5 medir     drop of blood; finger prick vs sensor; low / green zone / high
   6 hipohiper hipo = low, hiper = high; causes, signs, what to do, rescue kit
   7 comida    carbs vs not; counting; the plate; water vs sweets; sport
   8 final     still you; you can do everything; not alone; key superhero; end card */
const TL = {"lines": {"i1": {"s": 1.2, "e": 5.138, "text": "¡Hola, hola! Hoy vamos a descubrir un secreto de tu cuerpo.", "seg": [[0, 0.0], [6, 0.965], [12, 3.395], [59, 3.938]]}, "i2": {"s": 5.688, "e": 9.965, "text": "Vamos a ver qué es la diabetes, por qué hay que pincharse, y qué puedes comer.", "seg": [[0, 0.0], [31, 1.76], [78, 4.277]]}, "i3": {"s": 10.515, "e": 12.823, "text": "¿Preparado? ¡Vamos allá!", "seg": [[0, 0.0], [11, 1.065], [24, 2.308]]}, "t1": {"s": 14.973, "e": 17.794, "text": "Parte uno. La energía de tu cuerpo.", "seg": [[0, 0.0], [10, 1.075], [35, 2.821]]}, "a1": {"s": 18.344, "e": 22.803, "text": "Tu cuerpo está hecho de millones de pedacitos chiquititos, que se llaman células.", "seg": [[0, 0], [81, 4.458958333333333]]}, "a2": {"s": 23.953, "e": 29.606, "text": "Las células son como casitas. Y para que puedas correr, jugar y crecer, necesitan energía.", "seg": [[0, 0.0], [29, 2.05], [90, 5.653]]}, "a3": {"s": 30.656, "e": 33.657, "text": "¿Y de dónde sale la energía? ¡De la comida!", "seg": [[0, 0.0], [28, 1.925], [43, 3.001]]}, "a4": {"s": 34.806, "e": 40.213, "text": "Cuando comes, la comida se convierte en azúcar. Su nombre de científico es glucosa.", "seg": [[0, 0], [83, 5.406958333333334]]}, "a5": {"s": 41.963, "e": 47.074, "text": "La glucosa viaja por la sangre, como coches por una carretera, hasta llegar a las células.", "seg": [[0, 0.0], [31, 1.995], [62, 2.775], [90, 5.11]]}, "t2": {"s": 50.024, "e": 52.571, "text": "Parte dos. La llave mágica.", "seg": [[0, 0.0], [10, 1.07], [27, 2.548]]}, "b1": {"s": 53.121, "e": 56.698, "text": "Pero hay un problema: las puertas de las células están cerradas.", "seg": [[0, 0.0], [21, 1.45], [64, 3.577]]}, "b2": {"s": 57.848, "e": 62.029, "text": "Para abrirlas, hace falta una llave especial. Se llama insulina.", "seg": [[0, 0.0], [14, 0.9], [45, 2.8], [64, 4.182]]}, "b3": {"s": 63.379, "e": 68.491, "text": "La insulina se fabrica en el páncreas, una pequeña fábrica que está aquí, detrás de la tripa.", "seg": [[0, 0], [93, 5.111375]]}, "b4": {"s": 70.241, "e": 74.401, "text": "La llave abre la puerta, el azúcar entra... ¡y la célula se llena de energía!", "seg": [[0, 0.0], [24, 0.885], [43, 1.175], [77, 4.16]]}, "t3": {"s": 77.951, "e": 80.313, "text": "Parte tres. ¿Qué es la diabetes?", "seg": [[0, 0.0], [11, 1.005], [32, 2.362]]}, "c1": {"s": 80.863, "e": 85.332, "text": "Cuando alguien tiene diabetes tipo uno, su fábrica de llaves deja de funcionar.", "seg": [[0, 0], [79, 4.46975]]}, "c2": {"s": 86.682, "e": 94.026, "text": "Las defensas del cuerpo, que luchan contra los microbios, se confunden y rompen la fábrica. Nadie sabe muy bien por qué.", "seg": [[0, 0.0], [24, 0.89], [57, 1.175], [91, 5.365], [120, 7.344]]}, "c3": {"s": 95.976, "e": 101.067, "text": "Sin llaves, el azúcar se queda atascado en la sangre, y las células se quedan sin energía.", "seg": [[0, 0.0], [11, 0.77], [53, 4.735], [90, 5.09]]}, "c4": {"s": 102.617, "e": 108.22, "text": "Por eso, sin insulina, el cuerpo tiene mucha sed, hace mucho pis, y se siente muy cansado.", "seg": [[0, 0.0], [22, 1.425], [49, 3.04], [65, 4.14], [90, 5.604]]}, "c5": {"s": 109.77, "e": 116.901, "text": "Y escucha bien: no es culpa tuya. No pasa por comer dulces, ni por nada que hicieras. Y no se contagia.", "seg": [[0, 0.0], [33, 2.275], [85, 5.58], [103, 7.13]]}, "c6": {"s": 119.051, "e": 122.661, "text": "¿Y cómo lo arreglamos? ¡Poniendo las llaves desde fuera!", "seg": [[0, 0.0], [22, 1.54], [56, 3.61]]}, "t4": {"s": 125.011, "e": 128.176, "text": "Parte cuatro. Las llaves que te pones tú.", "seg": [[0, 0.0], [13, 1.25], [41, 3.165]]}, "d1": {"s": 128.726, "e": 135.646, "text": "La insulina se pone con un boli especial, que tiene una aguja muy finita. Algunos niños usan una bomba de insulina.", "seg": [[0, 0.0], [41, 4.1], [73, 5.265], [115, 6.919]]}, "d2": {"s": 136.996, "e": 143.368, "text": "Suele haber dos insulinas: una lenta, que ayuda todo el día y toda la noche, y otra rápida, para las comidas.", "seg": [[0, 0.0], [26, 1.645], [37, 2.505], [109, 6.372]]}, "d3": {"s": 144.918, "e": 148.454, "text": "Así se hace. Paso uno: lávate bien las manos.", "seg": [[0, 0.0], [12, 1.14], [22, 2.015], [45, 3.536]]}, "d4": {"s": 150.604, "e": 156.406, "text": "Paso dos: prepara el boli, y gira la ruedita hasta el número que te digan tus médicos o tu familia.", "seg": [[0, 0.0], [9, 0.675], [99, 5.802]]}, "d5": {"s": 158.356, "e": 165.333, "text": "Paso tres: elige el sitio. La tripa, los muslos, los brazos o el culete. Y cambia de sitio cada vez.", "seg": [[0, 0.0], [26, 1.985], [48, 3.585], [100, 6.977]]}, "d6": {"s": 167.283, "e": 171.773, "text": "Paso cuatro: haz un pellizco suave, pincha, y aprieta el botón hasta el final.", "seg": [[0, 0.0], [35, 2.085], [78, 4.49]]}, "d7": {"s": 173.923, "e": 176.619, "text": "Paso cinco: cuenta hasta diez, despacito.", "seg": [[0, 0.0], [11, 0.87], [41, 2.696]]}, "d7b": {"s": 182.369, "e": 184.258, "text": "Y saca la aguja. ¡Ya está!", "seg": [[0, 0], [26, 1.88825]]}, "d8": {"s": 186.208, "e": 191.02, "text": "Pica un poquito, pero se pasa enseguida. ¡Y cada vez te saldrá mejor!", "seg": [[0, 0.0], [16, 1.17], [40, 2.64], [69, 4.812]]}, "t5": {"s": 193.57, "e": 196.268, "text": "Parte cinco. Mide tu azúcar.", "seg": [[0, 0.0], [12, 1.24], [28, 2.698]]}, "e1": {"s": 196.818, "e": 201.105, "text": "Para saber cuánta insulina necesitas, hay que medir el azúcar de la sangre.", "seg": [[0, 0], [75, 4.287625]]}, "e2": {"s": 202.255, "e": 208.726, "text": "Se puede medir con un pinchacito en el dedo, o con un sensor en el brazo, que lo mide todo el rato y lo envía al móvil.", "seg": [[0, 0.0], [44, 2.395], [119, 6.47]]}, "e3": {"s": 210.676, "e": 218.436, "text": "El azúcar puede estar bajo, alto, o en la zona verde, que es donde queremos que esté. Tu equipo médico te dirá cuál es tu zona verde.", "seg": [[0, 0.0], [33, 6.205], [53, 3.155], [85, 4.615], [133, 7.761]]}, "t6": {"s": 221.386, "e": 224.13, "text": "Parte seis. Bajadas y subidas.", "seg": [[0, 0.0], [11, 1.09], [30, 2.744]]}, "f1": {"s": 224.68, "e": 230.875, "text": "Vas a oír mucho dos palabras: hipo e hiper. Hipo quiere decir bajo. Hiper quiere decir alto.", "seg": [[0, 0.0], [29, 1.905], [67, 4.465], [92, 6.196]]}, "f2": {"s": 232.425, "e": 239.987, "text": "Una hipo es cuando el azúcar baja demasiado. Puede pasar si haces mucho deporte, si comes poco, o si hay demasiada insulina.", "seg": [[0, 0.0], [44, 2.8], [80, 4.985], [95, 5.545], [124, 7.562]]}, "f3": {"s": 241.337, "e": 245.577, "text": "Puedes notar temblores, sudor, mareo, mucha hambre, o sentirte raro.", "seg": [[0, 0.0], [23, 1.385], [68, 4.24]]}, "f4": {"s": 247.127, "e": 254.995, "text": "Si te pasa, para lo que estés haciendo, y avisa enseguida a un adulto. Toma azúcar rápido, como un zumo o unas pastillas de glucosa.", "seg": [[0, 0.0], [70, 4.035], [132, 7.868]]}, "f5": {"s": 256.745, "e": 260.917, "text": "Por eso, lleva siempre azúcar contigo. ¡Es tu kit de rescate!", "seg": [[0, 0.0], [38, 2.535], [61, 4.173]]}, "f6": {"s": 262.667, "e": 268.794, "text": "Una hiper es cuando hay demasiado azúcar. Notas mucha sed, muchas ganas de hacer pis, y cansancio.", "seg": [[0, 0.0], [41, 0.395], [85, 5.01], [98, 6.127]]}, "f7": {"s": 270.344, "e": 276.057, "text": "Avisa a un adulto, mídete, y bebe agua. A lo mejor necesitas un poco más de insulina.", "seg": [[0, 0.0], [26, 4.15], [39, 2.655], [85, 5.713]]}, "t7": {"s": 278.807, "e": 281.324, "text": "Parte siete. ¿Qué puedo comer?", "seg": [[0, 0.0], [12, 1.23], [30, 2.517]]}, "g1": {"s": 281.874, "e": 283.016, "text": "¡Casi de todo!", "seg": [[0, 0], [14, 1.1416666666666666]]}, "g2": {"s": 284.166, "e": 292.043, "text": "Algunas comidas tienen hidratos de carbono, que se convierten en azúcar: el pan, la pasta, el arroz, las patatas, la fruta y la leche.", "seg": [[0, 0.0], [72, 4.06], [80, 4.725], [100, 5.805], [134, 7.877]]}, "g3": {"s": 293.793, "e": 299.275, "text": "Otras casi no suben el azúcar: la carne, el pescado, los huevos, el queso y las verduras.", "seg": [[0, 0.0], [30, 1.855], [40, 2.61], [64, 4.285], [89, 5.483]]}, "g4": {"s": 300.825, "e": 307.796, "text": "Tu familia contará los hidratos de cada comida, para saber cuánta insulina hace falta. ¡Pronto aprenderás tú también!", "seg": [[0, 0.0], [47, 3.375], [86, 5.09], [117, 6.971]]}, "g5": {"s": 309.546, "e": 318.991, "text": "Un plato genial es así: la mitad, verduras. Un trozo, proteína, como carne, pescado o huevo. Y otro trozo, hidratos, como arroz, pasta o pan.", "seg": [[0, 0.0], [43, 2.95], [53, 3.81], [128, 8.635], [141, 9.445]]}, "g6": {"s": 321.141, "e": 331.749, "text": "Para beber, lo mejor es el agua. Los refrescos, los zumos y las chuches suben el azúcar muy rápido. Son perfectos para una hipo, pero el resto del tiempo, solo de vez en cuando.", "seg": [[0, 0.0], [11, 0.685], [32, 3.145], [47, 4.055], [99, 4.645], [128, 7.03], [154, 9.265], [177, 10.608]]}, "g7": {"s": 333.499, "e": 340.276, "text": "Y moverse es genial: jugar y hacer deporte es muy bueno para ti. Solo recuerda medirte, y llevar tu kit de rescate.", "seg": [[0, 0.0], [20, 1.22], [64, 4.825], [87, 5.13], [115, 6.777]]}, "t8": {"s": 343.026, "e": 344.523, "text": "Y lo más importante.", "seg": [[0, 0], [20, 1.496625]]}, "h1": {"s": 345.473, "e": 349.13, "text": "La diabetes es una parte de ti, pero no cambia quién eres.", "seg": [[0, 0.0], [31, 2.08], [58, 3.658]]}, "h2": {"s": 350.48, "e": 356.316, "text": "Puedes ir al cole, jugar con tus amigos, ir a cumpleaños, hacer deporte, y cumplir todos tus sueños.", "seg": [[0, 0], [100, 5.836]]}, "h3": {"s": 358.066, "e": 364.003, "text": "Y no estás solo: tu familia, tus médicos, y mucha gente que te quiere, están contigo en esta aventura.", "seg": [[0, 0], [102, 5.937]]}, "h4": {"s": 365.753, "e": 367.847, "text": "¡Eres un superhéroe de las llaves!", "seg": [[0, 0], [34, 2.093166666666667]]}}, "scenes": [{"name": "intro", "title": "", "first": "i1", "s": 1.2, "e": 14.973}, {"name": "energia",   const C = '#40A02B';
  // g1: almost everything
  P.add(T('¡Casi de todo!', 150, C), 960, 480, g1.s - 0.05, g2.s - 0.2, 1, { sfx: 'ding', gain: 0.6 });
  const all = [EM('red-apple', 120), EM('bread', 120), EM('cheese-wedge', 120), EM('carrot', 120), EM('egg', 120), EM('fish', 120), EM('banana', 120), EM('spaghetti', 120), EM('broccoli', 120), EM('glass-of-milk', 120), EM('cooked-rice', 120), EM('poultry-leg', 120), EM('strawberry', 120), EM('potato', 120)];
  all.forEach((h, i) => { const a = i / all.length * Math.PI * 2; P.add(h, 960 + Math.cos(a) * 640, 480 + Math.sin(a) * 330, g1.s + 0.1 + i * 0.03, g2.s - 0.2, 1, { bob: 10, wig: 8, sfx: i % 4 ? false : 'pop', gain: 0.3 }); });
  // g2: carbs turn into sugar
  P.add(PILL('HIDRATOS DE CARBONO', '#F08C00', '#fff', 56), 960, 150, W('g2', 'hidratos') - 0.1, g3.s - 0.15);
  P.add(`<div style="display:flex;align-items:center;gap:18px">${PILL('se convierten en azúcar', '#FFC300', INK, 46)}${SUGAR_ICON(80)}</div>`, 960, 760, W('g2', 'se convierten') - 0.1, g3.s - 0.15);
  const carbs = [[EM('bread', 170), 'pan', 'el pan'], [EM('spaghetti', 170), 'pasta', 'la pasta'], [EM('cooked-rice', 170), 'arroz', 'el arroz'], [EM('potato', 170), 'patatas', 'las patatas'], [`<div style="display:flex">${EM('red-apple', 120)}${EM('banana', 120)}</div>`, 'fruta', 'la fruta'], [EM('glass-of-milk', 170), 'leche', 'la leche']];
  const up = [];
  carbs.forEach(([h, lab, w], i) => { const tt = W('g2', w) - 0.1, x = 360 + i * 240; P.add(ICOL(h, lab, 40), x, 470, tt, g3.s - 0.15, 1, { bob: 5 }); up.push({ o: makeSugar(root), x, t: tt + 0.45 }); cue(tt + 0.45, 'tick', 0.25); });
  // g3: hardly raise sugar
  P.add(PILL('CASI NO SUBEN EL AZÚCAR', C, '#fff', 56), 960, 150, g3.s - 0.05, g4.s - 0.15);
  const prot = [[EM('poultry-leg', 170), 'carne', 'la carne'], [EM('fish', 170), 'pescado', 'el pescado'], [EM('egg', 170), 'huevos', 'los huevos'], [EM('cheese-wedge', 170), 'queso', 'el queso'], [`<div style="display:flex">${EM('broccoli', 120)}${EM('carrot', 120)}</div>`, 'verduras', 'las verduras']];
  prot.forEach(([h, lab, w], i) => P.add(ICOL(h, lab, 40), 400 + i * 280, 480, W('g3', w) - 0.1, g4.s - 0.15, 1, { bob: 5 }));
  // g4: counting carbs
  const tCount = W('g4', 'contará') - 0.1, tIns = W('g4', 'cuánta insulina') - 0.1, tSoon = W('g4', '¡Pronto') - 0.1;
  P.add(PILL('contamos los hidratos', '#F08C00', '#fff', 46), 580, 200, tCount, g5.s - 0.15);
  [[EM('bread', 160), 380], [EM('red-apple', 160), 580], [EM('glass-of-milk', 160), 780]].forEach(([h, x], i) => {
    P.add(h, x, 440, g4.s + i * 0.1, g5.s - 0.15, 1, { sfx: i ? false : 'pop' });
    P.add(`<div class="num" style="background:#F08C00;width:80px;height:80px;font-size:50px">${i + 1}</div>`, x + 60, 330, tCount + 0.3 + i * 0.4, g5.s - 0.15, 1, { sfx: 'tick', gain: 0.4 });
  });
  P.add(T('=', 140), 1000, 430, tIns - 0.2, g5.s - 0.15);
  P.add(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${penSVG(...ORANGE, 380)}<div style="display:flex;gap:8px">${KEY(90)}${KEY(90)}${KEY(90)}</div></div>`, 1400, 440, tIns, g5.s - 0.15);
  P.add(`<div style="display:flex;align-items:center;gap:16px">${EM('light-bulb', 110)}${PILL('¡Pronto lo harás tú también!', C, '#fff', 48)}</div>`, 960, 730, tSoon, g5.s - 0.15, 1, { sfx: 'ding', gain: 0.5 });
  // g5: the plate
  const tHalf = W('g5', 'la mitad') - 0.1, tProt = W('g5', 'Un trozo') - 0.1, tCarb = W('g5', 'otro trozo') - 0.1;
  const plate = A(root, `<svg width="640" height="640" viewBox="-320 -320 640 640"><circle r="310" fill="#fff" stroke="#DEE2E6" stroke-width="10"/><circle r="266" fill="none" stroke="#F1F3F5" stroke-width="8"/><path class="pv" d="M0 -250 A250 250 0 0 0 0 250 Z" fill="#B2F2BB" opacity="0"/><path class="pp" d="M8 -8 L8 -250 A242 242 0 0 1 250 -8 Z" fill="#FFC9C9" opacity="0"/><path class="pc" d="M8 8 L250 8 A242 242 0 0 1 8 250 Z" fill="#FFEC99" opacity="0"/></svg>`);
  const pv = plate.querySelector('.pv'), pp = plate.querySelector('.pp'), pc = plate.querySelector('.pc');
  const PX = 880, PY = 480, PS = 0.95;
  const onPlate = (list, tt) => list.forEach(([h, dx, dy], i) => P.add(h, PX + dx * PS, PY + dy * PS, tt + 0.15 + i * 0.08, g6.s - 0.15, 1, { sfx: i ? false : 'pop' }));
  onPlate([[EM('broccoli', 120), -150, -110], [EM('carrot', 110), -60, -170], [EM('leafy-green', 120), -180, 30], [EM('tomato', 100), -80, 120], [EM('cucumber', 110), -80, -30], [EM('broccoli', 100), -170, 150]], tHalf);
  onPlate([[EM('poultry-leg', 110), 90, -150], [EM('fish', 100), 170, -70], [EM('egg', 90), 80, -60]], tProt);
  onPlate([[EM('cooked-rice', 110), 90, 80], [EM('spaghetti', 100), 170, 150], [EM('bread', 90), 70, 175]], tCarb);
  P.add(PILL('la mitad: verduras', C, '#fff', 44), 330, 480, tHalf, g6.s - 0.15, 1, { sfx: false });
  P.add(PILL('un trozo: proteína', '#E8590C', '#fff', 44), 1480, 320, tProt, g6.s - 0.15, 1, { sfx: false });
  P.add(PILL('otro trozo: hidratos', '#F08C00', '#fff', 44), 1480, 650, tCarb, g6.s - 0.15, 1, { sfx: false });
  // g6: drinks and sweets
  const tWater = W('g6', 'el agua') - 0.1, tFast = W('g6', 'muy rápido') - 0.1;
  P.add(CARD(`${EM('droplet', 220)}<div class="ct" style="font-size:60px;color:#1C7ED6">¡Agua!</div>`, 460, 520), 420, 480, tWater, g7.s - 0.15);
  P.add(CHECK(100), 600, 260, tWater + 0.3, g7.s - 0.15, 1, { sfx: 'ding', gain: 0.5 });
  [[EM('cup-with-straw', 160), 'refrescos', 'refrescos'], [EM('beverage-box', 160), 'zumos', 'los zumos'], [EM('lollipop', 160), 'chuches', 'chuches']].forEach(([h, lab, w], i) => P.add(ICOL(h, lab, 40), 1060 + i * 260, 360, W('g6', w) - 0.1, g7.s - 0.15, 1, { bob: 5 }));
  P.add(`<div style="display:flex;align-items:center;gap:14px">${EM('rocket', 100)}${PILL('¡suben muy rápido!', '#F08C00', '#fff', 46)}</div>`, 1320, 570, tFast, g7.s - 0.15);
  P.add(`<div style="display:flex;align-items:center;gap:10px">${EM('backpack', 80)}${PILL('perfectos para una hipo', '#FA5252', '#fff', 40)}</div>`, 1320, 720, W('g6', 'perfectos') - 0.1, g7.s - 0.15);
  P.add(PILL('si no, solo de vez en cuando', '#7B61FF', '#fff', 40), 1320, 825, W('g6', 'solo de vez') - 0.2, g7.s - 0.15);
  // g7: move!
  P.add(PILL('¡moverse es genial!', C, '#fff', 56), 960, 160, g7.s - 0.05, 1e9);
  [EM('soccer-ball', 150), EM('bicycle', 160), EM('person-running', 160), EM('basketball', 150), EM('kite', 150)].forEach((h, i) => P.add(h, 360 + i * 300, 410, W('g7', 'jugar') - 0.2 + i * 0.12, 1e9, 1, { move: t => [360 + i * 300, 410 - Math.abs(wave(t, 0.9, i * .2)) * 50], sfx: i % 2 ? false : 'pop' }));
  P.add(ICOL(METER(100), 'mídete', 40), 760, 720, W('g7', 'medirte') - 0.1, 1e9);
  P.add(ICOL(EM('backpack', 150), 'kit de rescate', 40), 1160, 720, W('g7', 'kit de rescate') - 0.1, 1e9);
  return t => {
    P.upd(t);
    up.forEach(u => { const a = seg(t, u.t, u.t + 1.2); u.o.upd(u.x + 70, lerp(380, 280, easeOut(a)), t > u.t && t < g3.s - 0.15 ? spring(t - u.t, 14, .6) : 0); });
    const pk = life(t, g5.s - 0.15, g6.s - 0.15);
    set(plate, PX, PY, PS * pk, 0);
    pv.setAttribute('opacity', clamp((t - tHalf) * 3)); pp.setAttribute('opacity', clamp((t - tProt) * 3)); pc.setAttribute('opacity', clamp((t - tCarb) * 3));
  };
});

// ---------- 8. final
scene('final', root => {
  const P = popper(root), h1 = L('h1'), h2 = L('h2'), h3 = L('h3'), h4 = L('h4');
  const C = '#FF8A00', kid = makeKid(root);
  const tBadge = W('h1', 'una parte de ti') - 0.1, tSame = W('h1', 'no cambia');
  cue(tBadge + 0.1, 'pop', 0.5);
  P.add(`<div style="display:flex;align-items:center;gap:14px">${BUB('¡Sigues siendo tú!', 60)}${EM('red-heart', 110)}</div>`, 1400, 300, tSame - 0.05, h2.s - 0.2);
  const acts = [[EM('school', 170), 'el cole', 'cole', 420, 330], [EM('people-hugging', 170), 'amigos', 'amigos', 420, 700], [EM('birthday-cake', 170), 'cumpleaños', 'cumpleaños', 1500, 330], [EM('soccer-ball', 170), 'deporte', 'deporte', 1500, 700]];
  acts.forEach(([h, lab, w, x, y]) => P.add(ICOL(h, lab, 42), x, y, W('h2', w) - 0.1, h3.s - 0.2, 1, { bob: 8 }));
  P.add(ICOL(EM('glowing-star', 150), 'tus sueños', 42), 960, 150, W('h2', 'sueños') - 0.1, h3.s - 0.2, 1, { sfx: 'ding', gain: 0.5, wig: 8 });
  burst(W('h2', 'sueños') + 0.1, 960, 130, 'sparkle', 14, 1.4);
  P.add(ICOL(`<div style="display:flex;align-items:center">${EM('house', 140)}${EM('red-heart', 90)}</div>`, 'tu familia', 42), 430, 520, W('h3', 'familia') - 0.1, h4.s - 0.2, 1, { bob: 6 });
  P.add(ICOL(EM('woman-health-worker', 170), 'tus médicos', 42), 1490, 520, W('h3', 'médicos') - 0.1, h4.s - 0.2, 1, { bob: 6 });
  const tLove = W('h3', 'mucha gente') - 0.1;
  const hearts = emitter(root, EM('red-heart', 70), 14, 0.16, tLove, h4.s - 0.6, 2.2, (a, j) => { const r = rng(j * 13 + 1); return { x: 160 + r() * 1600, y: 980 - a * 420 - r() * 80, s: (0.7 + r() * 0.7) * Math.min(1, a * 5), r: wave(a, 0.6, r()) * 15, o: 1 - seg(a, 1.6, 2.2) }; });
  const tHero = W('h4', 'superhéroe') - 0.4, tEnd = h4.e + 1.6;
  P.add(T('¡SUPERHÉROE DE LAS LLAVES!', 92, C, 700, '-webkit-text-stroke:5px #fff;paint-order:stroke'), 960, 140, tHero + 0.2, tEnd, 1, { sfx: 'ding', gain: 0.9 });
  burst(tHero + 0.3, 520, 620, 'confetti', 80, 1); burst(tHero + 0.3, 1400, 620, 'confetti', 80, 1); burst(tHero + 0.45, 960, 400, 'sparkle', 24, 2.4);
  cue(tHero, 'whoosh', 0.6);
  const orbit = Array.from({ length: 6 }, () => A(root, KEY(110)));
  // end card
  P.add(T('¡Tú puedes!', 170, C), 960, 420, tEnd + 0.3, 1e9, 1, { sfx: 'ding', gain: 0.7 });
  P.add(EM('red-heart', 120), 1490, 360, tEnd + 0.6, 1e9, 1, { pulse: 0.08 });
  P.add(`<div class="tx" style="font-size:40px;font-weight:500;line-height:1.35">Este vídeo explica lo básico.<br>Tu equipo médico te dirá lo que necesitas tú.</div>`, 960, 650, tEnd + 1.0, 1e9, 1, { fade: true, sfx: false });
  P.add(`<div class="tx" style="font-size:22px;font-weight:400;color:#8A8F9E">Iconos: Fluent Emoji (Microsoft, MIT) · Voz: Kokoro TTS</div>`, 960, 1035, tEnd + 1.4, 1e9, 1, { fade: true, sfx: false });
  return t => {
    P.upd(t);
    const kk = life(t, h1.s - 0.25, tEnd), jump = t > tHero ? Math.abs(Math.sin((t - tHero) * 3.2)) * 40 * Math.exp(-(t - tHero) * 0.6) : 0;
    kid.upd(t, { x: 960, y: 560 - jump, s: 0.95 * kk, mood: t > W('h2', 'cole') ? 'big' : 'happy', badge: clamp(spring(t - tBadge, 13, .55)) * (t > tBadge ? 1 : 0), cape: clamp(spring(t - tHero, 9, .7)) * (t > tHero ? 1 : 0), wave: t > tHero + 0.4 ? clamp((t - tHero - 0.4) * 3) : 0 });
    if (t > tLove && t < h4.s) hearts(t); else hearts(-1);
    orbit.forEach((o, i) => { const a = t * 1.3 + i / 6 * Math.PI * 2, k = life(t, tHero + 0.3 + i * 0.05, tEnd); set(o, 960 + Math.cos(a) * 360, 520 + Math.sin(a) * 300, 0.8 * k, Math.cos(a) * 20); });
  };
});

// ---------------------------------------------------------------- title cards, subtitles, background
const over = document.getElementById('over');
const disc = A(over, '<div class="disc"></div>'), discIn = disc.firstChild;
const cardNum = A(over, '<div style="width:190px;height:190px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:700"></div>'), cardNumIn = cardNum.firstChild;
const cardTitle = A(over, '<div class="tx" style="font-size:112px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.12)"></div>'), cardTitleIn = cardTitle.firstChild;
const cardSub = A(over, '<div class="tx" style="font-size:60px;font-weight:500;color:#fff;opacity:.92"></div>'), cardSubIn = cardSub.firstChild;
const tag = A(over, '<div class="pill" style="font-size:30px;padding:10px 26px 12px;background:#fff"></div>', -100), tagIn = tag.firstChild;
SCENES.forEach(sc => {
  if (!sc.meta.n) return;
  const s = sc.info.s;
  cue(s - 0.95, 'whoosh', 0.7); cue(s - 0.2, 'pop', 0.6);
});
let curCard = null;
function updCard(t) {
  let sc = null;
  for (const s of SCENES) if (s.meta.n && t > s.info.s - 0.95 && t < L(s.info.first).e + 0.8) sc = s;
  if (!sc) { [disc, cardNum, cardTitle, cardSub].forEach(e => set(e, 0, 0, 0)); return; }
  if (curCard !== sc) { discIn.style.background = sc.meta.col; cardNumIn.textContent = sc.meta.n; cardNumIn.style.color = sc.meta.col; cardTitleIn.textContent = sc.info.title; cardSubIn.textContent = sc.meta.sub || ''; curCard = sc; }
  const s = sc.info.s, tE = L(sc.info.first).e + 0.15;
  const k = t < tE ? easeOut(seg(t, s - 0.95, s - 0.3)) : 1 - easeIn(seg(t, tE, tE + 0.55));
  set(disc, 960, 540, k, 0);
  set(cardNum, 960, 380, life(t, s - 0.25, tE - 0.1, { outDur: 0.25 }), 0);
  set(cardTitle, 960, 590, life(t, s + 0.02, tE - 0.05, { outDur: 0.25 }), 0);
  set(cardSub, 960, 700, life(t, s + 0.5, tE - 0.05, { outDur: 0.25 }), 0);
}
function updTag(t) {
  const sc = SCENES.find(s => s.meta.n && t > L(s.info.first).e + 0.5 && t < s.ve - 0.6);
  if (!sc) { set(tag, 0, 0, 0); return; }
  const txt = (sc.meta.n === '★' ? '' : 'Parte ' + sc.meta.n + ' · ') + sc.info.title;
  if (tagIn.textContent !== txt) { tagIn.textContent = txt; tagIn.style.color = sc.meta.col; }
  set(tag, 1880, 56, life(t, L(sc.info.first).e + 0.5, sc.ve - 0.9, { fade: true }), 0, 1);
}
// subtitles: split each line into sentence-sized chunks timed by the voice
const SUBS = [];
for (const [id, l] of Object.entries(TL.lines)) {
  if (/^t\d/.test(id)) continue;
  const chunks = [];
  for (const m of l.text.matchAll(/[^.!?…]+[.!?…]*\s*/g)) {
    let s = m[0], c = m.index;
    while (s.trim().length > 72) {
      const cut = [...s.matchAll(/[,:]\s/g)].map(x => x.index + 1).filter(i => i > 18 && i < s.length - 12).sort((a, b) => Math.abs(a - s.length / 2) - Math.abs(b - s.length / 2))[0];
      if (!cut) break;
      chunks.push([c, s.slice(0, cut)]); c += cut; s = s.slice(cut);
    }
    if (s.trim()) chunks.push([c, s]);
  }
  chunks.forEach(([c, s], i) => SUBS.push({ t0: Wc(id, c) - 0.08, t1: i + 1 < chunks.length ? Wc(id, chunks[i + 1][0]) - 0.08 : l.e + 0.35, text: s.trim() }));
}
const subEl = document.getElementById('sub');
let subCur = null;
function updSub(t) {
  const s = SUBS.find(x => t >= x.t0 && t < x.t1);
  if (!s) { subEl.style.visibility = 'hidden'; return; }
  if (s !== subCur) { subEl.textContent = s.text; subCur = s; }
  subEl.style.visibility = 'visible';
  subEl.style.opacity = Math.min(seg(t, s.t0, s.t0 + 0.12), 1 - seg(t, s.t1 - 0.12, s.t1)).toFixed(3);
}
const bgEl = document.getElementById('bg');
const deco = Array.from({ length: 11 }, (_, i) => { const r = rng(i * 101 + 7); return { el: A(bgEl, `<div style="width:${180 + r() * 260}px;height:${180 + r() * 260}px;border-radius:50%;background:#fff;opacity:.38"></div>`), x: r() * 1920, y: r() * 1080, sp: 8 + r() * 14, ph: r() }; });

// ---------------------------------------------------------------- seek
let bgCur = '';
function seek(t) {
  t = clamp(t, 0, VIDEO.duration - 1e-3);
  let active = SCENES[0];
  for (const sc of SCENES) {
    const on = t >= sc.vs && t < sc.ve;
    if (on !== sc.on) { sc.root.style.display = on ? 'block' : 'none'; sc.on = on; }
    if (on) { sc.upd(t); active = sc; }
  }
  if (active.meta.bg !== bgCur) { stage.style.background = active.meta.bg; bgCur = active.meta.bg; }
  deco.forEach(d => set(d.el, (d.x + t * d.sp) % 2200 - 140, d.y + wave(t, 0.05, d.ph) * 40, 1, 0));
  drawFx(t); updCard(t); updTag(t); updSub(t);
}
window.seek = seek;

// ---------------------------------------------------------------- preview
if (!RENDER) {
  const fit = () => { const k = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 56 - 1080 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  const au = document.getElementById('au'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tm = document.getElementById('tm');
  let hasAudio = false, playing = false, offset = 0, start = 0;
  au.addEventListener('canplay', () => hasAudio = true);
  const now = () => hasAudio ? au.currentTime : playing ? offset + (performance.now() - start) / 1000 : offset;
  pp.onclick = () => {
    playing = !playing; pp.textContent = playing ? '❚❚' : '▶';
    if (hasAudio) playing ? au.play() : au.pause(); else if (playing) start = performance.now(); else offset = now();
  };
  scrub.oninput = () => { const t = scrub.value / 10000 * VIDEO.duration; if (hasAudio) au.currentTime = t; offset = t; start = performance.now(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.onclick(); } });
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  (function loop() { let t = now(); if (t >= VIDEO.duration) { t = VIDEO.duration; if (playing) pp.onclick(); } seek(t); scrub.value = t / VIDEO.duration * 10000; tm.textContent = `${fmt(t)} / ${fmt(VIDEO.duration)}`; requestAnimationFrame(loop); })();
} else seek(0);
</script>
</body>
