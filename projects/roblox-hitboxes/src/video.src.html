<!DOCTYPE html>

<head>

<title>Por qué las hitboxes de Roblox son una mierda</title>
<style>

</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pp">PLAY</button><input id="scrub" type="range" min="0" max="90" step="0.001" value="0"><span id="tc">0.00</span></div>
<script>
/* ============================================================================
  POR QUÉ LAS HITBOXES DE ROBLOX SON UNA MIERDA. 90 s, 1920x1080, 120 BPM (beat = 0.5 s, bar = 2 s)
  Beat sheet (time · what happens · sound)
   0.00  S1 cold open: arena, blue player + orange enemy              · music intro
   0.45  player dashes in                                             · whoosh
   1.50  swing goes clean through the enemy                           · whoosh
   2.00  MISS stamp, music stops for a beat                           · impact
   2.5-4 "Le has dado. / Lo has visto. / Y no cuenta."                · ticks
   5.10  enemy swings from far away                                   · whoosh
   5.50  you get hit anyway (-25)                                     · punch
   7.00  its sword hitbox is revealed (huge)                          · pop, riser to 8.0
   8.00  S2 the hitbox floods the screen green -> title slam          · impact, drop
   9.50  "UNA MIERDA." on ink bar                                     · impact
  10.50  misaligned "hitbox (aprox.)" box                              · glitch
  11.50  the full stop detaches and floods ink                        · whoosh
  12.00  S3 01 LO QUE VES YA PASÓ (header)                             · impact
  13.50  three panels: su ordenador / servidor / tu pantalla          · pop
  21.30  camera pushes into "tu pantalla"                              · whoosh
  22.50  you swing at the enemy you see (the past)                    · whoosh
  23.20  "en tu pantalla: sí"                                          · pop
  24.00  server checks the present: MISS                              · impact
  27.00  S4 02 NADIE REBOBINA                                          · impact
  29.00  rewind 0.7 s, ghost slides back                              · vhs rewind
  30.50  HIT                                                           · ding
  31.00  hard cut: "¿Y en Roblox?"                                     · whoosh
  31.50  NO VIENE DE SERIE                                             · impact
  34.75  "…o no."                                                     · impact
  35.60  accent wipe                                                   · whoosh
  36.00  S5 03 HITBOXES DE UN SOLO FRAME                               · impact
  40.00  one-frame check flashes, enemy arrives late                   · pop
  40.50  MISS                                                          · glitch
  44.00  the box becomes enormous                                      · whoosh
  45.00  HIT from 3 metres                                             · punch
  47.30  giant hitbox floods the screen                                · riser
  48.00  S6 04 TU HITBOX VA DETRÁS DE TI                               · impact
  50.00  dash, swing, server spawns the box where you were            · whoosh
  51.50  MISS                                                          · glitch
  57.40  streak wipe                                                   · whoosh
  58.00  S7 05 SE COMPRUEBA A SALTOS                                   · impact
  60.27  60/s lane: detected                                           · ding
  61.50  20/s lane: goes straight through                             · glitch
  67.40  dot floods blue                                               · whoosh
  68.00  S8 06 ¿QUIÉN DECIDE SI HAS DADO?                              · impact
  69.60  orange half slides in                                         · whoosh
  77.00  "Elijas lo que elijas, alguien se come el lag."              · impact
  80.00  S9 recap (6 rows)                                             · ticks
  85.00  "No es solo tu wifi."                                         · impact
  88.00  final MISS on the hitbox of the sentence                      · impact
  89.30  fade out
============================================================================ */
const W = 1920, H = 1080, DUR = 90, BPM = 120, BEAT = 60 / BPM;
window.VIDEO = { w: W, h: H, duration: DUR };
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// palette
const INK = '#0B0B10', INK2 = '#13131B', CREAM = '#EDEBE4', ACC = '#FF4F1A', BLUE = '#2F47FF', HIT = '#38F28A', WHITE = '#FFFFFF';

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {

}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);

const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };

const shake = (t, t0, amp) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * 9) * Math.sin((t - t0) * 70);

// fonts
const FL = (w, s, fam = 'Inter Tight', st = '') => `${st} ${w} ${s}px "${fam}"`.trim();
const MONO = (s, w = 500) => FL(w, s, 'JetBrains Mono');

function T(str, x, y, { f, c = CREAM, a = 1, al = 'left', ls = 0, stroke = 0 } = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.font = f; ctx.globalAlpha *= a; ctx.textAlign = al; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = c; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); } else { ctx.fillStyle = c; ctx.fillText(str, x, y); }
  ctx.restore();
}
function MW(str, f, ls = 0) { ctx.save(); ctx.font = f; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }

// per-letter masked reveal
function slam(str, x, y, size, t, t0, { w = 900, c = CREAM, al = 'left', ls = -0.02, per = 0.022, fam = 'Inter Tight', st = '', stroke = 0, a = 1, clip = true } = {}) {
  if (t < t0 || a <= 0) return;
  const f = FL(w, size, fam, st), L = ls * size, tw = MW(str, f, L);
  const x0 = al === 'center' ? x - tw / 2 : al === 'right' ? x - tw : x;
  ctx.save(); ctx.font = f; ctx.letterSpacing = L + 'px'; ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = stroke; ctx.lineJoin = 'round';
  ctx.globalAlpha *= a; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  let acc = '';

    const ch = str[i], ox = ctx.measureText(acc).width; acc += ch;
    if (ch === ' ') continue;
    const k = spring(t - t0 - i * per, 20, 0.72); if (k <= 0) continue;
    const dy = (1 - k) * size * 1.15;
    if (stroke) ctx.strokeText(ch, x0 + ox, y + dy); else ctx.fillText(ch, x0 + ox, y + dy);

}
function typed(str, t, t0, cps = 40) { return t < t0 ? '' : str.slice(0, Math.floor((t - t0) * cps)); }
function caret(x, y, size, t, c = CREAM) { if ((t * 2.2) % 1 < .55) { ctx.fillStyle = c; ctx.fillRect(x + 4, y - size * .8, size * .5, size * .95); } }

// rich caption with *accent* words, optional sub line. Pill backing.
function caption(t, t0, t1, lines, { y = 958, size = 42, sub = '', c = CREAM, acc = ACC, back = 'rgba(11,11,16,0.82)' } = {}) {

  const f = FL(650, size), lh = size * 1.22, n = lines.length;
  const subF = MONO(20, 500), subH = sub ? 34 : 0;
  let maxw = 0; for (const l of lines) maxw = Math.max(maxw, MW(l.replace(/\*/g, ''), f));
  if (sub) maxw = Math.max(maxw, MW(sub, subF));
  const top = y - (n - 1) * lh - subH;
  ctx.save(); ctx.globalAlpha *= aOut;
  ctx.fillStyle = back; ctx.beginPath();
  const pw = (maxw + 70) * lerp(.92, 1, kIn), ph = (n - 1) * lh + size + 38 + subH;
  ctx.globalAlpha *= kIn; ctx.roundRect(W / 2 - pw / 2, top - size - 12, pw, ph, 14); ctx.fill(); ctx.globalAlpha /= Math.max(kIn, 1e-4);
  let wi = 0;
  lines.forEach((line, li) => {
    const ly = top + li * lh, tw = MW(line.replace(/\*/g, ''), f);
    let x = W / 2 - tw / 2, accOn = false;
    const toks = line.split(/(\s+)/);
    for (const tok of toks) {
      if (!tok) continue;
      if (/^\s+$/.test(tok)) { x += MW(tok, f); continue; }
      const parts = tok.split('*');
      const k = spring(t - t0 - wi * .035, 18, .85); wi++;
      parts.forEach((p, pi) => {
        if (pi > 0) accOn = !accOn;
        if (!p) return;
        T(p, x, ly + (1 - k) * 22, { f, c: accOn ? acc : c, a: clamp(k * 1.4) }); x += MW(p, f);
      });
    }
  });

// ---------- drawing primitives ----------
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function bgGrid(c = 'rgba(237,235,228,0.035)', step = 80, ox = 0) {
  ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = (ox % step) - step; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
}
function arena(F, { a = 1, c = '237,235,228', x0 = -400, x1 = W + 400 } = {}) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.strokeStyle = `rgba(${c},0.38)`; ctx.lineWidth = 2; line(x0, F, x1, F);
  ctx.strokeStyle = `rgba(${c},0.09)`; ctx.lineWidth = 1.5; ctx.beginPath();
  const depth = H - F + 60;
  for (let i = 1; i <= 9; i++) { const d = Math.pow(i / 9, 1.8) * depth; ctx.moveTo(x0, F + d); ctx.lineTo(x1, F + d); }

  for (let x = -2400; x <= W + 2400; x += 150) { const k = depth / (F - vy); ctx.moveTo(x, F); ctx.lineTo(x + (x - vx) * k, F + depth); }
  ctx.stroke(); ctx.restore();
}
function check(x, y, s, c, lw = 5) { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * .5, y); ctx.lineTo(x - s * .15, y + s * .35); ctx.lineTo(x + s * .5, y - s * .38); ctx.stroke(); ctx.restore(); }
function cross(x, y, s, c, lw = 5) { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - s * .4, y - s * .4); ctx.lineTo(x + s * .4, y + s * .4); ctx.moveTo(x + s * .4, y - s * .4); ctx.lineTo(x - s * .4, y + s * .4); ctx.stroke(); ctx.restore(); }
function rewindIcon(x, y, s, c) { ctx.save(); ctx.fillStyle = c; for (const dx of [0, s * .55]) { ctx.beginPath(); ctx.moveTo(x + dx, y - s * .4); ctx.lineTo(x + dx - s * .55, y); ctx.lineTo(x + dx, y + s * .4); ctx.fill(); } ctx.restore(); }
function arrowDim(x1, x2, y, c, label, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.setLineDash([10, 8]); line(x1, y, x2, y); ctx.setLineDash([]);
  ctx.lineWidth = 3; line(x1, y - 16, x1, y + 16); line(x2, y - 16, x2, y + 16);

}

// hitbox wireframe
function wire(x, y, w, h, c, { a = 1, dash = false, label = '', fill = .12, lw = 2.5, k = 1, labelBelow = false, labelRight = false, lc = INK } = {}) {

  ctx.save(); ctx.globalAlpha *= a;
  const cx = x + w / 2, cy = y + h / 2; ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
  if (fill > 0) { ctx.fillStyle = hexA(c, fill); ctx.fillRect(x, y, w, h); }
  ctx.strokeStyle = c; ctx.lineWidth = lw; if (dash) ctx.setLineDash([14, 9]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
  const L = Math.min(26, w / 4, h / 4); ctx.lineWidth = lw * 2.4; ctx.lineCap = 'square'; ctx.beginPath();
  for (const [px, py, sx, sy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) { ctx.moveTo(px + sx * L, py); ctx.lineTo(px, py); ctx.lineTo(px, py + sy * L); }
  ctx.stroke();
  if (label) { const f = MONO(19, 700), tw = MW(label, f, 1); const ly = labelBelow ? y + h + 6 : y - 34, lx = labelRight ? x + w - tw - 18 + lw / 2 : x - lw / 2; rect(lx, ly, tw + 18, 28, c); T(label, lx + 9, ly + 20, { f, c: lc, ls: 1 }); }

}
function stamp(str, x, y, t, t0, { c = ACC, size = 110, rot = -0.14, t1 = 1e9, back = 'rgba(11,11,16,0.6)' } = {}) {
  if (t < t0 || t > t1) return;
  const k = spring(t - t0, 24, .55), sc = lerp(2.3, 1, k), a = clamp((t - t0) / .05) * (1 - ease(seg(t, t1 - .2, t1)));

  ctx.lineWidth = size * .085; ctx.strokeStyle = c; ctx.stroke();

  ctx.restore();

function dmgPop(str, x, y, t, t0, c = CREAM, size = 64) {
  if (t < t0 || t > t0 + 1.3) return;
  const u = t - t0, k = spring(u, 18, .55), a = 1 - ease(seg(u, .9, 1.3));
  ctx.save(); ctx.translate(x, y - eOut(u / 1.3) * 70); ctx.scale(lerp(.4, 1, k), lerp(.4, 1, k)); ctx.globalAlpha *= a;

function spark(x, y, t, t0, c = WHITE, r = 90) {

function hpBar(x, y, w, v, c = CREAM, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  rect(x - w / 2 - 3, y - 3, w + 6, 18, 'rgba(0,0,0,.55)'); rect(x - w / 2, y, w * clamp(v / 100), 12, c);
  T(Math.round(v) + ' HP', x, y - 10, { f: MONO(18, 700), c, al: 'center' });
  ctx.restore();

// blocky character. origin: feet centre. th = sword-arm angle (0 down, PI/2 forward, PI up)
function drawChar(x, F, o = {}) {
  const s = o.s ?? 1, f = o.face ?? 1, col = o.col ?? BLUE, hurt = o.hurt ?? 0, ghost = o.ghost, run = o.run ?? 0, th = o.th ?? .15, sword = o.sword ?? true;

    ctx.beginPath(); ctx.roundRect(px, py, w, h, r);
    if (ghost) { ctx.setLineDash([11, 8]); ctx.lineWidth = 3.2 / s; ctx.strokeStyle = gc; ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = hexA(gc, .06); ctx.fill(); }

  ctx.save(); ctx.translate(-18, -94); ctx.rotate(-run); P(-17, 0, 34, 94, dark); ctx.restore();
  ctx.save(); ctx.translate(18, -94); ctx.rotate(run); P(-17, 0, 34, 94, dark); ctx.restore();

  // head
  P(-29, -254, 58, 58, head, 12);

  ctx.save(); ctx.translate(55, -182); ctx.rotate(-th - (sword ? 0 : run * .9));

    ctx.beginPath(); ctx.moveTo(-8, 100); ctx.lineTo(8, 100); ctx.lineTo(8, 248); ctx.lineTo(0, 268); ctx.lineTo(-8, 248); ctx.closePath();
    if (ghost) { ctx.setLineDash([11, 8]); ctx.lineWidth = 3.2 / s; ctx.strokeStyle = gc; ctx.stroke(); ctx.setLineDash([]); }

const tipPos = (x, F, s, f, th) => [x + f * s * (55 + 268 * Math.sin(th)), F + s * (-182 + 268 * Math.cos(th))];
function swingTrail(x, F, s, f, thNow, thPrev, c = WHITE, a = .45) {
  if (Math.abs(thNow - thPrev) < .05) return;
  ctx.save(); ctx.translate(x, F); ctx.scale(s * f, s); ctx.translate(55, -182);
  const N = 10;
  for (let i = 0; i < N; i++) {
    const ta = lerp(thPrev, thNow, i / N), tb = lerp(thPrev, thNow, (i + 1) / N);
    const a0 = Math.PI / 2 - ta, a1 = Math.PI / 2 - tb;

}
// sword arm angle track from a list of swings: [tStart] -> windup .2 s, swing .22 s, hold, return
function swingTh(t, starts, { up = 3.5, end = .6, rest = .15, hold = .6 } = {}) {
  let th = rest;
  for (const s0 of starts) {
    if (t < s0) break;
    th = kf([[s0, rest], [s0 + .2, up, eOut], [s0 + .42, end, eIn], [s0 + .42 + hold, end], [s0 + .42 + hold + .3, rest]])(t);
  }

// ---------- texture: vignette + grain ----------
const vig = document.createElement('canvas'); vig.width = W; vig.height = H;

  grain(t);
  hud(t, si + 1, sc.label, sc.hud);
  if (t < .3) rect(0, 0, W, H, `rgba(0,0,0,${1 - seg(t, 0, .3)})`);
  if (t > 89.2) rect(0, 0, W, H, `rgba(0,0,0,${ease(seg(t, 89.2, 89.95))})`);
};

// ============================ MUSIC (synth bed, 120 BPM, Am F C G) ============================
window.buildAudio = async function (ctxA, total = DUR) {
  const R = rng(99), sr = ctxA.sampleRate;
  const nb = ctxA.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  const master = ctxA.createGain(); master.gain.value = .55;
  const comp = ctxA.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .15;
  const lp = ctxA.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000; lp.Q.value = .7;
  master.connect(lp); lp.connect(comp); comp.connect(ctxA.destination);
  const drums = ctxA.createGain(); drums.connect(master);
  const tonal = ctxA.createGain(); tonal.connect(master);   // sidechained bus
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const chords = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];   // Am F C G (voiced around C4)
  const roots = [33, 29, 36, 31];
  const noise = (t, dur, type, f, q, g0) => { const s = ctxA.createBufferSource(); s.buffer = nb; const b = ctxA.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; const g = ctxA.createGain(); g.gain.setValueAtTime(g0, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(b); b.connect(g); g.connect(drums); s.start(t, (R() * 1.5)); s.stop(t + dur + .02); };
  const kick = (t, v = 1) => { const o = ctxA.createOscillator(), g = ctxA.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12); g.gain.setValueAtTime(.95 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .38); o.connect(g); g.connect(drums); o.start(t); o.stop(t + .4); };
  const clap = (t, v = 1) => { for (let i = 0; i < 3; i++) noise(t + i * .012, .16, 'bandpass', 1400, 1.2, .5 * v); };
  const hat = (t, v = 1) => noise(t, .045, 'highpass', 8000, .7, .22 * v);
  const synth = (t, n, dur, type, g0, cutoff, out = tonal, a = .005, sus = false) => { const o = ctxA.createOscillator(), f = ctxA.createBiquadFilter(), g = ctxA.createGain(); o.type = type; o.frequency.value = hz(n); f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(g0, t + a); if (sus) { g.gain.setValueAtTime(g0, t + dur - .25); g.gain.linearRampToValueAtTime(0, t + dur); } else g.gain.exponentialRampToValueAtTime(.0008, t + dur); o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05); };
  // sections: energy level per bar (bar = 2 s)
  const level = t => t < 8 ? 1 : t < 12 ? 3 : t < 80 ? 2 : t < 88 ? 3 : 0;
  const silent = t => (t >= 2.0 && t < 2.5) || (t >= 29.0 && t < 30.4) || (t >= 31.0 && t < 31.5) || t >= 88.6;
  const headers = [12, 27, 36, 48, 58, 68];
  for (let b = 0; b * BEAT < total - .01; b++) {
    const t = b * BEAT, lv = level(t), bar = Math.floor(t / 2), beatIn = b % 4, ch = bar % 4;
    if (beatIn === 0) { let ps = t; while (silent(ps) && ps < t + 2) ps += .05; const pd = t + 2.05 - ps; if (pd > .4) for (const n of chords[ch]) { const cut = lv >= 2 ? 1600 : 1000, g0 = lv >= 2 ? .04 : .05; synth(ps, n, pd, 'sawtooth', g0, cut, tonal, .2, true); synth(ps, n + .08, pd, 'sawtooth', g0 * .9, cut, tonal, .2, true); } }
    if (silent(t)) continue;
    const hdr = headers.some(h => t >= h && t < h + 1.0);
    // drums
    if (lv >= 2 || (lv === 1 && (beatIn === 0 || t >= 6))) if (!hdr) kick(t, lv === 1 ? .7 : 1);
    if (lv >= 2 && (beatIn === 1 || beatIn === 3) && (t >= 36 || lv === 3)) clap(t, .8);
    if (lv >= 1 && !silent(t + BEAT / 2)) hat(t + BEAT / 2, lv === 1 ? .5 : 1);
    if (lv >= 2) { hat(t + BEAT * .25, .35); hat(t + BEAT * .75, .35); }
    // sidechain pump
    tonal.gain.setValueAtTime(lv >= 2 ? .35 : .7, t); tonal.gain.linearRampToValueAtTime(1, t + .22);
    // bass: 8ths on root
    if (lv >= 2) for (const off of [0, .25]) { const tt = t + off; if (!silent(tt)) synth(tt, roots[ch] + (off ? 12 : 0), .22, 'sawtooth', .32, 420); }
    else if (lv === 1 && beatIn === 0) synth(t, roots[ch], 1.8, 'sawtooth', .25, 300, tonal, .05);
    // pad: once per bar
    // arp: 16ths over chord tones
    if (lv >= 2) for (let q = 0; q < 4; q++) { const tt = t + q * BEAT / 4; if (silent(tt)) continue; const n = chords[ch][(b * 4 + q) % 3] + 12 + ((q === 3) ? 12 : 0); synth(tt, n, .14, 'square', .035, 2600); }
  }
  // final hit
  kick(88, 1); for (const n of chords[0]) synth(88, n, 2.2, 'sawtooth', .07, 1400, master, .01);
  // filter breaths on section headers + tape-ish dip on the rewind
  for (const h of headers) { lp.frequency.setValueAtTime(18000, h - .01); lp.frequency.exponentialRampToValueAtTime(700, h + .05); lp.frequency.exponentialRampToValueAtTime(18000, h + 1.4); }
  lp.frequency.setValueAtTime(18000, 28.9); lp.frequency.exponentialRampToValueAtTime(260, 29.3); lp.frequency.setValueAtTime(260, 30.35); lp.frequency.exponentialRampToValueAtTime(18000, 30.6);
};

// ============================ preview player ============================
function fit() { if (RENDER) return; const s = Math.min(innerWidth / W, (innerHeight - 50) / H); document.getElementById('stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
if (!RENDER) {
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tc = document.getElementById('tc');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = '…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pp.textContent = 'PAUSE';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'PLAY'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { const was = playing; pause(); offset = +sc.value; if (was) play(); };
  document.fonts.ready.then(() => (function loop() { const t = now(); seek(t); sc.value = t; tc.textContent = t.toFixed(2); requestAnimationFrame(loop); })());
}
</script>
</body>
</html>
