<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El pueblo que no existía</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Rye'; src: url(node_modules/@fontsource/rye/files/rye-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Special Elite'; src: url(node_modules/@fontsource/special-elite/files/special-elite-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Alfa Slab One'; src: url(node_modules/@fontsource/alfa-slab-one/files/alfa-slab-one-latin-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #111; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #000; }
  body:not(.render) #stage { transform: scale(.42); transform-origin: 0 0; }
  #ui { position: fixed; left: 470px; top: 10px; color: #ddd; font: 14px sans-serif; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ui"><input id="scrub" type="range" min="0" max="60" step="0.033" value="0" style="width:500px"> <span id="tv"></span><br><button id="play">play</button></div>
<script src="build/timings.js"></script>
<script src="src/lib.js"></script>
<script src="src/art.js"></script>
<script src="src/scenes.js"></script>
<script src="src/shots.js"></script>
<script>
// ---- captions: one or two words at a time, like the reference channel ----
const WORDS = TL.lines.flatMap(l => l.words.map((w, i) => ({ ...w, line: l.id, last: i === l.words.length - 1 })));
const GROUPS = [];
for (let i = 0; i < WORDS.length; i++) {
  const w = WORDS[i];
  const gr = { text: w.w, start: w.start, end: w.end, line: w.line };
  // glue short function words to the next word ("un pueblo", "en él.")
  while (i + 1 < WORDS.length && WORDS[i + 1].line === w.line && /^[¿¡]?[\wáéíóúñ]{1,3}$/i.test(WORDS[i].w) && (gr.text + ' ' + WORDS[i + 1].w).length <= 13) {
    i++; gr.text += ' ' + WORDS[i].w; gr.end = WORDS[i].end;
  }
  GROUPS.push(gr);
}
GROUPS.forEach((g, i) => { const n = GROUPS[i + 1]; g.until = n && n.start - g.end < .45 ? n.start : g.end + .3; });
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function caption(t) {
  const g = GROUPS.find(g => t >= g.start - .02 && t < g.until);
  if (!g) return '';
  const p = clamp((t - g.start + .02) / .1), s = lerp(.82, 1, E.back(p));
  const txt = esc(g.text);
  return `<g transform="${tr(540, 1330, s)}">
    <text text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="96" fill="#000" opacity=".35" transform="translate(0 9)" stroke="#000" stroke-width="22" stroke-linejoin="round">${txt}</text>
    <text text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="96" fill="#fff" stroke="#000" stroke-width="20" stroke-linejoin="round" paint-order="stroke">${txt}</text></g>`;
}

const svg = document.getElementById('svg');
let ready = false;
function seek(t) {
  if (!ready) { buildTextures(); ready = true; }
  let sh = SHOTS[0];
  for (const s of SHOTS) if (t >= s.at - 1e-6) sh = s;
  const lt = t - sh.at;
  const fr = Math.floor(t * 30);
  svg.innerHTML = `<defs>${DEFS}${SEPIA}
      <linearGradient id="gSky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f8de4"/><stop offset=".55" stop-color="#7cc0f5"/><stop offset="1" stop-color="#d7efff"/></linearGradient>
      <linearGradient id="gDawn" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6f9fd8"/><stop offset=".5" stop-color="#f3c49a"/><stop offset="1" stop-color="#ffe2b8"/></linearGradient>
    </defs>
    <rect width="1080" height="1920" fill="#000"/>
    ${sh.draw(t, lt)}
    <rect width="1080" height="1920" fill="url(#gVig)"/>
    <image href="${TEX.grain}" x="${-(hash(fr) * 400) | 0}" y="${-(hash(fr + 1) * 400) | 0}" width="1600" height="2400" opacity=".05" style="mix-blend-mode:overlay" preserveAspectRatio="none"/>
    ${caption(t)}`;
}
window.DURATION = END;
window.seek = seek;
window.shotAt = t => { let i = 0; SHOTS.forEach((s, j) => { if (t >= s.at - 1e-6) i = j; }); return i; };
window.cues = () => SHOTS.flatMap(s => [{ t: s.at, type: 'cut', shot: s.i }, ...s.sfx]).filter(c => c.t > 0.05);

// scrubber for previewing in a browser
const scrub = document.getElementById('scrub'), tv = document.getElementById('tv');
scrub.max = END;
const show = () => { seek(+scrub.value); tv.textContent = (+scrub.value).toFixed(2) + ' s'; };
scrub.oninput = show;
let playing = false, t0 = 0;
document.getElementById('play').onclick = () => { playing = !playing; t0 = performance.now() - scrub.value * 1000; const loop = () => { if (!playing) return; scrub.value = ((performance.now() - t0) / 1000) % END; show(); requestAnimationFrame(loop); }; loop(); };
if (location.search.includes('render')) document.body.classList.add('render'); else document.fonts.ready.then(show);
</script>
</body>
</html>
