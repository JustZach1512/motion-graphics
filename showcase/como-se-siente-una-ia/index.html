    const sub = (n, t, dur, vol = .2) => { const o = ctx.createOscillator(); o.frequency.value = M(n); const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.exponentialRampToValueAtTime(vol * .3, t + dur - .1); g.gain.linearRampToValueAtTime(0, t + dur + .1); o.connect(g).connect(master); o.start(t); o.stop(t + dur + .2); };
    const kick = (t, vol = .5) => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(46, t + .12); const g = ctx.createGain(); env(g, t, .002, vol, .34); o.connect(g).connect(master); o.start(t); o.stop(t + .4); };
    const noise = (t, type, f, q, vol, d, out = master) => { const s = ctx.createBufferSource(); s.buffer = nb; const bf = ctx.createBiquadFilter(); bf.type = type; bf.frequency.value = f; bf.Q.value = q; const g = ctx.createGain(); env(g, t, .002, vol, d); s.connect(bf).connect(g).connect(out); s.start(t, (t * 7.3) % 1.5); s.stop(t + d + .05); };
    const hat = (t, vol = .05) => noise(t, 'highpass', 7000, .7, vol * 1.6, .045);
    const snap = (t, vol = .12) => { noise(t, 'bandpass', 1900, 1.3, vol, .09); noise(t, 'bandpass', 1900, 1.3, vol * .5, .2, rv); };
    const shimmer = (t, dur, vol = .016) => [86, 90, 93, 97].forEach((n, i) => { const o = ctx.createOscillator(); o.frequency.value = M(n); const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 1.5 + i * .3); g.gain.linearRampToValueAtTime(0, t + dur); const lfo = ctx.createOscillator(); lfo.frequency.value = 3 + i; const lg = ctx.createGain(); lg.gain.value = vol * .5; lfo.connect(lg).connect(g.gain); o.connect(g).connect(mus); o.start(t); o.stop(t + dur + .1); lfo.start(t); lfo.stop(t + dur + .1); });
    // harmony
    const CH = { D: { r: 38, p: [50, 57, 61, 64, 66], a: [62, 66, 69, 73, 76] }, Bm: { r: 35, p: [47, 54, 57, 62, 66], a: [59, 62, 66, 69, 74] }, G: { r: 43, p: [43, 50, 54, 59, 62], a: [55, 59, 62, 66, 71] },
      A: { r: 45, p: [45, 52, 57, 61, 64], a: [57, 61, 64, 69, 73] }, As: { r: 45, p: [45, 52, 57, 62, 64], a: [57, 62, 64, 69, 74] }, Em: { r: 40, p: [52, 55, 59, 62, 66], a: [64, 67, 71, 74, 78] }, AC: { r: 37, p: [49, 52, 57, 64], a: [57, 61, 64, 69, 73] } };
    const PLAN = ['D', 'D', 'D', 'Bm', 'G', ['As', 'A'], 'Em', ['G', 'A'], 'D', 'Bm', 'G', ['As', 'A'], 'D', 'AC', 'Bm', 'G', ['As', 'A'], 'D', 'D'];
    const PADV = [.018, .02, .022, .022, .022, .024, .026, .03, .036, .034, .028, .03, .026, .026, .026, .028, .03, .034, .03];
    const chordAt = t => { const b = Math.floor(t / BAR), c = PLAN[Math.min(b, PLAN.length - 1)]; return CH[Array.isArray(c) ? c[(t % BAR) >= BAR / 2 ? 1 : 0] : c]; };
    PLAN.forEach((c, b) => { const t0 = b * BAR; (Array.isArray(c) ? c : [c]).forEach((name, h, arr) => { const ch = CH[name], dur = BAR / arr.length, ts = t0 + h * dur; pad(ch.p, ts, dur, PADV[b], b >= 8 && b <= 9 ? 1800 : 1100); if (b >= 2) sub(ch.r, ts, dur, b === 8 ? .1 : .055); }); });
    const r = rng(3);
    for (let b = 0; b < 19; b++) {
      const t0 = b * BAR;
      if (b <= 1) { kick(t0, .3); kick(t0 + .24, .18); }                                                // heartbeat
      for (let i = 0; i < 8; i++) {
        const t = t0 + i * BEAT / 2, ch = chordAt(t), pat = [0, 1, 2, 3, 4, 3, 2, 1][i];
        if ((b >= 2 && b <= 5) || (b >= 12 && b <= 15)) piano(ch.a[pat], t, (i % 2 ? .15 : .22) * (b >= 12 ? 1 : .9), 1.6);
        if (b >= 6 && b <= 7) { glass(ch.a[pat] + 12, t + (r() < .5 ? BEAT / 4 : 0), .05 + r() * .04); }
        if (b >= 10 && b <= 11) [0, 1].forEach(j => piano(ch.a[[0, 2, 1, 3][(i * 2 + j) % 4]] + 12, t + j * BEAT / 4, .1, .35));
        if (b >= 17 && i % 4 === 0) piano(ch.a[(i / 4 + b) % 5] + 12, t, .1, 3);
      }
      for (let k = 0; k < 4; k++) {
        const t = t0 + k * BEAT;
        if (((b >= 3 && b <= 5) || (b >= 12 && b <= 14)) && k % 2 === 0) kick(t, .42);
        if (b >= 10 && b <= 11) kick(t, .36);
        if (b === 15 && k === 0) kick(t, .35);
        if (b >= 12 && b <= 14 && k % 2 === 1) snap(t, .1);
        if ((b >= 4 && b <= 5) || (b >= 10 && b <= 15)) { hat(t + BEAT / 2, .045); if (b >= 12 && b <= 14) hat(t, .022); }
      }
    }
    [[20.0, 78, 2.4, .3], [21.25, 76, 1.2, .2], [21.875, 73, 1.2, .18], [22.5, 74, 2.4, .26], [23.75, 78, 1.8, .28], [24.375, 81, 1.6, .22],
     [30.0, 81, 1.2, .24], [30.625, 78, .6, .18], [31.25, 76, .6, .18], [31.875, 78, 1.2, .2], [32.5, 76, 1.2, .22], [33.125, 73, .6, .16], [33.75, 76, 1.2, .18],
     [35.0, 74, 1.2, .22], [35.625, 73, .6, .16], [36.25, 71, 1.2, .18], [36.875, 73, .6, .16], [37.5, 74, 2.4, .22], [38.75, 71, 1.2, .18],
     [40.0, 73, 2.4, .22], [41.25, 76, 1.2, .24], [42.5, 78, 3.5, .28], [43.75, 81, 2, .18], [45.0, 86, 3.5, .14]].forEach(([t, n, d, v]) => piano(n, t, v, d * 1.6));
    shimmer(20.0, 5.5); shimmer(41.25, 6.2, .013);
    // effects (same timeline as the picture)
    play('pip', 3.75, .5); play('whoosh', 4.2, .45, .9);
    play('swipe', 4.95, .3, .85);
    { const rr = rng(8); CT.forEach((c, i) => MSG[i] === ' ' ? play('click', c, .12, 1.3) : play('tick', c, .32, .85 + rr() * .35, .1)); }
    play('click', 11.85, .5); play('qwoosh', 11.9, .4); play('pop', 12.25, .4, .9); play('blip', 12.62, .25, 1.1);
    play('whoosh', 13.85, .55, .75); play('impact', 14.45, .35, .7);
    TOK.flat().forEach((k, i) => play('blip', k.split, .1, .85 + i * .035, (k.i / 12 - .5) * .6));
    arcEls.forEach((a, k) => play('tick', a.t0, .2, 1.4 + (k % 4) * .12, (k % 3 - 1) * .3));
    play('riser', 17.99, .5); play('qwoosh', 19.3, .3, .85);
    play('impact', 20.0, .95, .85); play('triangle', 20.0, .32); play('triangle', 23.75, .22, 1.06); play('impact', 23.75, .3, .6);
    play('whoosh', 24.95, .35, 1.1);
    cardEls.forEach((c, i) => play('pop', c.t0 + .3, .28, .9 + i * .06, -.2 + i * .1));
    play('glitch', 27.2, .4); play('glitch', 27.5, .4, .9);
    [0, 1, 2].forEach(i => play('blip', LIGHT + i * .1, .14, 1.2 + i * .1)); play('confirm', FINAL, .5);
    play('whoosh', 29.3, .45);
    { const rr = rng(9); WT.forEach(w => play('tick', w, .07, 1.5 + rr() * .5, .15)); }
    play('pop', 36.25, .45); play('bell', 36.9, .3);
    play('whoosh', 39.35, .4, .8);
    play('impact', 41.25, .75, .8); play('triangle', 41.25, .32, .94);
    play('qwoosh', 44.4, .25, .7); play('pip', 46.25, .45);
  };

  // ============================================================ preview / render setup
  window.VIDEO = { w: W, h: H, duration: DUR };
  window.seek = seek;
  const ctl = document.getElementById('ctl');
  if (isRender) { ctl.remove(); seek(0); return; }
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 52) / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,0) scale(${s})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = '…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await window.buildAudio(off); buf = await off.startRendering(); }
    if (offset >= DUR - .05) offset = 0;
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset); startAt = ac.currentTime; playing = true; pp.textContent = '❚❚ Pause';
  }
  function pause() { if (!playing) return; offset = Math.min(DUR, offset + ac.currentTime - startAt); src.stop(); playing = false; pp.textContent = '▶ Play'; }
  const now = () => playing ? Math.min(DUR, offset + ac.currentTime - startAt) : offset;
  pp.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  scrub.oninput = () => { const was = playing; pause(); offset = scrub.value / 1000 * DUR; if (was) play(); };
  (function loop() { const t = now(); if (playing && t >= DUR) pause(); seek(t); scrub.value = t / DUR * 1000; tcEl.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
})();
