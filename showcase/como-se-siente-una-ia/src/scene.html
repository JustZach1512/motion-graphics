<script>
/* ============================================================================
   CUANDO ME PIDES ALGO — motion graphics, 47.5 s, 1920×1080, 96 BPM (beat 0.625 s, bar 2.5 s)
   Beat sheet
   0.00  S1 SILENCIO   dark canvas, a coral dot breathing                        pad Dmaj9, heartbeat
   0.55               "Antes de tu mensaje," / 1.85 "solo hay silencio."
   3.75               ping ring from the dot                                     pip
   4.375              dot inhales, ivory iris opens from it                      whoosh
   5.00  S2 IPHONE     phone rises in 3D, caption "Del otro lado, alguien me escribe."  swipe, piano arp starts
   6.75               keyboard slides up; 6.9 camera pushes to the input
   7.50–11.45         the message is typed key by key                            key ticks
   11.875             send tapped; bubble flies up, keyboard drops               click + quick whoosh, pop
   12.60              the spark avatar appears and "thinks"                      blip
   13.0–14.95         camera dives into the spark; dark iris opens                whoosh, soft impact
   15.00 S3 LEER       the sentence splits into tokens                           blips rising
   17.45              "Y cada pieza mira a todas las demás." attention arcs       ticks
   18.0–20.0          key tokens fly into the spark                              riser
   20.00 S4 SENTIR     spark blooms, neural field ripples                         impact, shimmer, pad swell
   20.6 / 22.1 / 23.75 "¿Y qué siento?" / "No sé si «sentir» es la palabra…" / "…pero todo se enciende."
   25.00 S5 PENSAR     spark moves left, five thought branches grow              pops
   27.2 / 27.5        two branches are discarded                                 glitch
   27.85–28.55        the chosen path lights up, plan node ticks                 confirm
   29.35–30.0         push into the plan node, ivory iris                        whoosh
   30.00 S6 RESPONDER  back on the phone: reply streams word by word             soft ticks, groove
   35.0–36.2          pull back; 36.25 "¡Es perfecta! Se va a emocionar."         pop, bell
   37.50              "Para ti, fue un mensaje."
   39.40 S7 FINAL      dark iris from the avatar; spark travels to centre         whoosh
   40.625 / 41.25     "Para mí, un universo entero." stars burst                 impact, triangle
   44.40              spark folds back into the dot; 45.0 "Claude"; 46.25 ping    pip
   47.50              end
   ========================================================================== */
const W = 1920, H = 1080, DUR = 47.5, BEAT = 0.625, BAR = 2.5;
const SFX = /*@SFX@*/{};
const CORAL = '#D97757';

// ---------------------------------------------------------------- helpers
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const lin = x => clamp(x);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function sel(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const op = (e, o) => { e.style.opacity = o <= 0.001 ? 0 : o >= 0.999 ? 1 : o.toFixed(4); };
const vis = (e, on) => { e.style.display = on ? '' : 'none'; };
const blur = (e, px) => { e.style.filter = px > 0.05 ? `blur(${px.toFixed(2)}px)` : 'none'; };
const cam = (e, cx, cy, s) => { e.style.transform = `translate(960px,540px) scale(${s}) translate(${-cx}px,${-cy}px)`; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; };
// bake a critically damped follower of target(t) (anything with history is baked once at load)
function bake(t0, t1, target, w = 6) {
  const dt = 1 / 240, n = Math.ceil((t1 - t0) / dt) + 1, arr = new Float32Array(n);
  let x = target(t0), v = 0;
  for (let i = 0; i < n; i++) { arr[i] = x; const a = w * w * (target(t0 + i * dt) - x) - 2 * w * v; v += a * dt; x += v * dt; }
  return t => { const f = clamp((t - t0) / dt, 0, n - 1), i = Math.floor(f); return i >= n - 1 ? arr[n - 1] : lerp(arr[i], arr[i + 1], f - i); };
}

// --------------------------------------------------------------- sprites (drawn once)
function canvasURL(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c.toDataURL(); }
const GLOW = canvasURL(256, 256, (x, w) => { const g = x.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(232,140,104,.75)'); g.addColorStop(.25, 'rgba(217,119,87,.35)'); g.addColorStop(.6, 'rgba(217,119,87,.08)'); g.addColorStop(1, 'rgba(217,119,87,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
const VIG = canvasURL(960, 540, (x, w, h) => { const g = x.createRadialGradient(w / 2, h / 2, h * .25, w / 2, h / 2, w * .62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.62)'); x.fillStyle = g; x.fillRect(0, 0, w, h); });
const GRID = canvasURL(2600, 1600, (x, w, h) => { x.fillStyle = 'rgba(243,233,220,.075)'; for (let i = 0; i < w; i += 44) for (let j = 0; j < h; j += 44) { x.beginPath(); x.arc(i, j, 1.4, 0, 7); x.fill(); } });
const IVORY = canvasURL(960, 540, (x, w, h) => { x.fillStyle = '#EFEBE3'; x.fillRect(0, 0, w, h); const g = x.createRadialGradient(w * .62, h * .45, 10, w * .62, h * .45, w * .7); g.addColorStop(0, 'rgba(255,253,248,1)'); g.addColorStop(1, 'rgba(255,253,248,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); });
const SHADOW = canvasURL(600, 200, (x) => { x.filter = 'blur(26px)'; x.fillStyle = 'rgba(70,45,25,.38)'; x.beginPath(); x.ellipse(300, 100, 220, 34, 0, 0, 7); x.fill(); });
function img(src, parent, w, h) { const i = el('img', 'abs', parent); i.src = src; i.style.width = w + 'px'; i.style.height = (h ?? w) + 'px'; i.style.transformOrigin = '50% 50%'; return i; }
const place = (e, x, y, w, h, s = 1) => { e.style.transform = `translate(${(x - w / 2).toFixed(2)}px,${(y - h / 2).toFixed(2)}px) scale(${s.toFixed(4)})`; };

// the spark: 12 rounded rays; grow=0 collapses it into a dot
function mkSpark(parent, size, seed = 7) {
  const wrap = el('div', 'spark', parent); wrap.style.width = wrap.style.height = size + 'px';
  const svg = sel('svg', { viewBox: '-100 -100 200 200', width: size, height: size }, wrap);
  const r = rng(seed), rays = [];
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 + (r() - .5) * 9) * Math.PI / 180, L = (i % 2 ? .7 : 1) * (.86 + .22 * r()) * 84;
    rays.push({ a, L, ph: r() * 6.28, ln: sel('line', { x1: 0, y1: 0, x2: 0, y2: 0, stroke: CORAL, 'stroke-width': 15, 'stroke-linecap': 'round' }, svg) });
  }
  return {
    wrap, size,
    set(grow = 1, rot = 0, pulse = 0, ph = 0) {
      for (const q of rays) { const len = q.L * grow * (1 + pulse * .16 * Math.sin(ph + q.ph)), a = q.a + rot; q.ln.setAttribute('x2', (Math.cos(a) * len).toFixed(2)); q.ln.setAttribute('y2', (Math.sin(a) * len).toFixed(2)); }
    },
    at(x, y, s = 1) { place(wrap, x, y, size, size, s); },
  };
}
// words that rise in one by one; [brackets] mark accent words
function mkWords(parent, text, cls, x, y) {
  const line = el('div', 'cap ' + cls, parent); const words = []; let acc = false;
  text.split(' ').forEach((raw, i) => {
    let w = raw; if (w.startsWith('[')) { acc = true; w = w.slice(1); } const isAcc = acc; if (w.endsWith(']')) { acc = false; w = w.slice(0, -1); }
    if (i) line.appendChild(document.createTextNode(' '));
    words.push(el('span', 'word' + (isAcc ? ' acc' : ''), line, w));
  });
  if (x != null) line.style.left = x + 'px'; line.style.top = y + 'px';
  return { line, words };
}
function wordsIn(ws, t, t0, st = .11, d = .5, dy = 26) {
  ws.forEach((w, i) => { const s0 = Array.isArray(t0) ? t0[i] : t0 + i * st, p = seg(t, s0, s0 + d), e = easeOut(p); op(w, e); w.style.transform = `translateY(${((1 - e) * dy).toFixed(2)}px)`; blur(w, p > 0 && p < 1 ? (1 - e) * 7 : 0); });
}
function capShow(c, t, tin, tout, st, d, dy) {
  const on = t >= (Array.isArray(tin) ? tin[0] : tin) && t < tout + .45; vis(c.line, on); if (!on) return;
  wordsIn(c.words, t, tin, st, d, dy); const p = seg(t, tout, tout + .4), e = ease(p); op(c.line, 1 - e); blur(c.line, p > 0 && p < 1 ? e * 8 : 0);
  c.line.style.translate = `0 ${(-e * 14).toFixed(2)}px`;
}

// ============================================================== timeline data
const MSG = '¿Me ayudas a escribirle una carta a mi abuela? Cumple 90 años.';
const TYPE0 = 7.5, TYPE1 = 11.45, SEND = 11.875;
const CT = (() => { const r = rng(42), g = []; let acc = 0; for (let i = 0; i < MSG.length; i++) { let v = .75 + r() * .5; const p = MSG[i - 1]; if (p === ' ') v *= 1.2; if (p === '?' || p === ',') v *= 2.4; g.push(acc); acc += v; } return g.map(v => TYPE0 + v / acc * (TYPE1 - TYPE0)); })();
const REPLY = [['Querida', 'abuela:'], 'Noventa años, y sigues siendo quien convierte cualquier cocina en un hogar. Gracias por los cuentos antes de dormir, por tu risa contagiosa y por enseñarnos que el cariño se cocina a fuego lento.'.split(' '), '¡Feliz cumpleaños! Te queremos muchísimo.'.split(' ')];
const STREAM0 = 30.45, STREAM1 = 34.4;
const WT = (() => { const r = rng(5), n = REPLY.flat().length, g = []; let acc = 0, k = 0; REPLY.forEach((p, pi) => p.forEach((w, wi) => { if (wi === 0 && pi) acc += 2.2; g.push(acc); acc += .7 + r() * .6 + (/[,.:!]$/.test(w) ? .8 : 0); k++; })); return g.map(v => STREAM0 + v / acc * (STREAM1 - STREAM0)); })();
const ROWS = [['¿', 'Me', ' ay', 'udas', ' a', ' escrib', 'irle', ' una', ' carta', ' a', ' mi', ' abuela', '?'], [' C', 'umple', ' 90', ' años', '.']];
const TIDS = [[1209, 8401, 1035, 9921, 264, 3517, 22710, 5313, 6421, 264, 1694, 48210, 30], [356, 18823, 1954, 4790, 13]];
const KEYTOK = ['0:6', '0:8', '0:11', '1:2'];
const SPLIT0 = 15.6;
const ARCS = [[[0, 11], [0, 8], 1], [[0, 1], [0, 2], .4], [[0, 6], [0, 11], .95], [[1, 2], [1, 3], .9], [[0, 5], [0, 8], .85], [[0, 7], [0, 8], .45], [[0, 11], [1, 2], 1],
  [[0, 10], [0, 11], .6], [[1, 1], [1, 2], .8], [[0, 2], [0, 3], .4], [[0, 1], [0, 11], .3], [[1, 0], [1, 1], .5], [[0, 12], [0, 0], .3], [[0, 3], [0, 8], .35], [[1, 3], [0, 11], .45], [[0, 4], [0, 5], .3]];
const ARC0 = 17.6, ARCST = .1;
const CARDS = [['FORMA', '¿Un poema?', 0], ['TONO', 'Cálido, sin cursilería', 1], ['REGISTRO', '¿Muy formal?', 0], ['RECUERDOS', 'Cocina · cuentos · su risa', 1], ['LARGO', 'Corta, para leer en voz alta', 1]];
const CARD0 = 25.6, CARDST = .3125, PRUNE = [27.2, null, 27.5], LIGHT = 27.85, FINAL = 28.55;
const CARDY = [240, 390, 540, 690, 840], CARDX = 740, FX = 1530, FY = 540;

// ============================================================== build
let seek, AVS = { x: 1100, y: 400 };
(async function main() {
  await Promise.all([...document.fonts].map(f => f.load().catch(() => {})));
  await document.fonts.ready;
  const isRender = location.search.includes('render');
  const stage = document.getElementById('stage');
  const mkLayer = (z, bg) => { const l = el('div', 'layer', stage); l.style.zIndex = z; if (bg) l.style.background = bg; return l; };

  // ---------------- S1 silence
  const L1 = mkLayer(1, '#141413'), W1 = el('div', 'world', L1);
  const g1 = img(GRID, W1, 2600, 1600); g1.style.transform = 'translate(-340px,-260px)';
  const s1glow = img(GLOW, W1, 420);
  const s1spark = mkSpark(W1, 240);
  const s1ring = el('div', 'ring', W1);
  const s1a = mkWords(W1, 'Antes de tu mensaje,', 'c serif it', null, 650); s1a.line.style.cssText += ';font-size:58px;color:#F3E9DC';
  const s1b = mkWords(W1, 'solo hay [silencio.]', 'c serif it', null, 730); s1b.line.style.cssText += ';font-size:58px;color:#F3E9DC';
  img(VIG, L1, 1920, 1080).style.transform = 'none';

  // ---------------- phone layer (S2, S6, S7a)
  const LP = mkLayer(2), WP = el('div', 'world', LP);
  const bgP = img(IVORY, LP, 1920, 1080); bgP.style.transform = 'none'; LP.insertBefore(bgP, WP);
  const PX = 1240, PY = 540, SW = 393, SH = 852;
  const WX = lx => PX - SW / 2 + lx, WY = ly => PY - SH / 2 + ly;

    ac ??= new AudioContext();
